openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    The API gateway for Gravv services.
    Send your API key in the `Api-Key` header to authenticate.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        1 to 255 printable ASCII characters. A retry with the same key within 24
        hours returns the first response, including a 400. After you correct a
        request, send a new key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: payout-inv-114-1
    TransferIdPath:
      name: id
      in: path
      required: true
      description: The transfer `reference` from `POST /v1/transfer`
      schema:
        type: string
        format: uuid
      example: c1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f607
  schemas:
    RemitterVerification:
      type: object
      description: >-
        Your record of how you verified the sender. When your limits policy
        uses attested tiers, the transfer counts against this remitter instead
        of the customer.
      properties:
        remitter_id:
          type: string
          description: Your ID for the sender
          example: rem_8842
        level:
          type: string
          example: enhanced
        provider:
          type: string
          description: Who verified the sender
        provider_reference:
          type: string
        verified_at:
          type: string
          format: date-time
        screening:
          type: object
          description: Each value must be `clear`
          properties:
            sanctions:
              type: string
              example: clear
            pep:
              type: string
              example: clear
            adverse_media:
              type: string
              example: clear
    AdditionalInformation:
      type: object
      description: >-
        Sender details. Some payout routes need them; without them the transfer
        pauses with `sender_details_required`.
      properties:
        remitter_full_name:
          type: string
          example: John Doe
        remitter_country:
          type: string
          description: Alpha-2 code
          example: US
        remitter_document_number:
          type: string
          example: A123456789
        remitter_document_issue_date:
          type: string
          description: YYYY-MM-DD
          example: '2020-01-15'
        remitter_document_expiry_date:
          type: string
          description: YYYY-MM-DD
          example: '2030-01-15'
        remitter_date_of_birth:
          type: string
          description: YYYY-MM-DD, not in the future
          example: '1990-06-25'
        remitter_nationality:
          type: string
          description: Alpha-2 code
          example: US
        remitter_address:
          type: object
          properties:
            address_line1:
              type: string
              example: 123 Main Street
            city:
              type: string
              example: New York
            state:
              type: string
              example: NY
            postal_code:
              type: string
              example: '10001'
            country:
              type: string
              example: US
        remitter_verification:
          $ref: '#/components/schemas/RemitterVerification'
    TransferSource:
      type: object
      required:
        - source_type
        - id
      properties:
        source_type:
          type: string
          description: >-
            A `card` source can only be withdrawn to its own card account. A
            `savings` source withdraws from savings: send the savings account
            id, and the same id as an `internal_account` destination.
          enum:
            - internal_account
            - internal_crypto_wallet
            - card
            - savings
        id:
          type: string
          format: uuid
          description: ID of the account, crypto wallet, card or savings account (UUID version 4)
          example: b9c2cb0d-e09a-496f-8655-d8c4b7aaf2f8
        currency:
          type: string
          description: Accepted but ignored. The transfer uses the source's own currency.
          enum:
            - USD
            - EUR
            - GBP
        crypto_asset:
          type: string
          description: Asset sent, such as `USDC` or `USDT`. Defaults to the network's usual asset.
          example: USDC
    ExternalAccountDestination:
      title: External account
      type: object
      required:
        - destination_type
        - id
      properties:
        destination_type:
          type: string
          enum:
            - external_account
        id:
          type: string
          format: uuid
          description: An `active` external account
        rail:
          type: string
          description: >-
            Payout rail. `ach`, `wire` and `rtp` are US domestic rails; `wire`
            is not an international wire. Leave it out, or send `globalbank`,
            for local bank and mobile money payouts.
          enum:
            - ach
            - wire
            - rtp
            - sepa
            - swift
            - fps
            - globalbank
          example: ach
    InternalAccountDestination:
      title: Internal account
      type: object
      required:
        - destination_type
        - id
      properties:
        destination_type:
          type: string
          enum:
            - internal_account
        id:
          type: string
          format: uuid
          description: An active account. For a `card` source, its own card account.
    InternalCryptoWalletDestination:
      title: Internal crypto wallet
      type: object
      required:
        - destination_type
        - id
      properties:
        destination_type:
          type: string
          enum:
            - internal_crypto_wallet
        id:
          type: string
          format: uuid
        crypto_asset:
          type: string
          description: >-
            Asset received. Between two wallets of the same customer, `USDT` to
            `USDC` or back converts the asset.
          enum:
            - USDC
            - USDT
    CryptoWalletDestination:
      title: Crypto address
      type: object
      required:
        - destination_type
        - wallet_address
        - blockchain_network
      properties:
        destination_type:
          type: string
          enum:
            - crypto_wallet
        wallet_address:
          type: string
          example: '0x25a4c9853e761753ae18d6871731e305b8b0b2a4'
        blockchain_network:
          type: string
          description: Must match the source's network, except for USDC moved between networks
          enum:
            - avalanche
            - ethereum
            - polygon
            - solana
            - stellar
            - tron
            - sui
            - base
          example: polygon
        blockchain_memo:
          type: string
          description: Memo for addresses that need one, such as some stellar exchange addresses
    CardDestination:
      title: Card
      type: object
      required:
        - destination_type
        - id
      properties:
        destination_type:
          type: string
          enum:
            - card
        id:
          type: string
          format: uuid
          description: ID of the card to fund
    SavingsDestination:
      title: Savings
      type: object
      required:
        - destination_type
        - id
      properties:
        destination_type:
          type: string
          enum:
            - savings
        id:
          type: string
          format: uuid
          description: >-
            The savings account id. The source is the same id as an
            `internal_account`. See [Save and withdraw](/platform/savings/save-and-withdraw).
    TransferRequest:
      type: object
      required:
        - source
        - destination
        - amount
        - customer_id
      description: The API ignores unknown fields, so check the spelling.
      properties:
        source:
          $ref: '#/components/schemas/TransferSource'
        destination:
          oneOf:
            - $ref: '#/components/schemas/ExternalAccountDestination'
            - $ref: '#/components/schemas/InternalAccountDestination'
            - $ref: '#/components/schemas/InternalCryptoWalletDestination'
            - $ref: '#/components/schemas/CryptoWalletDestination'
            - $ref: '#/components/schemas/CardDestination'
            - $ref: '#/components/schemas/SavingsDestination'
        amount:
          type: string
          description: >-
            Positive amount in major units of the source currency, with at most
            2 decimal places. Send it as a string; a number is accepted but can
            lose precision.
          example: '250.00'
        customer_id:
          type: string
          format: uuid
          description: The customer sending the transfer (UUID version 4)
          example: bb6c6022-f1d8-492f-80f0-7547134bb42f
        description:
          type: string
          description: Optional note for your records
          example: Invoice 114
        client_reference:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Your unique reference. On tenants whose limits are enforced, a reused
            reference returns the first transfer, or a 409 when the request
            differs. Send it so that a retry does not pay out twice.
          example: inv-114
        client_metadata:
          type: string
          maxLength: 4096
          description: Your data, often JSON text, returned on the transaction
        payment_rail_reference:
          type: string
          maxLength: 140
          description: >-
            Note the receiving bank shows the payee. Plain ASCII, at most 140
            characters. ACH allows 10 letters, digits or spaces. A US wire allows
            35 letters, digits, spaces and / - ? : ( ) . , ' +. Other rails
            ignore it.
          example: INV 114
        supporting_document_ids:
          type: array
          maxItems: 5
          description: >-
            Up to 5 IDs from `POST /v1/transfer/documents` for this customer,
            each unused. Needed when a payout requires a document; otherwise
            the transfer pauses for one.
          items:
            type: string
            format: uuid
        additional_information:
          $ref: '#/components/schemas/AdditionalInformation'
    Requirement:
      type: object
      properties:
        type:
          type: string
          description: >-
            What to send on resume: `remitter_verification`, `screening_clear`,
            `supporting_document`, a sender detail such as `remitter_full_name`,
            or `customer_email` (update the customer, then resume).
            `admin_review` means only Gravv can release it.
          example: remitter_verification
        tier:
          type: string
        levels:
          type: array
          items:
            type: string
        description:
          type: string
    PauseFields:
      type: object
      properties:
        pause_reason:
          type: string
          description: Why the transfer paused
          enum:
            - per_transfer
            - daily
            - weekly
            - monthly
            - annual
            - annual_requires_approval
            - screening
            - sender_details_required
            - supporting_document_required
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        breached_window:
          type: string
          enum:
            - per_transfer
            - daily
            - weekly
            - monthly
            - annual
        remaining_usd:
          type: string
          description: Allowance left in that window, in USD
        expires_at:
          type: string
          format: date-time
          description: When the pause expires, 72 hours by default. The transfer then fails.
    TransferResult:
      type: object
      properties:
        data:
          allOf:
            - type: object
              properties:
                amount:
                  type: string
                  description: The amount, in `amount_currency`
                  example: '250'
                amount_currency:
                  type:
                    - string
                    - 'null'
                  example: USD
                reference:
                  type: string
                  format: uuid
                  description: >-
                    Transfer ID. Use it to resume, and to match webhooks
                    (`event_group_id`).
                date_created:
                  type: string
                  format: date-time
                transfer_status:
                  type: string
                  description: >-
                    `pending` once recorded; the transfer then runs in the
                    background. `paused` means it needs something from you. Read
                    `requirements`, then resume it.
                  enum:
                    - pending
                    - paused
                    - waiting_approval
                    - completed
                    - failed
                transaction_id:
                  type: string
                  format: uuid
                  description: Use it with `GET /v1/transactions/{transaction_id}`
                local_amount:
                  type:
                    - string
                    - 'null'
                  description: What the recipient receives, when there is a currency exchange
                local_currency:
                  type:
                    - string
                    - 'null'
                fee:
                  type: string
                  example: '1.5'
                fee_currency:
                  type:
                    - string
                    - 'null'
                requires_approval:
                  type: boolean
                  description: Always false with an API key
                approval_id:
                  type: string
                  format: uuid
                receive_amount:
                  type: string
                  description: USDT and USDC conversions only. Expected amount received.
                min_receive_amount:
                  type: string
                  description: USDT and USDC conversions only. Minimum amount accepted.
                receive_asset:
                  type: string
                status:
                  type: string
                  description: Paused transfers only
                  enum:
                    - awaiting_remitter_information
                    - awaiting_supporting_document
                park_reason:
                  type: string
                  enum:
                    - remitter_information
                    - supporting_document
            - $ref: '#/components/schemas/PauseFields'
        error:
          type: 'null'
    LimitErrorResponse:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: string
        code:
          type: string
          description: Such as `ERROR_CODE_DUPLICATE_TRANSACTION`
        transfer_status:
          type: string
        window:
          type: string
    ErrorResponse:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: string
          description: What went wrong
    UploadTransferDocumentRequest:
      type: object
      required:
        - customer_id
        - document_type
        - file_name
        - content_type
        - content
      properties:
        customer_id:
          type: string
          format: uuid
          example: bb6c6022-f1d8-492f-80f0-7547134bb42f
        document_type:
          type: string
          enum:
            - invoice
            - proforma_invoice
            - purchase_order
            - contract
            - receipt
            - bill_of_lading
            - customs_declaration
            - bank_statement
            - proof_of_income
            - tax_document
            - other
          example: invoice
        description:
          type: string
          maxLength: 140
          description: Required when `document_type` is `other`
        file_name:
          type: string
          example: inv-2026-114.pdf
        content_type:
          type: string
          description: Must match the file itself
          enum:
            - application/pdf
            - image/png
            - image/jpeg
        content:
          type: string
          description: The file as standard base64, at most 700 KB decoded
          example: <base64>
    ResumeTransferRequest:
      type: object
      additionalProperties: false
      description: >-
        Send what `requirements` asked for. A transfer paused for a document
        takes only `supporting_document_ids`. Unknown fields are rejected.
      properties:
        transfer_id:
          type: string
          format: uuid
          description: Optional. It must match the path.
        remitter_verification:
          $ref: '#/components/schemas/RemitterVerification'
        additional_information:
          $ref: '#/components/schemas/AdditionalInformation'
        supporting_document_ids:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
    RateItem:
      type: object
      properties:
        currency_pair:
          type: string
          description: Four-part pair key, such as `USD_US_NGN_NG`. `USDT_USDC` for a conversion price.
          example: USD_US_NGN_NG
        direction:
          type: string
          example: USD_NGN
        pair_type:
          type: string
          example: fiat
        from_currency:
          type: string
          example: USD
        from_currency_name:
          type: string
          example: US Dollar
        to_currency:
          type: string
          example: NGN
        to_currency_name:
          type: string
          example: NGN
        rate:
          type: string
          example: '1368.27'
        timestamp:
          type: string
          format: date-time
          description: When the rate was set. Check it, as a row can be old.
        send_amount:
          type: string
          description: Conversion price only
        fee:
          type: string
          description: Conversion price only
        fee_currency:
          type: string
          description: Conversion price only
        receive_amount:
          type: string
          description: Conversion price only
        min_receive_amount:
          type: string
          description: Conversion price only
        source_network:
          type: string
          description: Conversion price only
        destination_network:
          type: string
          description: Conversion price only
        expires_at:
          type: string
          format: date-time
          description: Conversion price only
  responses:
    BadRequest:
      description: The request failed. Read `error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            error: internal server error
security:
  - ApiKeyAuth: []
tags:
  - name: Transfer
    description: Send money and look up rates and supported countries
paths:
  /v1/transfer:
    post:
      tags:
        - Transfer
      summary: Create a transfer
      operationId: createTransfer
      description: >-
        Sends money from a customer's account, crypto wallet, card or savings
        to an account, crypto wallet, crypto address, card, savings or external
        account. The
        call returns once the transfer is recorded; it then runs in the
        background. Follow it with `GET /v1/transactions/{transaction_id}` or
        the `transfer.status.*` webhooks.


        A 200 can still be `transfer_status: paused`. Read `requirements`,
        upload documents with `POST /v1/transfer/documents` if asked, then call
        `POST /v1/transfer/{id}/resume`. Put `rail` inside `destination`. Send
        at most 2 decimal places. Most errors are a 400 with no code.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            examples:
              BankPayout:
                summary: Payout to an external account
                value:
                  source:
                    source_type: internal_account
                    id: b9c2cb0d-e09a-496f-8655-d8c4b7aaf2f8
                  destination:
                    destination_type: external_account
                    id: 70c337ad-e3e8-4a90-9de7-7f3e6bc2aac8
                  amount: '250.00'
                  customer_id: bb6c6022-f1d8-492f-80f0-7547134bb42f
                  client_reference: inv-114
                  description: Invoice 114
                  additional_information:
                    remitter_full_name: John Doe
                    remitter_country: US
                    remitter_date_of_birth: '1990-06-25'
                    remitter_address:
                      address_line1: 123 Main Street
                      city: New York
                      state: NY
                      postal_code: '10001'
                      country: US
              UsWire:
                summary: US wire with a note for the payee's bank
                value:
                  source:
                    source_type: internal_account
                    id: b9c2cb0d-e09a-496f-8655-d8c4b7aaf2f8
                  destination:
                    destination_type: external_account
                    id: 70c337ad-e3e8-4a90-9de7-7f3e6bc2aac8
                    rail: wire
                  amount: '1200.00'
                  customer_id: bb6c6022-f1d8-492f-80f0-7547134bb42f
                  client_reference: inv-115
                  payment_rail_reference: INV 115
              InternalTransfer:
                summary: Between two accounts
                value:
                  source:
                    source_type: internal_account
                    id: b9c2cb0d-e09a-496f-8655-d8c4b7aaf2f8
                  destination:
                    destination_type: internal_account
                    id: 915a6953-49a1-4a78-b29d-56d401d9f22a
                  amount: '10.00'
                  customer_id: bb6c6022-f1d8-492f-80f0-7547134bb42f
                  client_reference: move-0042
              CryptoTransfer:
                summary: To a crypto address
                value:
                  source:
                    source_type: internal_account
                    id: b9c2cb0d-e09a-496f-8655-d8c4b7aaf2f8
                  destination:
                    destination_type: crypto_wallet
                    blockchain_network: polygon
                    wallet_address: '0x25a4c9853e761753ae18d6871731e305b8b0b2a4'
                  amount: '2.00'
                  customer_id: bb6c6022-f1d8-492f-80f0-7547134bb42f
                  client_reference: send-0043
              CardFunding:
                summary: Fund a card from a crypto wallet
                value:
                  source:
                    source_type: internal_crypto_wallet
                    id: 67e169c0-547f-410d-8e18-f616b6822d70
                  destination:
                    destination_type: card
                    id: 3397bab8-0f2b-4721-b15b-8c71860f01f9
                  amount: '30.00'
                  customer_id: 04dfb2e5-1274-4214-b5fd-3415fde7dc18
                  client_reference: card-fund-1234
              SaveIntoSavings:
                summary: Save into a savings account
                value:
                  source:
                    source_type: internal_account
                    id: d9eae506-77b4-4e8b-8ab3-caaf96054d79
                  destination:
                    destination_type: savings
                    id: d9eae506-77b4-4e8b-8ab3-caaf96054d79
                  amount: '100.00'
                  customer_id: b140f51d-2598-410a-a583-e1cb7a871443
                  client_reference: save-0001
              WithdrawFromSavings:
                summary: Withdraw from a savings account
                value:
                  source:
                    source_type: savings
                    id: d9eae506-77b4-4e8b-8ab3-caaf96054d79
                  destination:
                    destination_type: internal_account
                    id: d9eae506-77b4-4e8b-8ab3-caaf96054d79
                  amount: '50.00'
                  customer_id: b140f51d-2598-410a-a583-e1cb7a871443
                  client_reference: withdraw-0001
      responses:
        '200':
          description: The transfer is recorded, or paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResult'
              examples:
                Pending:
                  summary: Recorded
                  value:
                    data:
                      amount: '250'
                      amount_currency: USD
                      reference: 3f0c6a8e-6b1d-4c1e-9a55-0d2f7b9e4a11
                      date_created: '2026-10-13T09:15:22.481Z'
                      transfer_status: pending
                      transaction_id: 8d4e2b6c-1f3a-4e7b-b0c9-5a6d7e8f9a01
                      local_amount: '382500'
                      local_currency: NGN
                      fee: '1.5'
                      fee_currency: USD
                      requires_approval: false
                    error: null
                Paused:
                  summary: Paused by a limit
                  value:
                    data:
                      amount: '5000'
                      amount_currency: USD
                      reference: c1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f607
                      date_created: '2026-10-13T09:15:22.481Z'
                      transfer_status: paused
                      transaction_id: 0e1f2a3b-4c5d-4e6f-8a7b-9c0d1e2f3a4b
                      local_amount: null
                      local_currency: null
                      fee: '0'
                      fee_currency: USD
                      requires_approval: false
                      status: awaiting_remitter_information
                      park_reason: remitter_information
                      pause_reason: daily
                      requirements:
                        - type: remitter_verification
                          tier: T2
                          levels:
                            - enhanced
                          description: resume with remitter_verification at one of these levels
                      breached_window: daily
                      remaining_usd: '1200.00'
                      expires_at: '2026-10-16T09:15:22Z'
                    error: null
        '400':
          description: >-
            Invalid request, insufficient balance, or a source, destination or
            external account problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Balance:
                  summary: The source holds too little
                  value:
                    data: null
                    error: insufficient balance
                Payee:
                  summary: The external account is not active
                  value:
                    data: null
                    error: 'payee 70c337ad-e3e8-4a90-9de7-7f3e6bc2aac8 is not active: pending'
        '409':
          description: >-
            `client_reference` was used for a different transfer, or the same one
            is still being set up (retry after 1 second)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
              example:
                data: null
                error: >-
                  client_reference has already been used for a different transfer
                  (the amount, currency, source, destination or remitter differ);
                  use a new client_reference for a new transfer
                code: ERROR_CODE_DUPLICATE_TRANSACTION
        '422':
          description: >-
            The sender is blocked, a supporting document is required, or the
            Idempotency-Key was used with a different body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
              example:
                data: null
                error: transfers are not permitted for this sender
                code: ERROR_CODE_SUBJECT_BLOCKED
        '503':
          description: Limits cannot be checked right now. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
              example:
                data: null
                error: transfer limits are temporarily unavailable, please retry
                code: ERROR_CODE_LIMITS_UNAVAILABLE
  /v1/transfer/documents:
    post:
      tags:
        - Transfer
      summary: Upload a supporting document
      operationId: uploadTransferDocument
      description: >-
        Uploads a document, such as an invoice, for a payout that needs one.
        Pass the returned `id` in `supporting_document_ids` on
        `POST /v1/transfer` or on resume. A document can be used by one
        transfer only, and an unused one is deleted after 7 days. The file must
        be PDF, PNG or JPEG, at most 700 KB.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTransferDocumentRequest'
            example:
              customer_id: bb6c6022-f1d8-492f-80f0-7547134bb42f
              document_type: invoice
              file_name: inv-2026-114.pdf
              content_type: application/pdf
              content: <base64>
      responses:
        '200':
          description: The stored document
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      document_type:
                        type: string
                      description:
                        type: string
                      file_name:
                        type: string
                      content_type:
                        type: string
                      size_bytes:
                        type: integer
                      created_at:
                        type: string
                        format: date-time
                  error:
                    type: 'null'
              example:
                data:
                  id: 5b0d8f3e-2a71-4c4f-9e0b-7d6c1a2b3c4d
                  document_type: invoice
                  file_name: inv-2026-114.pdf
                  content_type: application/pdf
                  size_bytes: 184233
                  created_at: '2026-10-13T09:10:02Z'
                error: null
        '400':
          description: A field or the file is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
              example:
                data: null
                error: 'content: the file is not a application/pdf'
                code: ERROR_CODE_SUPPORTING_DOCUMENT_INVALID
        '404':
          description: The customer is not one of yours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request or file is too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                  error: {}
        '503':
          description: Storage is unavailable. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: document storage is unavailable; retry shortly
  /v1/transfer/{id}/resume:
    post:
      tags:
        - Transfer
      summary: Resume a paused transfer
      operationId: resumeTransfer
      description: >-
        Continues a transfer that returned `transfer_status: paused`, with what
        its `requirements` asked for. When the transfer can go ahead,
        `resumed` is true and Gravv sends the `transfer.resumed` webhook. When
        it still cannot, `resumed` is false and the response lists the new
        requirements. Gravv does not charge the fee again.


        Use a new Idempotency-Key for each attempt with new information, as a
        retry with the same key returns the first answer. A 410 means the pause
        expired or was cancelled; start a new transfer.
      parameters:
        - $ref: '#/components/parameters/TransferIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeTransferRequest'
            example:
              supporting_document_ids:
                - 5b0d8f3e-2a71-4c4f-9e0b-7d6c1a2b3c4d
      responses:
        '200':
          description: The result of the resume
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - type: object
                        properties:
                          transfer_id:
                            type: string
                            format: uuid
                          status:
                            type: string
                            description: Internal step, such as `approved_awaiting_execution`
                          transfer_status:
                            type: string
                            enum:
                              - pending
                              - paused
                          resumed:
                            type: boolean
                          local_amount:
                            type: string
                          local_currency:
                            type: string
                      - $ref: '#/components/schemas/PauseFields'
                  error:
                    type: 'null'
              example:
                data:
                  transfer_id: c1a2b3c4-d5e6-4f70-8a91-b2c3d4e5f607
                  status: approved_awaiting_execution
                  transfer_status: pending
                  resumed: true
                  local_amount: '7650000'
                  local_currency: NGN
                error: null
        '400':
          description: The transfer is not paused, or the body is wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
              example:
                data: null
                error: this transfer is not paused
                transfer_status: completed
        '404':
          description: No such transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: transfer workflow not found
        '409':
          description: The transfer changed while the request ran. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
        '410':
          description: The pause expired or was cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
              example:
                data: null
                error: >-
                  this paused transfer has expired and can no longer be resumed;
                  please initiate a new transfer
                code: ERROR_CODE_TRANSFER_PAUSE_EXPIRED
        '422':
          description: The sender is blocked, or a supporting document is still missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
        '503':
          description: Limits cannot be checked right now. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitErrorResponse'
  /v1/transfer/rates:
    get:
      tags:
        - Transfer
      summary: Get transfer rates
      operationId: getTransferRates
      description: >-
        Without `source_wallet_id`, returns indicative exchange rates, which you
        can filter by `currency`. With `source_wallet_id`,
        `destination_wallet_id`, `receive_asset` and `amount`, it prices a USDT
        and USDC conversion between two wallets of one customer. Neither is a
        locked price; the transfer is priced again when you create it.
      parameters:
        - in: query
          name: currency
          schema:
            type: string
          description: The currency received. Not case-sensitive.
          example: NGN
        - in: query
          name: source_wallet_id
          schema:
            type: string
            format: uuid
          description: Prices a conversion from this crypto wallet
        - in: query
          name: destination_wallet_id
          schema:
            type: string
            format: uuid
          description: Conversion price only. A wallet of the same customer.
        - in: query
          name: receive_asset
          schema:
            type: string
            enum:
              - USDT
              - USDC
          description: Conversion price only. It must differ from the asset sent.
        - in: query
          name: send_asset
          schema:
            type: string
            enum:
              - USDT
              - USDC
          description: Conversion price only. Defaults to the wallet's asset.
        - in: query
          name: amount
          schema:
            type: string
          description: Conversion price only. Positive, with at most 2 decimal places.
      responses:
        '200':
          description: The rates, in one list with no paging
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RateItem'
                  error:
                    type: 'null'
              example:
                data:
                  items:
                    - currency_pair: USD_US_NGN_NG
                      direction: USD_NGN
                      from_currency: USD
                      from_currency_name: US Dollar
                      pair_type: fiat
                      rate: '1368.27'
                      timestamp: '2026-10-13T22:20:08.941956Z'
                      to_currency: NGN
                      to_currency_name: NGN
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/transfer/supported-currencies:
    get:
      tags:
        - Transfer
      summary: List supported currency pairs
      operationId: listTransferSupportedCurrencies
      description: Lists the currency pairs you can pay out in. It takes no filters.
      responses:
        '200':
          description: The currency pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            currency_pair:
                              type: string
                            from_currency:
                              type: string
                            from_currency_name:
                              type: string
                            to_currency:
                              type: string
                            to_currency_name:
                              type: string
                  error:
                    type: 'null'
              example:
                data:
                  items:
                    - currency_pair: USD_NGN
                      from_currency: USD
                      from_currency_name: US Dollar
                      to_currency: NGN
                      to_currency_name: Nigerian Naira
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/transfer/supported-countries:
    get:
      tags:
        - Transfer
      summary: List supported countries
      operationId: listTransferSupportedCountries
      description: >-
        Lists countries with their alpha-3 code and local currency. A listed
        country may still have no payout route open; the transfer then says so.
      parameters:
        - in: query
          name: iso_code
          schema:
            type: string
          description: >-
            Part of an alpha-2 code, not case-sensitive. `N` matches every code
            that contains N.
          example: NG
      responses:
        '200':
          description: The countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      countries:
                        type: array
                        items:
                          type: object
                          properties:
                            iso_code:
                              type: string
                            name:
                              type: string
                            iso3_code:
                              type:
                                - string
                                - 'null'
                            currency_code:
                              type:
                                - string
                                - 'null'
                  error:
                    type: 'null'
              example:
                data:
                  countries:
                    - iso_code: NG
                      name: Nigeria
                      iso3_code: NGA
                      currency_code: NGN
                error: null
  /v1/transfer/supported-countries-for-address:
    get:
      tags:
        - Transfer
      summary: List countries and states for addresses
      operationId: listTransferSupportedCountriesForAddress
      description: >-
        Lists countries with their states or regions, for address forms. Both
        filters match part of the value and are not case-sensitive.
      parameters:
        - in: query
          name: iso_code
          schema:
            type: string
          example: GH
        - in: query
          name: name
          schema:
            type: string
          example: Ghana
      responses:
        '200':
          description: The countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      countries:
                        type: array
                        items:
                          type: object
                          properties:
                            iso_code:
                              type: string
                            name:
                              type: string
                            states:
                              type: array
                              description: Empty when the country has none
                              items:
                                type: object
                                properties:
                                  code:
                                    type: string
                                  name:
                                    type: string
                  error:
                    type: 'null'
              example:
                data:
                  countries:
                    - iso_code: GH
                      name: Ghana
                      states:
                        - code: GH-AA
                          name: Greater Accra
                error: null
