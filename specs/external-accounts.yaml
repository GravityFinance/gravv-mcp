openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    This is the API Gateway for Gravv services.
    Use the `Api-Key` header for authentication.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        1 to 255 printable ASCII characters. A retry with the same key within 24
        hours returns the first response, including a 400. After you correct a
        request, send a new key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: add-payee-jane-doe-1
    ExternalAccountIdPath:
      name: external_account_id
      in: path
      required: true
      description: ID of the external account
      schema:
        type: string
        format: uuid
      example: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
  schemas:
    PayeeType:
      type: string
      description: >-
        How the account is paid. `bank_account` and `mobile_money` are active at
        once. `swift`, `sepa`, `ach_wire` and `fps` need a setup step and start
        as `pending`.
      enum:
        - bank_account
        - mobile_money
        - swift
        - sepa
        - ach_wire
        - fps
      example: bank_account
    ExternalAccountStatus:
      type: string
      description: >-
        `pending` while setup runs, then `active` (ready for transfers) or
        `setup_failed` (read `error_message`, then correct it with PATCH).
      enum:
        - pending
        - active
        - setup_failed
        - archived
        - deleted
      example: active
    Address:
      type: object
      description: >-
        The account holder's address. Required for `swift`, `sepa`, `ach_wire`
        and `fps`, and for some banks and payout corridors.
      properties:
        address_line1:
          type: string
          minLength: 4
          maxLength: 34
          example: 350 Fifth Avenue
        address_line2:
          type: string
          maxLength: 35
        house_building_number:
          type: string
          maxLength: 35
        city:
          type: string
          maxLength: 35
          example: New York
        state:
          type: string
          maxLength: 35
          example: NY
        postal_code:
          type: string
          description: Checked against the country's postal code format
          example: '10118'
        country:
          type: string
          description: Alpha-2 code
          example: US
    AddExternalAccountRequest:
      type: object
      description: >-
        The fields each `payee_type` needs:


        - `bank_account`: `account_number`. Send `institution_id` to name the
        bank.

        - `mobile_money`: `phone_number` with the country code, and
        `institution_id` for the operator.

        - `ach_wire` (USD only): `routing_number`, `account_number`,
        `payment_rail`, `account_owner_type`, `bank_name` and `address`.

        - `swift` (USD only): `bic`, `account_number` (even with an IBAN),
        `account_owner_type`, `address` with `city`, `state` and `country`,
        and the bank address fields.

        - `sepa` (EUR only): `iban`, `account_owner_type`, `bank_name` and
        `address`.

        - `fps` (GBP only): `routing_number` (the sort code), `account_number`,
        `account_owner_type`, `bank_name` and `address`.


        Unknown fields are ignored. Only the first problem found is reported.
      required:
        - customer_id
        - currency
        - account_name
      properties:
        customer_id:
          type: string
          format: uuid
          description: The customer who owns this external account
          example: 3130ca8b-8b32-4843-8623-bf83e766b86a
        currency:
          type: string
          description: Three-letter ISO 4217 code of the currency paid out
          example: USD
        account_name:
          type: string
          description: >-
            Account holder's name. Unaccented letters, spaces and `' - . , & /
            ( )` only, starting with a letter, with no digits. It comes back in
            upper case, and may be replaced by the name the bank holds.
          example: Jane Doe
        payee_type:
          description: >-
            Leave it out to detect the type from the fields you send. Send it
            for a Mexican CLABE paid in MXN, which is otherwise read as
            `ach_wire`.
          allOf:
            - $ref: '#/components/schemas/PayeeType'
        account_number:
          type: string
          description: >-
            4 to 34 letters and digits, with no spaces. Some countries have
            their own rule: 10 digits in Nigeria, 10 to 16 digits in Ghana, and
            8 to 20 characters in Kenya.
          example: '000123456789'
        iban:
          type: string
          description: IBAN, checked with mod 97. Required for `sepa`.
          example: DE89370400440532013000
        bic:
          type: string
          description: >-
            BIC of 8 or 11 characters. Required for `swift`. The bank must be in
            the SWIFT directory; its `institution_id` and `bank_name` are filled
            in for you.
          example: DEUTDEFF
        routing_number:
          type: string
          description: >-
            For `ach_wire`, a 9-digit ABA routing number. For `fps`, the sort
            code. For India, the IFSC.
          example: '021000021'
        payment_rail:
          type: string
          description: >-
            Required for `ach_wire`; there is no default. `wire` needs a
            routing number that takes wires, and `rtp` one that takes instant
            payments.
          enum:
            - ach
            - wire
            - rtp
          example: wire
        bank_account_type:
          type: string
          enum:
            - checking
            - savings
        phone_number:
          type: string
          description: Mobile money number with the country code. Required for `mobile_money`.
          example: '+256772123456'
        institution_id:
          type: string
          format: uuid
          description: >-
            An `id` from `GET /v1/external-accounts/institutions`. Required for
            MAD payouts and filled in from `bic` for `swift`.
        institution_country_iso_code:
          type: string
          description: >-
            Bank country as an alpha-2 code. It picks the account number rule.
            Defaults to the institution's country.
          example: NG
        account_owner_type:
          type: string
          description: Required for `swift`, `sepa`, `ach_wire` and `fps`
          enum:
            - individual
            - business
        bank_name:
          type: string
          description: Required for `sepa`, `ach_wire` and `fps`
          example: Example Bank
        bank_address_line_1:
          type: string
          description: Required for `swift`
        bank_city:
          type: string
          description: Required for `swift`
        bank_state:
          type: string
          description: Required for `swift`
        bank_postal_code:
          type: string
          description: Required for `swift`. Checked against `bank_country`.
        bank_country:
          type: string
          description: Required for `swift`
        intermediary_financial_institution:
          type: string
          description: >-
            Optional intermediary bank for `swift`. Send all the intermediary
            fields or none; only `intermediary_bank_address2` is optional.
        intermediary_bank_routing_number:
          type: string
        intermediary_bank_address1:
          type: string
        intermediary_bank_address2:
          type: string
        intermediary_bank_city:
          type: string
        intermediary_bank_state:
          type: string
        intermediary_bank_zip_code:
          type: string
        intermediary_bank_country:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        internal_account_id:
          type: string
          format: uuid
          description: Your account that pays this external account
        national_id:
          type: string
          maxLength: 64
          description: >-
            The holder's national ID. Send it with `national_id_type`. Some
            payout corridors need it, such as CURP or RFC for Mexico and CPF or
            CNPJ for Brazil.
        national_id_type:
          type: string
          enum:
            - CURP
            - RFC
            - CPF
            - CNPJ
            - NIT
            - CC
            - PAN
            - BVN
            - NIN
            - OTHER
        pix_key:
          type: string
          minLength: 1
          maxLength: 77
          description: PIX key, for payouts to Brazil
    UpdateExternalAccountRequest:
      type: object
      description: >-
        Send only what changes. A missing field keeps its value and `null`
        clears it. `phone_number`, `currency`, `payee_type`, `customer_id` and
        `internal_account_id` cannot change; unknown fields are ignored.
      properties:
        account_name:
          type: string
          description: Cannot be cleared
        account_number:
          type:
            - string
            - 'null'
        iban:
          type:
            - string
            - 'null'
        bic:
          type:
            - string
            - 'null'
        routing_number:
          type:
            - string
            - 'null'
        bank_name:
          type:
            - string
            - 'null'
        institution_id:
          type:
            - string
            - 'null'
        account_owner_type:
          type:
            - string
            - 'null'
          enum:
            - individual
            - business
            - null
        institution_country_iso_code:
          type:
            - string
            - 'null'
        payment_rail:
          type:
            - string
            - 'null'
          enum:
            - ach
            - wire
            - rtp
            - null
        bank_account_type:
          type:
            - string
            - 'null'
          enum:
            - checking
            - savings
            - null
        bank_address_line_1:
          type:
            - string
            - 'null'
        bank_city:
          type:
            - string
            - 'null'
        bank_state:
          type:
            - string
            - 'null'
        bank_postal_code:
          type:
            - string
            - 'null'
        bank_country:
          type:
            - string
            - 'null'
        intermediary_financial_institution:
          type:
            - string
            - 'null'
        intermediary_bank_routing_number:
          type:
            - string
            - 'null'
        intermediary_bank_address1:
          type:
            - string
            - 'null'
        intermediary_bank_address2:
          type:
            - string
            - 'null'
        intermediary_bank_city:
          type:
            - string
            - 'null'
        intermediary_bank_state:
          type:
            - string
            - 'null'
        intermediary_bank_zip_code:
          type:
            - string
            - 'null'
        intermediary_bank_country:
          type:
            - string
            - 'null'
        address:
          description: >-
            A new address needs `address_line1`, `city` and `country`. It cannot
            be cleared.
          allOf:
            - $ref: '#/components/schemas/Address'
        national_id:
          type:
            - string
            - 'null'
        national_id_type:
          type:
            - string
            - 'null'
        pix_key:
          type:
            - string
            - 'null'
    ExternalAccount:
      type: object
      description: An external account. Empty fields are left out.
      properties:
        id:
          type: string
          format: uuid
          description: Use it as the transfer destination
          example: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
        institution_id:
          type: string
          format: uuid
        payee_type:
          $ref: '#/components/schemas/PayeeType'
        account_number:
          type: string
          example: '000123456789'
        institution_type:
          type: string
          enum:
            - bank
            - mobile_money
            - swift
            - swift_intermediary
        institution_name:
          type: string
          example: Example Bank
        account_name:
          type: string
          description: In upper case. It may be the name the bank holds.
          example: JANE DOE
        iban:
          type: string
        bic:
          type: string
        customer_id:
          type: string
          format: uuid
          example: 3130ca8b-8b32-4843-8623-bf83e766b86a
        currency:
          type: string
          example: USD
        institution_country_iso_code:
          type: string
          example: US
        address:
          $ref: '#/components/schemas/Address'
        account_owner_type:
          type: string
          enum:
            - individual
            - business
        routing_number:
          type: string
        status:
          $ref: '#/components/schemas/ExternalAccountStatus'
        date_created:
          type: string
          format: date-time
          example: '2026-10-12T09:15:22.481Z'
        phone_number:
          type: string
        error_message:
          type: string
          description: Why setup failed
          example: these account details could not be accepted
        national_id_type:
          type: string
        national_id_masked:
          type: string
          description: The national ID with only the last 4 characters shown
    ExternalAccountEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ExternalAccount'
        error:
          type: 'null'
    Institution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Use it as `institution_id`
          example: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
        name:
          type: string
          example: Example Bank
        country_iso_code:
          type: string
          example: KE
        currency:
          type: string
          example: KES
        min_amount:
          type: integer
          description: For reference only, in major units. It is not enforced.
        max_amount:
          type: integer
          description: For reference only, in major units. It is not enforced.
        account_number_type:
          type: string
          enum:
            - bank_account_number
            - iban
            - phone_number
            - clabe
        swift_code:
          type: string
          description: SWIFT banks only
        address:
          type: object
          description: The bank's address. SWIFT banks only.
          additionalProperties: true
        prefill:
          type: object
          description: >-
            Bank fields to copy into a `swift` external account, such as
            `bank_address_line_1` and `bank_city`. SWIFT banks only.
          additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        data:
          type:
            - object
            - 'null'
          description: Null, except for a duplicate, which returns the existing `payee_id`
        error:
          type: string
          description: What went wrong
        code:
          type: string
          description: Error code such as `ERROR_CODE_DUPLICATE_PAYEE`, when one is sent
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: >-
        Invalid request, an unknown ID or a failure. Read `error`; not-found is
        a 400 here, not a 404.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            error: 'payee 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60: resource not found'
            code: ERROR_CODE_NOT_FOUND
security:
  - ApiKeyAuth: []
tags:
  - name: External accounts
    description: Add and manage the bank accounts and mobile wallets your customers pay out to
paths:
  /v1/external-accounts:
    post:
      tags:
        - External accounts
      summary: Add an external account
      operationId: createExternalAccount
      description: >-
        Adds a bank account or mobile wallet that a customer pays out to. Use
        `GET /v1/external-accounts/institutions` for `institution_id`, and
        `POST /v1/external-accounts/verify` to check the holder's name first.


        `bank_account` and `mobile_money` return 200 with status `active`.
        `swift`, `sepa`, `ach_wire` and `fps` return 202 with status `pending`
        while setup runs. Get the account until it is `active` or
        `setup_failed`, or wait for the `external_account.active` or
        `external_account.setup_failed` webhook.


        A duplicate (same customer, holder name, and account and bank) is a
        400 with code `ERROR_CODE_DUPLICATE_PAYEE` and the existing
        `payee_id`. Deleted and failed accounts count as duplicates.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExternalAccountRequest'
            examples:
              BankAccount:
                summary: Bank account
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: NGN
                  account_name: Ada Okafor
                  account_number: '0123456789'
                  institution_id: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
              MobileMoney:
                summary: Mobile money wallet
                value:
                  payee_type: mobile_money
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: UGX
                  account_name: Grace Nakato
                  phone_number: '+256772123456'
                  institution_id: 5c8d94fb-a927-5fed-b19d-1454c8f142a9
              AchWire:
                summary: US bank account by wire
                value:
                  payee_type: ach_wire
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: USD
                  account_name: Jane Doe
                  account_number: '000123456789'
                  routing_number: '021000021'
                  payment_rail: wire
                  account_owner_type: individual
                  bank_name: Example Bank
                  address:
                    address_line1: 350 Fifth Avenue
                    city: New York
                    state: NY
                    postal_code: '10118'
                    country: US
              Sepa:
                summary: SEPA account
                value:
                  payee_type: sepa
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: EUR
                  account_name: Anna Schmidt
                  iban: DE89370400440532013000
                  account_owner_type: individual
                  bank_name: Example Bank
                  address:
                    address_line1: Unter den Linden 13
                    city: Berlin
                    postal_code: '10117'
                    country: DE
              Swift:
                summary: SWIFT account
                value:
                  payee_type: swift
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: USD
                  account_name: Acme Trading Ltd
                  account_number: '12345678'
                  bic: MIDLGB22
                  account_owner_type: business
                  bank_address_line_1: 8 Canada Square
                  bank_city: London
                  bank_state: London
                  bank_postal_code: E14 5HQ
                  bank_country: GB
                  address:
                    address_line1: 1 King Street
                    city: London
                    state: London
                    postal_code: EC2V 8AU
                    country: GB
              Fps:
                summary: UK account by Faster Payments
                value:
                  payee_type: fps
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: GBP
                  account_name: Tom Brown
                  account_number: '31926819'
                  routing_number: '601613'
                  account_owner_type: individual
                  bank_name: Example Bank
                  address:
                    address_line1: 1 King Street
                    city: London
                    postal_code: EC2V 8AU
                    country: GB
      responses:
        '200':
          description: Added and `active`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountEnvelope'
              example:
                data:
                  id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                  payee_type: bank_account
                  account_number: '0123456789'
                  institution_id: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
                  institution_type: bank
                  institution_name: Example Bank
                  account_name: ADA OKAFOR
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: NGN
                  institution_country_iso_code: NG
                  status: active
                  date_created: '2026-10-12T09:15:22.481Z'
                error: null
        '202':
          description: Added and `pending` while setup runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountEnvelope'
              example:
                data:
                  id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                  payee_type: ach_wire
                  account_number: '000123456789'
                  account_name: JANE DOE
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: USD
                  address:
                    address_line1: 350 Fifth Avenue
                    city: New York
                    state: NY
                    postal_code: '10118'
                    country: US
                  account_owner_type: individual
                  routing_number: '021000021'
                  status: pending
                  date_created: '2026-10-12T09:15:22.481Z'
                error: null
        '400':
          description: >-
            Invalid or missing field, a duplicate, or a failed bank check.
            Correct it and send a new Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Duplicate:
                  summary: The external account already exists
                  value:
                    data:
                      payee_id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                    error: a recipient with the same account name, account number and bank already exists
                    code: ERROR_CODE_DUPLICATE_PAYEE
                    details:
                      payee_id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                MissingRail:
                  summary: An ach_wire account without payment_rail
                  value:
                    data: null
                    error: >-
                      payment rail required but missing for ach/wire payee (expected
                      ach, wire, or rtp): invalid input
                AccountNumber:
                  summary: A Nigerian account number of the wrong length
                  value:
                    data: null
                    error: 'nigerian account numbers must be exactly 10 digits (NUBAN): invalid input'
    get:
      tags:
        - External accounts
      summary: List external accounts
      operationId: listExternalAccounts
      description: >-
        Lists your external accounts, newest first, in every status including
        `deleted`. There is no status filter. Filters match exactly and are
        case-sensitive, so send currencies in upper case. `total_items` is an
        estimate; stop when a page has fewer items than `items_per_page`.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: items_per_page
          schema:
            type: integer
            minimum: 1
            default: 10
        - in: query
          name: customer_id
          schema:
            type: string
            format: uuid
          description: The full customer ID
        - in: query
          name: payee_type
          schema:
            $ref: '#/components/schemas/PayeeType'
        - in: query
          name: currency
          schema:
            type: string
          example: USD
        - in: query
          name: search
          schema:
            type: string
          description: Matches part of the holder name, account number or phone number
        - in: query
          name: internal_account_id
          schema:
            type: string
            format: uuid
          description: Your account that pays the external accounts
      responses:
        '200':
          description: A page of external accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                      items_per_page:
                        type: integer
                      total_pages:
                        type: integer
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExternalAccount'
                      total_items:
                        type: integer
                        description: An estimate, except on the last page
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/external-accounts/verify:
    post:
      tags:
        - External accounts
      summary: Verify an external account
      operationId: verifyExternalAccount
      description: >-
        Checks account details before you add the external account, and returns
        the holder's name when the bank can look it up. Send `account_number`
        with `institution_id`; only that pair reaches the bank.


        `verified: true` with `verification_source: local` means only the
        format was checked. Trust the name only when `verification_source` is
        `provider`. An IBAN, phone or CLABE alone is checked locally. This
        route needs no Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send at least one of `account_number`, `iban`, `phone` or `clabe`.
              properties:
                account_number:
                  type: string
                  description: The only identifier that the bank looks up
                  example: '0123456789'
                institution_id:
                  type: string
                  format: uuid
                  description: The bank to ask. Without it the lookup is not scoped to a bank.
                  example: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
                iban:
                  type: string
                  description: Checked with mod 97 only
                bic:
                  type: string
                phone:
                  type: string
                  description: Accepted, but not verified
                clabe:
                  type: string
                  description: Accepted, but not verified
            example:
              account_number: '0123456789'
              institution_id: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
      responses:
        '200':
          description: The result. `verified` is false when a local check failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                      account_holder_name:
                        type: string
                        description: In upper case. Only when the bank confirmed the account.
                      account_holder_name_masked:
                        type: boolean
                        description: True when the bank masked the name
                      message:
                        type: string
                        description: Why `verified` is false
                      min_amount:
                        type: string
                        description: For reference only, in major units
                      max_amount:
                        type: string
                        description: For reference only, in major units
                      verification_source:
                        type: string
                        enum:
                          - provider
                          - local
                        description: '`provider` when a bank confirmed it; `local` for format checks only'
                  error:
                    type: 'null'
              example:
                data:
                  verified: true
                  account_holder_name: ADA OKAFOR
                  verification_source: provider
                error: null
        '400':
          description: No identifier, or an invalid institution ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'at least one account identifier required: account_number, iban, phone, or clabe'
  /v1/external-accounts/{external_account_id}:
    get:
      tags:
        - External accounts
      summary: Get an external account
      operationId: getExternalAccount
      description: >-
        Returns one external account. After a 202, poll every 30 to 60 seconds
        until `status` is `active` (ready for transfers) or `setup_failed`
        (read `error_message`, then correct the account with PATCH). Not-found
        is a 400.
      parameters:
        - $ref: '#/components/parameters/ExternalAccountIdPath'
      responses:
        '200':
          description: The external account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountEnvelope'
              example:
                data:
                  id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                  payee_type: swift
                  account_number: '12345678'
                  institution_id: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
                  institution_type: swift
                  institution_name: Example Bank
                  account_name: ACME TRADING LTD
                  bic: MIDLGB22
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: USD
                  institution_country_iso_code: GB
                  account_owner_type: business
                  status: setup_failed
                  date_created: '2026-10-12T09:15:22.481Z'
                  error_message: these account details could not be accepted
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags:
        - External accounts
      summary: Update an external account
      operationId: updateExternalAccount
      description: >-
        Corrects an external account. Use it to fix the bank details of a
        `setup_failed` account, which runs setup again, or to add the national
        ID, PIX key or address that a payout corridor asks for. An empty body
        on a failed account retries setup.


        It always returns 202; get the account until it is `active` or
        `setup_failed`. A 409 means the account cannot change in its state;
        add a new one instead. This route needs no Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/ExternalAccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalAccountRequest'
            example:
              account_number: '87654321'
              bank_postal_code: E14 5HQ
      responses:
        '202':
          description: Updated. Setup runs again after a bank details change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountEnvelope'
        '400':
          description: Invalid field or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'account name cannot be cleared: invalid input'
        '404':
          description: No such external account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'payee 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60: resource not found'
                code: ERROR_CODE_NOT_FOUND
        '409':
          description: >-
            The account cannot change in its state, its address is already
            registered, the change makes a duplicate, or another request changed
            it first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: >-
                  payee 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60 is not correctable in
                  its current state (active): invalid state transition
                code: ERROR_CODE_PAYEE_INVALID_STATE
        '500':
          description: The update failed. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: We couldn't update this payee. Please try again later.
                code: ERROR_CODE_INTERNAL_ERROR
  /v1/external-accounts/institutions:
    get:
      tags:
        - External accounts
      summary: List institutions
      operationId: listExternalAccountInstitutions
      description: >-
        Lists the banks and mobile money operators an external account can
        name in `institution_id`. SWIFT banks appear only when you send
        `institution_type=swift`, `swift_code` or `search`. Filters match
        exactly, so send codes in upper case.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: items_per_page
          schema:
            type: integer
            minimum: 1
            default: 10
        - in: query
          name: country_iso_code
          schema:
            type: string
          description: Alpha-2 country code
          example: KE
        - in: query
          name: institution_type
          schema:
            type: string
            enum:
              - bank
              - mobile_money
              - swift
              - swift_intermediary
          description: Defaults to every type except `swift_intermediary`
        - in: query
          name: account_number_type
          schema:
            type: string
            enum:
              - bank_account_number
              - iban
              - phone_number
              - clabe
        - in: query
          name: currency
          schema:
            type: string
          example: KES
        - in: query
          name: swift_code
          schema:
            type: string
            pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
          description: Find a SWIFT bank by its 8 or 11 character BIC
          example: MIDLGB22
        - in: query
          name: search
          schema:
            type: string
            minLength: 3
          description: Find SWIFT banks by name or BIC, at least 3 characters
      responses:
        '200':
          description: A page of institutions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                      items_per_page:
                        type: integer
                      total_pages:
                        type: integer
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Institution'
                      total_items:
                        type: integer
                  error:
                    type: 'null'
              example:
                data:
                  page: 1
                  items_per_page: 10
                  total_pages: 1
                  items:
                    - id: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
                      name: Example Mobile Money
                      country_iso_code: KE
                      currency: KES
                      min_amount: 1
                      max_amount: 10000
                      account_number_type: phone_number
                  total_items: 1
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
