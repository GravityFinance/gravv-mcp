openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    The API gateway for Gravv services.
    Send your API key in the `Api-Key` header to authenticate.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        1 to 255 printable ASCII characters. A retry with the same key within 24
        hours returns the first response, including a 400. After you correct a
        request, send a new key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: add-payee-jane-doe-1
    ExternalAccountIdPath:
      name: external_account_id
      in: path
      required: true
      description: ID of the external account
      schema:
        type: string
        format: uuid
      example: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
  schemas:
    PayeeType:
      type: string
      description: >-
        How the account is paid. `bank_account` and `mobile_money` are active at
        once. `swift`, `sepa`, `ach_wire` and `fps` need a setup step and start
        as `pending`.
      enum:
        - bank_account
        - mobile_money
        - swift
        - sepa
        - ach_wire
        - fps
      example: bank_account
    ExternalAccountStatus:
      type: string
      description: >-
        `pending` while setup runs, then `active` (ready for transfers) or
        `setup_failed` (read `error_message`, then correct it with PATCH).
      enum:
        - pending
        - active
        - setup_failed
        - archived
        - deleted
      example: active
    Address:
      type: object
      description: >-
        The account holder's address. Required for `swift`, `sepa`, `ach_wire`
        and `fps`, and for some banks and payout corridors.
      properties: &address_properties
        address_line1:
          type: string
          minLength: 4
          maxLength: 34
          example: 350 Fifth Avenue
        address_line2:
          type: string
          maxLength: 35
        house_building_number:
          type: string
          maxLength: 35
        city:
          type: string
          maxLength: 35
          example: New York
        state:
          type: string
          maxLength: 35
          example: NY
        postal_code:
          type: string
          description: Checked against the country's postal code format
          example: '10118'
        country:
          type: string
          description: Alpha-2 code
          example: US
    BeneficiaryAddress:
      type: object
      description: >-
        The account holder's address. `address_line1` is 4 to 34 characters,
        and the other fields are at most 35. Gravv checks `postal_code` against
        `country`.
      required:
        - address_line1
      properties: *address_properties
    SwiftBeneficiaryAddress:
      type: object
      description: >-
        The account holder's address. A `swift` payee needs `address_line1`,
        `city`, `state` and `country`. `address_line1` is 4 to 34 characters,
        and the other fields are at most 35.
      required:
        - address_line1
        - city
        - state
        - country
      properties: *address_properties
    AddExternalAccountRequest:
      description: >-
        Pick the tab for the kind of payee, and for a local bank account, the
        tab for its currency. Each tab lists the fields that kind uses and marks
        the ones Gravv requires when you save the payee. Unknown fields are ignored. Only
        the first problem found is reported.
      oneOf:
        - title: African bank account (NGN, GHS, KES, XOF, XAF)
          type: object
          description: >-
            A bank account in Nigeria, Ghana, Kenya, the WAEMU zone (XOF) or the
            CEMAC zone (XAF). The response is 200 with status `active`. Send
            `account_number` and the bank's `institution_id`. You do not need a
            routing number.
          required:
            - customer_id
            - currency
            - account_name
          properties:
            payee_type: &bank_account_payee_type
              type: string
              description: Leave it out to detect the type from the fields you send.
              enum:
                - bank_account
              example: bank_account
            customer_id: &customer_id
              type: string
              format: uuid
              description: The customer who owns this external account
              example: 3130ca8b-8b32-4843-8623-bf83e766b86a
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - NGN
                - GHS
                - KES
                - XOF
                - XAF
              example: NGN
            account_name: &account_name
              type: string
              description: >-
                Account holder's name. Unaccented letters, spaces and `' - . , & /
                ( )` only, starting with a letter, with no digits. It comes back in
                upper case, and may be replaced by the name the bank holds.
              example: Jane Doe
            account_number:
              type: string
              description: >-
                Letters and digits, with no spaces. Each country has its own rule:
                10 digits in Nigeria (NUBAN), 10 to 16 digits in Ghana, 8 to 20
                characters in Kenya, 24 characters in the WAEMU zone (the RIB) and
                23 digits in the CEMAC zone. Needed to pay this payee.
              example: '0123456789'
            institution_id:
              type: string
              format: uuid
              description: >-
                An `id` from `GET /v1/external-accounts/institutions`. Gravv saves
                a payee without one, but cannot pay it.
            institution_country_iso_code: &institution_country_iso_code
              type: string
              description: >-
                Bank country as an alpha-2 code. It picks the account number rule.
                Defaults to the institution's country.
              example: NG
            account_owner_type: &account_owner_type
              type: string
              description: '`individual` for a person, `business` for a company'
              enum:
                - individual
                - business
            address:
              $ref: '#/components/schemas/Address'
            internal_account_id: &internal_account_id
              type: string
              format: uuid
              description: Your account that pays this external account
        - title: Moroccan bank account (MAD)
          type: object
          description: >-
            A bank account in Morocco. The response is 200 with status `active`.
            `institution_id` is required: it names the bank the payout goes to.
          required:
            - customer_id
            - currency
            - account_name
            - institution_id
          properties:
            payee_type: *bank_account_payee_type
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - MAD
              example: MAD
            account_name: *account_name
            account_number:
              type: string
              description: The RIB, exactly 24 letters and digits
              example: '007780000123400000012345'
            iban:
              type: string
              description: >-
                IBAN, for a bank whose `account_number_type` is `iban`. Gravv
                checks it with mod 97.
            institution_id:
              type: string
              format: uuid
              description: >-
                An `id` from `GET /v1/external-accounts/institutions`. The bank
                must be able to receive MAD payouts.
              example: 4f6a8c2e-1b3d-4e5f-9a7b-2c4d6e8f0a1b
            institution_country_iso_code: *institution_country_iso_code
            account_owner_type: *account_owner_type
            address:
              description: >-
                Some Moroccan banks need the holder's address, and Gravv refuses
                the payee without it.
              allOf:
                - $ref: '#/components/schemas/Address'
            internal_account_id: *internal_account_id
        - title: Mexican bank account (MXN)
          type: object
          description: >-
            A bank account in Mexico, paid to its CLABE. The response is 200 with
            status `active`. Always send `payee_type`. Gravv checks the CURP or RFC
            when you save the payee, and the other payout details when you send
            money.
          required:
            - customer_id
            - currency
            - account_name
          properties:
            payee_type:
              type: string
              description: >-
                Send it for a Mexican CLABE paid in MXN, which is otherwise read
                as `ach_wire`.
              enum:
                - bank_account
              example: bank_account
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - MXN
              example: MXN
            account_name: *account_name
            account_number:
              type: string
              description: The 18-digit CLABE. Needed to pay this payee.
              example: '002180000123456789'
            institution_id:
              type: string
              format: uuid
              description: An `id` from `GET /v1/external-accounts/institutions`
            institution_country_iso_code:
              type: string
              description: Bank country as an alpha-2 code
              example: MX
            national_id:
              type: string
              maxLength: 64
              description: >-
                The holder's CURP or RFC. Send it with `national_id_type`. Needed
                to pay this payee.
              example: GODE561231HDFRRN09
            national_id_type:
              type: string
              description: A Mexican payee takes `CURP` or `RFC` only.
              enum:
                - CURP
                - RFC
              example: CURP
            account_owner_type: *account_owner_type
            address: &payout_address
              description: >-
                Needed to pay this payee, with `address_line1`, `city` and
                `country`.
              allOf:
                - $ref: '#/components/schemas/Address'
            internal_account_id: *internal_account_id
        - title: Brazilian account (BRL)
          type: object
          description: >-
            A PIX key or bank account in Brazil. The response is 200 with status
            `active`. Gravv checks the identity fields when you save the payee,
            and the payout details when you send money.
          required:
            - customer_id
            - currency
            - account_name
          properties:
            payee_type: *bank_account_payee_type
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - BRL
              example: BRL
            account_name: *account_name
            pix_key:
              type: string
              minLength: 1
              maxLength: 77
              description: PIX key, with no spaces. Needed to pay this payee.
              example: maria.souza@example.com
            account_number:
              type: string
              description: 4 to 34 letters and digits, with no spaces
            institution_id:
              type: string
              format: uuid
              description: An `id` from `GET /v1/external-accounts/institutions`
            national_id:
              type: string
              maxLength: 64
              description: >-
                The holder's CPF (a person) or CNPJ (a company). Send it with
                `national_id_type`. Gravv checks its check digits. Needed to pay
                this payee.
              example: '52998224725'
            national_id_type:
              type: string
              enum:
                - CPF
                - CNPJ
              example: CPF
            account_owner_type: *account_owner_type
            address: *payout_address
            internal_account_id: *internal_account_id
        - title: Colombian bank account (COP)
          type: object
          description: >-
            A bank account in Colombia. The response is 200 with status
            `active`. Gravv checks the payout details when you send money, not
            when you save the payee.
          required:
            - customer_id
            - currency
            - account_name
          properties:
            payee_type: *bank_account_payee_type
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - COP
              example: COP
            account_name: *account_name
            account_number:
              type: string
              description: 4 to 34 letters and digits, with no spaces. Needed to pay this payee.
              example: '12345678901'
            institution_id:
              type: string
              format: uuid
              description: >-
                An `id` from `GET /v1/external-accounts/institutions`. Needed to
                pay this payee.
            bank_account_type:
              type: string
              description: Needed to pay this payee
              enum:
                - checking
                - savings
            national_id:
              type: string
              maxLength: 64
              description: >-
                The holder's CC (a person) or NIT (a company). Send it with
                `national_id_type`. Needed to pay this payee.
              example: '1020304050'
            national_id_type:
              type: string
              enum:
                - CC
                - NIT
              example: CC
            account_owner_type: *account_owner_type
            address: *payout_address
            internal_account_id: *internal_account_id
        - title: Indian bank account (INR)
          type: object
          description: >-
            A bank account in India, named by its IFSC. The response is 200 with
            status `active`. Gravv checks the payout details when you send money,
            not when you save the payee.
          required:
            - customer_id
            - currency
            - account_name
          properties:
            payee_type: *bank_account_payee_type
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - INR
              example: INR
            account_name: *account_name
            account_number:
              type: string
              description: The account number, 9 to 18 digits. Needed to pay this payee.
              example: '50100123456789'
            routing_number:
              type: string
              description: The IFSC. Needed to pay this payee.
              example: HDFC0000123
            account_owner_type: *account_owner_type
            address: *payout_address
            internal_account_id: *internal_account_id
        - title: Hong Kong bank account (HKD)
          type: object
          description: >-
            A bank account in Hong Kong. The response is 200 with status
            `active`. Gravv checks the payout details when you send money, not
            when you save the payee.
          required:
            - customer_id
            - currency
            - account_name
          properties:
            payee_type: *bank_account_payee_type
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - HKD
              example: HKD
            account_name: *account_name
            account_number:
              type: string
              description: 4 to 34 letters and digits, with no spaces. Needed to pay this payee.
              example: '123456789012'
            institution_id:
              type: string
              format: uuid
              description: >-
                An `id` from `GET /v1/external-accounts/institutions`. Needed to
                pay this payee.
            account_owner_type: *account_owner_type
            address: *payout_address
            internal_account_id: *internal_account_id
        - title: Bank account in another currency
          type: object
          description: >-
            A local bank account in a currency without its own tab, such as PKR
            or EGP. The response is 200 with status `active`. Send
            `account_number`, or `iban` where the bank uses one, and
            `institution_id` to name the bank. Some banks need `address`.
          required:
            - customer_id
            - currency
            - account_name
          properties:
            payee_type: *bank_account_payee_type
            customer_id: *customer_id
            currency:
              type: string
              description: >-
                Three-letter ISO 4217 code of the currency paid out. The currencies
                with their own tab are not listed here.
              not:
                enum:
                  - NGN
                  - GHS
                  - KES
                  - XOF
                  - XAF
                  - MAD
                  - MXN
                  - BRL
                  - COP
                  - INR
                  - HKD
              example: PKR
            account_name: *account_name
            account_number:
              type: string
              description: 4 to 34 letters and digits, with no spaces
              example: '00123456789012'
            iban:
              type: string
              description: >-
                IBAN, for a bank whose `account_number_type` is `iban`. Gravv
                checks it with mod 97.
            institution_id:
              type: string
              format: uuid
              description: An `id` from `GET /v1/external-accounts/institutions`
            institution_country_iso_code: *institution_country_iso_code
            bank_name:
              type: string
              description: The bank's name, used when you send no `institution_id`
            bank_account_type:
              type: string
              enum:
                - checking
                - savings
            account_owner_type: *account_owner_type
            address:
              $ref: '#/components/schemas/Address'
            internal_account_id: *internal_account_id
        - title: Mobile money wallet
          type: object
          description: >-
            A mobile money wallet, paid to its phone number. The response is 200
            with status `active`. Send `institution_id` for the operator.
          required:
            - customer_id
            - currency
            - account_name
            - phone_number
          properties:
            payee_type:
              type: string
              description: Leave it out to detect the type from the fields you send.
              enum:
                - mobile_money
              example: mobile_money
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              example: UGX
            account_name: *account_name
            phone_number:
              type: string
              description: Mobile money number with the country code
              example: '+256772123456'
            institution_id:
              type: string
              format: uuid
              description: >-
                An `id` from `GET /v1/external-accounts/institutions`, for the
                operator
            institution_country_iso_code:
              type: string
              description: >-
                Wallet country as an alpha-2 code. Defaults to the operator's
                country.
              example: UG
            account_owner_type: *account_owner_type
            internal_account_id: *internal_account_id
        - title: US bank account (ACH, wire, RTP)
          type: object
          description: >-
            A US bank account paid in USD on one rail: `ach`, `wire` or `rtp`.
            The response is 202 with status `pending` while setup runs. To pay
            one account on two rails, save it once for each rail.
          required:
            - customer_id
            - currency
            - account_name
            - account_number
            - routing_number
            - payment_rail
            - account_owner_type
            - bank_name
            - address
          properties:
            payee_type:
              type: string
              description: Leave it out to detect the type from the fields you send.
              enum:
                - ach_wire
              example: ach_wire
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - USD
              example: USD
            account_name: *account_name
            account_number:
              type: string
              description: 4 to 34 letters and digits, with no spaces
              example: '000123456789'
            routing_number:
              type: string
              description: A 9-digit ABA routing number
              example: '021000021'
            payment_rail:
              type: string
              description: >-
                There is no default. `wire` needs a routing number that takes
                wires, and `rtp` one that takes instant payments.
              enum:
                - ach
                - wire
                - rtp
              example: wire
            bank_account_type:
              type: string
              description: Send it for an `ach` payee. Setup can fail without it.
              enum:
                - checking
                - savings
            account_owner_type: *account_owner_type
            bank_name:
              type: string
              description: The bank's name. The response returns it as `institution_name`.
              example: Example Bank
            address:
              $ref: '#/components/schemas/BeneficiaryAddress'
            internal_account_id: *internal_account_id
        - title: SWIFT (USD)
          type: object
          description: >-
            A bank abroad paid in USD by SWIFT. The response is 202 with status
            `pending` while setup runs. Look the bank up with
            `GET /v1/external-accounts/institutions?swift_code=<BIC>` and copy
            its `prefill` fields. One error lists all the missing bank fields.
          required:
            - customer_id
            - currency
            - account_name
            - account_number
            - bic
            - account_owner_type
            - address
            - bank_address_line_1
            - bank_city
            - bank_state
            - bank_postal_code
            - bank_country
          properties:
            payee_type:
              type: string
              description: Leave it out to detect the type from the fields you send.
              enum:
                - swift
              example: swift
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - USD
              example: USD
            account_name: *account_name
            account_number:
              type: string
              description: >-
                4 to 34 letters and digits, with no spaces. Required even when you
                send `iban`.
              example: '12345678'
            iban:
              type: string
              description: IBAN, checked with mod 97
            bic:
              type: string
              description: >-
                BIC of 8 or 11 characters. The bank must be in the SWIFT directory.
                Gravv fills in its `institution_id` and `bank_name` for you.
              example: DEUTDEFF
            institution_id:
              type: string
              format: uuid
              description: >-
                An `id` from `GET /v1/external-accounts/institutions`. Gravv fills
                it in from `bic`. If the BIC is listed in more than one country,
                send `institution_id` or `bank_country`.
            bank_name:
              type: string
              description: Gravv fills it in from `bic`
            account_owner_type: *account_owner_type
            bank_address_line_1:
              type: string
              description: The bank's street address
            bank_city:
              type: string
            bank_state:
              type: string
            bank_postal_code:
              type: string
              description: Checked against `bank_country`
            bank_country:
              type: string
              description: The bank's country as an alpha-2 code
            intermediary_financial_institution:
              type: string
              description: >-
                Optional intermediary bank. Send all the intermediary fields or
                none. Only `intermediary_bank_address2` is optional.
            intermediary_bank_routing_number:
              type: string
            intermediary_bank_address1:
              type: string
            intermediary_bank_address2:
              type: string
            intermediary_bank_city:
              type: string
            intermediary_bank_state:
              type: string
            intermediary_bank_zip_code:
              type: string
            intermediary_bank_country:
              type: string
            address:
              $ref: '#/components/schemas/SwiftBeneficiaryAddress'
            internal_account_id: *internal_account_id
        - title: SEPA (EUR)
          type: object
          description: >-
            A euro account in a SEPA country, paid by IBAN. The response is 202
            with status `pending` while setup runs.
          required:
            - customer_id
            - currency
            - account_name
            - iban
            - account_owner_type
            - bank_name
            - address
          properties:
            payee_type:
              type: string
              description: Leave it out to detect the type from the fields you send.
              enum:
                - sepa
              example: sepa
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - EUR
              example: EUR
            account_name: *account_name
            iban:
              type: string
              description: >-
                IBAN, checked with mod 97. Gravv takes the payee's country from
                it.
              example: DE89370400440532013000
            bic:
              type: string
              description: BIC of 8 or 11 characters. Gravv checks its format.
              example: COBADEFFXXX
            account_owner_type: *account_owner_type
            bank_name:
              type: string
              description: The bank's name. The response returns it as `institution_name`.
              example: Example Bank
            address:
              $ref: '#/components/schemas/BeneficiaryAddress'
            internal_account_id: *internal_account_id
        - title: Faster Payments (GBP)
          type: object
          description: >-
            A UK account paid in GBP by Faster Payments, with a sort code and
            account number. The response is 202 with status `pending` while
            setup runs.
          required:
            - customer_id
            - currency
            - account_name
            - account_number
            - routing_number
            - account_owner_type
            - bank_name
            - address
          properties:
            payee_type:
              type: string
              description: Leave it out to detect the type from the fields you send.
              enum:
                - fps
              example: fps
            customer_id: *customer_id
            currency:
              type: string
              description: Three-letter ISO 4217 code of the currency paid out
              enum:
                - GBP
              example: GBP
            account_name: *account_name
            account_number:
              type: string
              description: 4 to 34 letters and digits, with no spaces
              example: '31926819'
            routing_number:
              type: string
              description: The sort code
              example: '601613'
            account_owner_type: *account_owner_type
            bank_name:
              type: string
              description: The bank's name. The response returns it as `institution_name`.
              example: Example Bank
            address:
              $ref: '#/components/schemas/BeneficiaryAddress'
            internal_account_id: *internal_account_id
    UpdateExternalAccountRequest:
      type: object
      description: >-
        Send only what changes. A missing field keeps its value and `null`
        clears it. `phone_number`, `currency`, `payee_type`, `customer_id` and
        `internal_account_id` cannot change. Unknown fields are ignored.
      properties:
        account_name:
          type: string
          description: Cannot be cleared
        account_number:
          type:
            - string
            - 'null'
        iban:
          type:
            - string
            - 'null'
        bic:
          type:
            - string
            - 'null'
        routing_number:
          type:
            - string
            - 'null'
        bank_name:
          type:
            - string
            - 'null'
        institution_id:
          type:
            - string
            - 'null'
        account_owner_type:
          type:
            - string
            - 'null'
          enum:
            - individual
            - business
            - null
        institution_country_iso_code:
          type:
            - string
            - 'null'
        payment_rail:
          type:
            - string
            - 'null'
          enum:
            - ach
            - wire
            - rtp
            - null
        bank_account_type:
          type:
            - string
            - 'null'
          enum:
            - checking
            - savings
            - null
        bank_address_line_1:
          type:
            - string
            - 'null'
        bank_city:
          type:
            - string
            - 'null'
        bank_state:
          type:
            - string
            - 'null'
        bank_postal_code:
          type:
            - string
            - 'null'
        bank_country:
          type:
            - string
            - 'null'
        intermediary_financial_institution:
          type:
            - string
            - 'null'
        intermediary_bank_routing_number:
          type:
            - string
            - 'null'
        intermediary_bank_address1:
          type:
            - string
            - 'null'
        intermediary_bank_address2:
          type:
            - string
            - 'null'
        intermediary_bank_city:
          type:
            - string
            - 'null'
        intermediary_bank_state:
          type:
            - string
            - 'null'
        intermediary_bank_zip_code:
          type:
            - string
            - 'null'
        intermediary_bank_country:
          type:
            - string
            - 'null'
        address:
          description: >-
            A new address needs `address_line1`, `city` and `country`. It cannot
            be cleared.
          allOf:
            - $ref: '#/components/schemas/Address'
        national_id:
          type:
            - string
            - 'null'
        national_id_type:
          type:
            - string
            - 'null'
        pix_key:
          type:
            - string
            - 'null'
    ExternalAccount:
      type: object
      description: An external account. Empty fields are left out.
      properties:
        id:
          type: string
          format: uuid
          description: Use it as the transfer destination
          example: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
        institution_id:
          type: string
          format: uuid
        payee_type:
          $ref: '#/components/schemas/PayeeType'
        account_number:
          type: string
          example: '000123456789'
        institution_type:
          type: string
          enum:
            - bank
            - mobile_money
            - swift
            - swift_intermediary
        institution_name:
          type: string
          example: Example Bank
        account_name:
          type: string
          description: In upper case. It may be the name the bank holds.
          example: JANE DOE
        iban:
          type: string
        bic:
          type: string
        customer_id:
          type: string
          format: uuid
          example: 3130ca8b-8b32-4843-8623-bf83e766b86a
        currency:
          type: string
          example: USD
        institution_country_iso_code:
          type: string
          example: US
        address:
          $ref: '#/components/schemas/Address'
        account_owner_type:
          type: string
          enum:
            - individual
            - business
        routing_number:
          type: string
        status:
          $ref: '#/components/schemas/ExternalAccountStatus'
        date_created:
          type: string
          format: date-time
          example: '2026-10-12T09:15:22.481Z'
        phone_number:
          type: string
        error_message:
          type: string
          description: Why setup failed
          example: these account details could not be accepted
        national_id_type:
          type: string
        national_id_masked:
          type: string
          description: The national ID with only the last 4 characters shown
    ExternalAccountEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ExternalAccount'
        error:
          type: 'null'
    Institution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Use it as `institution_id`
          example: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
        name:
          type: string
          example: Example Bank
        country_iso_code:
          type: string
          example: KE
        currency:
          type: string
          example: KES
        min_amount:
          type: integer
          description: For reference only, in major units. It is not enforced.
        max_amount:
          type: integer
          description: For reference only, in major units. It is not enforced.
        account_number_type:
          type: string
          enum:
            - bank_account_number
            - iban
            - phone_number
            - clabe
        swift_code:
          type: string
          description: SWIFT banks only
        address:
          type: object
          description: The bank's address. SWIFT banks only.
          additionalProperties: true
        prefill:
          type: object
          description: >-
            Bank fields to copy into a `swift` external account, such as
            `bank_address_line_1` and `bank_city`. SWIFT banks only.
          additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        data:
          type:
            - object
            - 'null'
          description: Null, except for a duplicate, which returns the existing `payee_id`
        error:
          type: string
          description: What went wrong
        code:
          type: string
          description: Error code such as `ERROR_CODE_DUPLICATE_PAYEE`, when one is sent
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: >-
        Invalid request, an unknown ID or a failure. Read `error`. A not-found
        error is a 400 here, not a 404.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            error: 'payee 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60: resource not found'
            code: ERROR_CODE_NOT_FOUND
security:
  - ApiKeyAuth: []
tags:
  - name: External accounts
    description: Add and manage the bank accounts and mobile wallets your customers pay out to
paths:
  /v1/external-accounts:
    post:
      tags:
        - External accounts
      summary: Add an external account
      operationId: createExternalAccount
      description: >-
        Adds a bank account or mobile wallet that a customer pays out to. Use
        `GET /v1/external-accounts/institutions` for `institution_id`, and
        `POST /v1/external-accounts/verify` to check the holder's name first.


        `bank_account` and `mobile_money` return 200 with status `active`.
        `swift`, `sepa`, `ach_wire` and `fps` return 202 with status `pending`
        while setup runs. Get the account until it is `active` or
        `setup_failed`, or wait for the `external_account.active` or
        `external_account.setup_failed` webhook.


        A duplicate (same customer, holder name, and account and bank) is a
        400 with code `ERROR_CODE_DUPLICATE_PAYEE` and the existing
        `payee_id`. Deleted and failed accounts count as duplicates.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExternalAccountRequest'
            examples:
              BankAccount:
                summary: Nigerian bank account
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: NGN
                  account_name: Ada Okafor
                  account_number: '0123456789'
                  institution_id: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
              MoroccanBankAccount:
                summary: Moroccan bank account
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: MAD
                  account_name: Youssef Amrani
                  account_number: '007780000123400000012345'
                  institution_id: 4f6a8c2e-1b3d-4e5f-9a7b-2c4d6e8f0a1b
                  address:
                    address_line1: 12 Rue Ibn Batouta
                    city: Casablanca
                    country: MA
              MexicanBankAccount:
                summary: Mexican bank account
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: MXN
                  account_name: Diego Hernandez
                  account_number: '002180000123456789'
                  institution_country_iso_code: MX
                  national_id: GODE561231HDFRRN09
                  national_id_type: CURP
                  address:
                    address_line1: Av Vallarta 1520
                    city: Guadalajara
                    country: MX
              BrazilianAccount:
                summary: Brazilian PIX key
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: BRL
                  account_name: Maria Souza
                  pix_key: maria.souza@example.com
                  national_id: '52998224725'
                  national_id_type: CPF
                  address:
                    address_line1: Rua Augusta 1500
                    city: Sao Paulo
                    country: BR
              ColombianBankAccount:
                summary: Colombian bank account
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: COP
                  account_name: Camila Rojas
                  account_number: '12345678901'
                  institution_id: 7b9d1f3a-5c7e-4a9b-8d1f-3a5c7e9b1d2f
                  bank_account_type: savings
                  national_id: '1020304050'
                  national_id_type: CC
                  address:
                    address_line1: Carrera 7 71 21
                    city: Bogota
                    country: CO
              IndianBankAccount:
                summary: Indian bank account
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: INR
                  account_name: Priya Sharma
                  account_number: '50100123456789'
                  routing_number: HDFC0000123
                  address:
                    address_line1: 14 MG Road
                    city: Bengaluru
                    country: IN
              HongKongBankAccount:
                summary: Hong Kong bank account
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: HKD
                  account_name: Chan Tai Man
                  account_number: '123456789012'
                  institution_id: 2a4c6e8f-0b1d-4f3a-9c5e-7a9b1c3d5e7f
                  address:
                    address_line1: 1 Queens Road Central
                    city: Hong Kong
                    country: HK
              OtherBankAccount:
                summary: Bank account in another currency
                value:
                  payee_type: bank_account
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: PKR
                  account_name: Ali Khan
                  account_number: '00123456789012'
                  institution_id: 8e0a2c4f-6b8d-4a1c-9e3f-5b7d9f1a3c5e
              MobileMoney:
                summary: Mobile money wallet
                value:
                  payee_type: mobile_money
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: UGX
                  account_name: Grace Nakato
                  phone_number: '+256772123456'
                  institution_id: 5c8d94fb-a927-5fed-b19d-1454c8f142a9
              AchWire:
                summary: US bank account by wire
                value:
                  payee_type: ach_wire
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: USD
                  account_name: Jane Doe
                  account_number: '000123456789'
                  routing_number: '021000021'
                  payment_rail: wire
                  account_owner_type: individual
                  bank_name: Example Bank
                  address:
                    address_line1: 350 Fifth Avenue
                    city: New York
                    state: NY
                    postal_code: '10118'
                    country: US
              Sepa:
                summary: SEPA account
                value:
                  payee_type: sepa
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: EUR
                  account_name: Anna Schmidt
                  iban: DE89370400440532013000
                  account_owner_type: individual
                  bank_name: Example Bank
                  address:
                    address_line1: Unter den Linden 13
                    city: Berlin
                    postal_code: '10117'
                    country: DE
              Swift:
                summary: SWIFT account
                value:
                  payee_type: swift
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: USD
                  account_name: Acme Trading Ltd
                  account_number: '12345678'
                  bic: MIDLGB22
                  account_owner_type: business
                  bank_address_line_1: 8 Canada Square
                  bank_city: London
                  bank_state: London
                  bank_postal_code: E14 5HQ
                  bank_country: GB
                  address:
                    address_line1: 1 King Street
                    city: London
                    state: London
                    postal_code: EC2V 8AU
                    country: GB
              Fps:
                summary: UK account by Faster Payments
                value:
                  payee_type: fps
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: GBP
                  account_name: Tom Brown
                  account_number: '31926819'
                  routing_number: '601613'
                  account_owner_type: individual
                  bank_name: Example Bank
                  address:
                    address_line1: 1 King Street
                    city: London
                    postal_code: EC2V 8AU
                    country: GB
      responses:
        '200':
          description: Added and `active`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountEnvelope'
              example:
                data:
                  id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                  payee_type: bank_account
                  account_number: '0123456789'
                  institution_id: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
                  institution_type: bank
                  institution_name: Example Bank
                  account_name: ADA OKAFOR
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: NGN
                  institution_country_iso_code: NG
                  status: active
                  date_created: '2026-10-12T09:15:22.481Z'
                error: null
        '202':
          description: Added and `pending` while setup runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountEnvelope'
              example:
                data:
                  id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                  payee_type: ach_wire
                  account_number: '000123456789'
                  account_name: JANE DOE
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: USD
                  address:
                    address_line1: 350 Fifth Avenue
                    city: New York
                    state: NY
                    postal_code: '10118'
                    country: US
                  account_owner_type: individual
                  routing_number: '021000021'
                  status: pending
                  date_created: '2026-10-12T09:15:22.481Z'
                error: null
        '400':
          description: >-
            Invalid or missing field, a duplicate, or a failed bank check.
            Correct it and send a new Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Duplicate:
                  summary: The external account already exists
                  value:
                    data:
                      payee_id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                    error: a recipient with the same account name, account number and bank already exists
                    code: ERROR_CODE_DUPLICATE_PAYEE
                    details:
                      payee_id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                MissingRail:
                  summary: An ach_wire account without payment_rail
                  value:
                    data: null
                    error: >-
                      payment rail required but missing for ach/wire payee (expected
                      ach, wire, or rtp): invalid input
                AccountNumber:
                  summary: A Nigerian account number of the wrong length
                  value:
                    data: null
                    error: 'nigerian account numbers must be exactly 10 digits (NUBAN): invalid input'
    get:
      tags:
        - External accounts
      summary: List external accounts
      operationId: listExternalAccounts
      description: >-
        Lists your external accounts, newest first, in every status including
        `deleted`. There is no status filter. Filters match exactly and are
        case-sensitive, so send currencies in upper case. `total_items` is an
        estimate. Stop when a page has fewer items than `items_per_page`.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: items_per_page
          schema:
            type: integer
            minimum: 1
            default: 10
        - in: query
          name: customer_id
          schema:
            type: string
            format: uuid
          description: The full customer ID
        - in: query
          name: payee_type
          schema:
            $ref: '#/components/schemas/PayeeType'
        - in: query
          name: currency
          schema:
            type: string
          example: USD
        - in: query
          name: search
          schema:
            type: string
          description: Matches part of the holder name, account number or phone number
        - in: query
          name: internal_account_id
          schema:
            type: string
            format: uuid
          description: Your account that pays the external accounts
      responses:
        '200':
          description: A page of external accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                      items_per_page:
                        type: integer
                      total_pages:
                        type: integer
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExternalAccount'
                      total_items:
                        type: integer
                        description: An estimate, except on the last page
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/external-accounts/verify:
    post:
      tags:
        - External accounts
      summary: Verify an external account
      operationId: verifyExternalAccount
      description: >-
        Checks account details before you add the external account, and returns
        the holder's name when the bank can look it up. Send `account_number`
        with `institution_id`. Only that pair reaches the bank.


        `verified: true` with `verification_source: local` means only the format
        was checked. Trust the name only when `verification_source` is
        `provider`. An IBAN, phone or CLABE alone is checked locally. This route
        needs no Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send at least one of `account_number`, `iban`, `phone` or `clabe`.
              properties:
                account_number:
                  type: string
                  description: The only identifier that the bank looks up
                  example: '0123456789'
                institution_id:
                  type: string
                  format: uuid
                  description: The bank to ask. Without it the lookup is not scoped to a bank.
                  example: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
                iban:
                  type: string
                  description: Checked with mod 97 only
                bic:
                  type: string
                phone:
                  type: string
                  description: Accepted, but not verified
                clabe:
                  type: string
                  description: Accepted, but not verified
            example:
              account_number: '0123456789'
              institution_id: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
      responses:
        '200':
          description: The result. `verified` is false when a local check failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                      account_holder_name:
                        type: string
                        description: In upper case. Only when the bank confirmed the account.
                      account_holder_name_masked:
                        type: boolean
                        description: True when the bank masked the name
                      message:
                        type: string
                        description: Why `verified` is false
                      min_amount:
                        type: string
                        description: For reference only, in major units
                      max_amount:
                        type: string
                        description: For reference only, in major units
                      verification_source:
                        type: string
                        enum:
                          - provider
                          - local
                        description: '`provider` when a bank confirmed it, `local` for format checks only'
                  error:
                    type: 'null'
              example:
                data:
                  verified: true
                  account_holder_name: ADA OKAFOR
                  verification_source: provider
                error: null
        '400':
          description: No identifier, or an invalid institution ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'at least one account identifier required: account_number, iban, phone, or clabe'
  /v1/external-accounts/{external_account_id}:
    get:
      tags:
        - External accounts
      summary: Get an external account
      operationId: getExternalAccount
      description: >-
        Returns one external account. After a 202, poll every 30 to 60 seconds
        until `status` is `active` (ready for transfers) or `setup_failed`
        (read `error_message`, then correct the account with PATCH). Not-found
        is a 400.
      parameters:
        - $ref: '#/components/parameters/ExternalAccountIdPath'
      responses:
        '200':
          description: The external account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountEnvelope'
              example:
                data:
                  id: 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60
                  payee_type: swift
                  account_number: '12345678'
                  institution_id: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
                  institution_type: swift
                  institution_name: Example Bank
                  account_name: ACME TRADING LTD
                  bic: MIDLGB22
                  customer_id: 3130ca8b-8b32-4843-8623-bf83e766b86a
                  currency: USD
                  institution_country_iso_code: GB
                  account_owner_type: business
                  status: setup_failed
                  date_created: '2026-10-12T09:15:22.481Z'
                  error_message: these account details could not be accepted
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags:
        - External accounts
      summary: Update an external account
      operationId: updateExternalAccount
      description: >-
        Corrects an external account. Use it to fix the bank details of a
        `setup_failed` account, which runs setup again, or to add the national
        ID, PIX key or address that a payout corridor asks for. An empty body on
        a failed account retries setup.


        It always returns 202. Get the account until it is `active` or
        `setup_failed`. A 409 means the account cannot change in its current
        state, so add a new one instead. This route needs no Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/ExternalAccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalAccountRequest'
            example:
              account_number: '87654321'
              bank_postal_code: E14 5HQ
      responses:
        '202':
          description: Updated. Setup runs again after a bank details change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountEnvelope'
        '400':
          description: Invalid field or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'account name cannot be cleared: invalid input'
        '404':
          description: No such external account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'payee 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60: resource not found'
                code: ERROR_CODE_NOT_FOUND
        '409':
          description: >-
            The account cannot change in its state, its address is already
            registered, the change makes a duplicate, or another request changed
            it first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: >-
                  payee 6a2f0c1e-93b4-4d0e-8f57-1c2b3d4e5f60 is not correctable in
                  its current state (active): invalid state transition
                code: ERROR_CODE_PAYEE_INVALID_STATE
        '500':
          description: The update failed. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: We couldn't update this payee. Please try again later.
                code: ERROR_CODE_INTERNAL_ERROR
  /v1/external-accounts/institutions:
    get:
      tags:
        - External accounts
      summary: List institutions
      operationId: listExternalAccountInstitutions
      description: >-
        Lists the banks and mobile money operators an external account can
        name in `institution_id`. SWIFT banks appear only when you send
        `institution_type=swift`, `swift_code` or `search`. Filters match
        exactly, so send codes in upper case.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: items_per_page
          schema:
            type: integer
            minimum: 1
            default: 10
        - in: query
          name: country_iso_code
          schema:
            type: string
          description: Alpha-2 country code
          example: KE
        - in: query
          name: institution_type
          schema:
            type: string
            enum:
              - bank
              - mobile_money
              - swift
              - swift_intermediary
          description: Defaults to every type except `swift_intermediary`
        - in: query
          name: account_number_type
          schema:
            type: string
            enum:
              - bank_account_number
              - iban
              - phone_number
              - clabe
        - in: query
          name: currency
          schema:
            type: string
          example: KES
        - in: query
          name: swift_code
          schema:
            type: string
            pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
          description: Find a SWIFT bank by its 8- or 11-character BIC
          example: MIDLGB22
        - in: query
          name: search
          schema:
            type: string
            minLength: 3
          description: Find SWIFT banks by name or BIC, at least 3 characters
      responses:
        '200':
          description: A page of institutions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                      items_per_page:
                        type: integer
                      total_pages:
                        type: integer
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Institution'
                      total_items:
                        type: integer
                  error:
                    type: 'null'
              example:
                data:
                  page: 1
                  items_per_page: 10
                  total_pages: 1
                  items:
                    - id: 9c1d2e3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
                      name: Example Mobile Money
                      country_iso_code: KE
                      currency: KES
                      min_amount: 1
                      max_amount: 10000
                      account_number_type: phone_number
                  total_items: 1
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
