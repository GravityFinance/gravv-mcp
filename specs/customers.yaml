openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    This is the API Gateway for Gravv services.
    Use the `Api-Key` header for authentication.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required for POST requests. 1 to 255 printable ASCII characters. A retry
        with the same key and body within 24 hours returns the first response.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: create-customer-ada-obi-1
  schemas:
    PersonName:
      type: string
      pattern: ^[A-Za-z\s'-]+$
      description: Letters, spaces, apostrophes and hyphens only.
    Phone:
      type: string
      description: >-
        A valid phone number in international format with a leading `+`, such
        as `+2348031234567`. Fictional ranges such as +1 555-01xx are rejected.
      example: '+2348031234567'
    CreateCustomerRequest:
      oneOf:
        - title: Individual Customer
          type: object
          required:
            - first_name
            - last_name
            - email
            - type
            - gender
            - date_of_birth
            - address
            - phone
          properties:
            first_name:
              $ref: '#/components/schemas/PersonName'
            middle_name:
              type: string
            last_name:
              $ref: '#/components/schemas/PersonName'
            email:
              type: string
              format: email
              example: ada.obi@example.com
            phone:
              $ref: '#/components/schemas/Phone'
            date_of_birth:
              type: string
              format: date
              description: Date of birth as YYYY-MM-DD
              example: '1990-04-16'
            gender:
              type: string
              enum:
                - male
                - female
                - other
              example: female
            type:
              type: string
              description: Lower case only.
              enum:
                - individual
              example: individual
            external_id:
              type: string
              description: Your own reference for the customer. It must be unique in your tenant.
              example: individual_12345
            address:
              $ref: '#/components/schemas/Address'
        - title: Business Customer
          type: object
          required:
            - email
            - type
            - business_name
            - business_description
            - business_type
            - business_industry
            - registration_number
            - address
            - phone
            - associated_persons
          properties:
            email:
              type: string
              format: email
              description: >-
                Business contact email. It must use a company domain; free email
                domains such as gmail.com are rejected.
              example: ops@acmecorp.com
            type:
              type: string
              description: Lower case only.
              enum:
                - business
              example: business
            business_name:
              type: string
              pattern: ^[A-Za-z0-9\s'&,.()-]+$
              description: >-
                Registered business name. Letters, digits, spaces and `' & , . (
                ) -` only.
              example: Acme Corporation
            phone:
              $ref: '#/components/schemas/Phone'
            business_description:
              type: string
              description: Short description of what the business does
              example: Payments software
            business_type:
              type: string
              description: Type of business entity
              example: private_limited
              maxLength: 100
            business_industry:
              type: string
              description: >-
                Industry of the business. An exact match of one of these sets
                `industry_code`: Agriculture, Forestry, Fishing and Hunting;
                Mining, Quarrying, and Oil and Gas Extraction; Utilities;
                Construction; Manufacturing; Wholesale Trade; Retail Trade;
                Transportation and Warehousing; Information. Any other value
                gives `999999`.
              example: Information
              maxLength: 150
            registration_number:
              type: string
              description: Business registration number
              example: RC-987654
              maxLength: 100
            external_id:
              type: string
              description: Your own reference for the customer. It must be unique in your tenant.
              example: business_12345
            address:
              $ref: '#/components/schemas/Address'
            associated_persons:
              type: array
              minItems: 1
              description: >-
                Directors and owners of the business. Each becomes its own
                customer of type `ubo` and must complete KYC before the business
                can. Each email must be unique and differ from the business
                email.
              items:
                $ref: '#/components/schemas/AssociatedPerson'
    Address:
      type: object
      required:
        - address_line1
        - city
        - postal_code
        - state
        - country
      properties:
        address_line1:
          type: string
          example: 12 Admiralty Way
        address_line2:
          type: string
          example: Suite 202
        city:
          type: string
          maxLength: 100
          example: Lagos
        postal_code:
          type: string
          maxLength: 20
          example: '106104'
        state:
          type: string
          pattern: ^[A-Z]{2}-[A-Z0-9]{2,3}$
          description: >-
            ISO 3166-2 code, such as `NG-LA` or `US-FL`. It must belong to
            `country`.
          example: NG-LA
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 code in upper case, such as `NG`.
          example: NG
    AssociatedPerson:
      type: object
      required:
        - first_name
        - last_name
        - email
        - date_of_birth
        - gender
        - address
      properties:
        first_name:
          $ref: '#/components/schemas/PersonName'
        middle_name:
          type: string
          example: A.
        last_name:
          $ref: '#/components/schemas/PersonName'
        email:
          type: string
          format: email
          example: jane.doe@acmecorp.com
        date_of_birth:
          type: string
          format: date
          example: '1990-06-15'
        gender:
          type: string
          enum:
            - male
            - female
            - other
          example: female
        phone:
          $ref: '#/components/schemas/Phone'
        address:
          $ref: '#/components/schemas/Address'
    UpdateCustomerRequest:
      type: object
      description: >-
        The path `customer_id` selects the customer. Every field is optional.
        Only non-empty values change anything, so a field cannot be cleared.
      properties:
        customer_id:
          type: string
          format: uuid
          description: Ignored. The path `customer_id` replaces any value you send.
          example: e59daa17-20ed-4727-833c-e1c633782cc8
        first_name:
          $ref: '#/components/schemas/PersonName'
        middle_name:
          type: string
          example: A.
        last_name:
          $ref: '#/components/schemas/PersonName'
        email:
          type: string
          format: email
          description: >-
            New email. It must be unique in your tenant and use a company
            domain, for every customer type.
          example: jane@acmecorp.com
        phone:
          $ref: '#/components/schemas/Phone'
        date_of_birth:
          type: string
          format: date
          example: '1990-04-16'
        gender:
          type: string
          enum:
            - male
            - female
            - other
          example: female
        address:
          description: >-
            New address. The state and country check runs only when you send
            both.
          allOf:
            - $ref: '#/components/schemas/AddressUpdate'
        business_name:
          type: string
          pattern: ^[A-Za-z0-9\s'&,.()-]+$
          example: Acme Corporation
        business_description:
          type: string
          example: Payments software
        business_type:
          type: string
          example: private_limited
        business_industry:
          type: string
          example: Information
        registration_number:
          type: string
          example: RC-987654
        external_id:
          type: string
          example: business_12345
        associated_persons:
          type: array
          description: >-
            Business customers only; ignored for individuals. Send `id` to edit
            a person. Omit it to add a new person, who then needs
            `first_name`, `last_name`, `email`, `gender`, `date_of_birth`,
            `phone` and `address`.
          items:
            $ref: '#/components/schemas/UpdateAssociatedPerson'
    AddressUpdate:
      type: object
      properties:
        address_line1:
          type: string
          example: 12 Admiralty Way
        address_line2:
          type: string
          example: Suite 202
        city:
          type: string
          example: Lagos
        postal_code:
          type: string
          example: '106104'
        state:
          type: string
          pattern: ^[A-Z]{2}-[A-Z0-9]{2,3}$
          example: NG-LA
        country:
          type: string
          pattern: ^[A-Z]{2}$
          example: NG
    UpdateAssociatedPerson:
      type: object
      description: >-
        Send `id` to edit an existing person. Omit it to add a new person, who
        then needs `first_name`, `last_name`, `email`, `gender`,
        `date_of_birth`, `phone` and `address`.
      properties:
        id:
          type: string
          format: uuid
          description: ID of an existing associated person. Omit it to add a new person.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        first_name:
          $ref: '#/components/schemas/PersonName'
        middle_name:
          type: string
          example: A.
        last_name:
          $ref: '#/components/schemas/PersonName'
        email:
          type: string
          format: email
          example: jane.doe@acmecorp.com
        date_of_birth:
          type: string
          format: date
          example: '1990-06-15'
        gender:
          type: string
          enum:
            - male
            - female
            - other
          example: female
        phone:
          $ref: '#/components/schemas/Phone'
        address:
          $ref: '#/components/schemas/Address'
    CustomerResponse:
      type: object
      description: >-
        A customer. Empty fields are left out, so a business has no
        `first_name` and an individual has no `business_name`.
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          example: e59daa17-20ed-4727-833c-e1c633782cc8
        type:
          type: string
          description: '`ubo` is an associated person of a business.'
          enum:
            - individual
            - business
            - ubo
          example: individual
        first_name:
          type: string
          example: Ada
        middle_name:
          type: string
          example: A.
        last_name:
          type: string
          example: Obi
        date_of_birth:
          type: string
          example: '1990-04-16'
        gender:
          type: string
          example: female
        email:
          type: string
          format: email
          example: ada.obi@example.com
        phone:
          type: string
          example: '+2348031234567'
        address:
          $ref: '#/components/schemas/Address'
        status:
          type: string
          example: active
        kyc:
          type: array
          description: >-
            KYC records, one per level. Read the `basic` record's `status` to
            know whether the customer is verified. The create response may not
            include them; get the customer to read them.
          items:
            $ref: '#/components/schemas/KYCInfo'
        associated_persons:
          type: array
          description: >-
            The persons of a business. Returned when you get one business, not
            in the list. Each person's `id` is the ID to use for their own KYC.
          items:
            $ref: '#/components/schemas/CustomerResponse'
        business_name:
          type: string
          example: Acme Corporation
        business_description:
          type: string
          example: Payments software
        business_type:
          type: string
          example: private_limited
        business_industry:
          type: string
          example: Information
        registration_number:
          type: string
          example: RC-987654
        industry_code:
          type: string
          description: Six-digit code set from `business_industry`. `999999` when there is no match.
          example: '513199'
        date_added:
          type: string
          format: date-time
          description: Time the customer was created, in RFC 3339.
          example: '2026-10-13T09:12:44Z'
        external_id:
          type: string
          example: individual_12345
    KYCInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type:
          type: string
          description: >-
            KYC level. `basic` is the level every flow checks. `intermediate`
            exists for every customer, but no developer route starts it.
          enum:
            - basic
            - intermediate
          example: basic
        status:
          type: string
          description: >-
            `not_started`, then `pending` while under review, then `completed`
            or `failed`. `initiating` appears briefly while card KYC starts.
          enum:
            - not_started
            - initiating
            - pending
            - completed
            - failed
          example: not_started
        kyc_url:
          type: string
          description: The latest hosted verification link, once one was issued
          example: https://verify.gravv.xyz/websdk/p/example_token
        remark:
          type: string
          description: Reason text when verification failed
          example: ''
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
          example: null
    ErrorResponse:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: string
          example: invalid request body
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            error: invalid request body
security:
  - ApiKeyAuth: []
tags:
  - name: Customers
    description: Manage customer records
paths:
  /v1/customers:
    post:
      tags:
        - Customers
      summary: Add a customer
      description: >
        Creates an individual or business customer. A business is created with
        its associated persons in the same call, and each person becomes its
        own customer of type `ubo`.


        Each new customer gets `basic` and `intermediate` KYC records with
        status `not_started`, and a `customer.created` webhook. A duplicate
        email or `external_id` is a 400, not a 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            examples:
              IndividualCustomer:
                summary: Individual Customer Example
                value:
                  first_name: Ada
                  last_name: Obi
                  email: ada.obi@example.com
                  phone: '+2348031234567'
                  type: individual
                  gender: female
                  date_of_birth: '1990-04-16'
                  external_id: individual_12345
                  address:
                    address_line1: 12 Admiralty Way
                    city: Lagos
                    postal_code: '106104'
                    state: NG-LA
                    country: NG
              BusinessCustomer:
                summary: Business Customer Example
                value:
                  type: business
                  email: ops@acmecorp.com
                  phone: '+2348031234567'
                  business_name: Acme Corporation
                  business_description: Payments software
                  business_type: private_limited
                  business_industry: Information
                  registration_number: RC-987654
                  external_id: BUS-67890
                  address:
                    address_line1: 1800 N Pole St
                    address_line2: Suite 202
                    city: Orlando
                    postal_code: '32801'
                    state: US-FL
                    country: US
                  associated_persons:
                    - first_name: Jane
                      last_name: Doe
                      email: jane.doe@acmecorp.com
                      date_of_birth: '1990-06-15'
                      gender: female
                      address:
                        address_line1: 1800 N Pole St
                        city: Orlando
                        postal_code: '32801'
                        state: US-FL
                        country: US
      responses:
        '200':
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomerResponse'
                  error:
                    type: 'null'
              example:
                data:
                  id: e59daa17-20ed-4727-833c-e1c633782cc8
                  first_name: Ada
                  last_name: Obi
                  type: individual
                  email: ada.obi@example.com
                  phone: '+2348031234567'
                  date_of_birth: '1990-04-16'
                  gender: female
                  address:
                    address_line1: 12 Admiralty Way
                    city: Lagos
                    postal_code: '106104'
                    state: NG-LA
                    country: NG
                  status: active
                  date_added: '2026-10-13T09:12:44Z'
                  external_id: individual_12345
                error: null
        '400':
          description: Invalid request, or a duplicate email or external_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidPhone:
                  summary: The phone number is not valid
                  value:
                    data: null
                    error: phone number is not valid
                InvalidState:
                  summary: The state is not an ISO 3166-2 code
                  value:
                    data: null
                    error: 'invalid state "FL": expected ISO 3166-2 code (e.g. "NG-LA")'
                DuplicateEmail:
                  summary: The email is already used in your tenant
                  value:
                    data: null
                    error: 'failed to add customer: email already exists'
                CompanyEmail:
                  summary: A business used a free email domain
                  value:
                    data: null
                    error: only company emails are allowed
    get:
      tags:
        - Customers
      summary: Get customers
      description: >-
        Lists your individual and business customers, newest first. Associated
        persons are not listed; get their business to see them. Unknown or
        invalid filters are ignored.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, from 1
          example: 1
        - in: query
          name: items_per_page
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Items per page. There is no maximum, so page through large sets.
          example: 20
        - in: query
          name: status
          schema:
            type: string
          description: Filter by customer status. `active` is the only status set today.
          example: active
        - in: query
          name: type
          schema:
            type: string
            enum:
              - individual
              - business
          description: Filter by customer type
        - in: query
          name: keyword
          schema:
            type: string
          description: >-
            Search first name, last name, email and customer ID. It does not
            search the business name.
        - in: query
          name: kyc_status
          schema:
            type: string
            enum:
              - not_started
              - initiating
              - pending
              - completed
              - failed
          description: Filter by the status of the customer's `basic` KYC record
      responses:
        '200':
          description: A page of customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerResponse'
                      page:
                        type: integer
                      items_per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_items:
                        type: integer
                        format: int64
                  error:
                    type: 'null'
        '500':
          description: The list could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'failed to retrieve customers: database error'
  /v1/customers/{customer_id}:
    get:
      tags:
        - Customers
      summary: Get a single customer
      description: >-
        Returns one customer with its KYC records, and for a business its
        associated persons. It also returns an associated person by its own
        `id`. Send no query parameters.
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            format: uuid
          example: e59daa17-20ed-4727-833c-e1c633782cc8
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomerResponse'
                  error:
                    type: 'null'
        '400':
          description: Invalid ID, or the customer is not in your tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  summary: The customer does not exist in your tenant
                  value:
                    data: null
                    error: 'failed to retrieve customer: customer not found'
                InvalidId:
                  summary: customer_id is not a valid UUID
                  value:
                    data: null
                    error: 'invalid customer ID: invalid UUID length: 5'
    put:
      tags:
        - Customers
      summary: Update a customer
      description: >-
        Updates the fields you send on one customer. The path `customer_id`
        selects the customer and replaces any `customer_id` in the body. Empty
        values change nothing, the customer type cannot change, and KYC status
        is not reset. The response does not include the customer; get it to
        read the result.
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            format: uuid
          description: The customer to update. It replaces any `customer_id` in the body.
          example: e59daa17-20ed-4727-833c-e1c633782cc8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
            examples:
              UpdateIndividual:
                summary: Update an individual's name and phone
                value:
                  first_name: Jane
                  last_name: Smith
                  phone: '+2348031234568'
              UpdateBusiness:
                summary: Update business fields and a person
                value:
                  business_name: Acme Corp Ltd
                  business_description: Enterprise software solutions
                  registration_number: RC-111222
                  associated_persons:
                    - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      first_name: Jane
                      last_name: Doe
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      status:
                        type: boolean
                  error:
                    type: 'null'
              example:
                data:
                  message: customer updated successfully
                  status: true
                error: null
        '400':
          description: Invalid field, or the customer is not in your tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  summary: The customer does not exist in your tenant
                  value:
                    data: null
                    error: 'failed to update customer: user not found'
                NewPersonPhone:
                  summary: A new associated person has no phone
                  value:
                    data: null
                    error: associated person phone is required for new persons
