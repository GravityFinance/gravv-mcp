openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    The API gateway for Gravv services.
    Send your API key in the `Api-Key` header to authenticate.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    EventIdPath:
      name: id
      in: path
      required: true
      description: >-
        The delivery record `id` from the history list. It is not the
        `event_id` in the delivered body.
      schema:
        type: string
        format: uuid
      example: 0b3c2f4e-7c1a-4e0e-9a51-2f7d1c9e8a10
  schemas:
    ErrorResponse:
      type: object
      properties:
        data:
          type: 'null'
          example: null
        error:
          type: string
          example: event not found
    DeliveryStatus:
      type: string
      description: >-
        Delivery status. A delivery moves from `pending` to `processing`, then
        to `sent` on a 2xx or to `retrying` on a failure. After the last allowed
        attempt it is `failed`.
      enum:
        - pending
        - processing
        - sent
        - failed
        - retrying
      example: sent
    WebhookHistoryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              description: Delivery records, newest first. Empty when nothing matches.
              items:
                $ref: '#/components/schemas/WebhookHistorySummary'
            items_per_page:
              type: integer
              format: int32
              description: The page size used, after the default and the cap of 100
              example: 50
            page:
              type: integer
              format: int32
              description: Current page, starting at 1
              example: 1
            total_items:
              type: integer
              format: int64
              description: Number of matching records
              example: 150
            total_pages:
              type: integer
              format: int32
              description: Number of pages. 0 when there are no records.
              example: 3
        error:
          type: 'null'
          example: null
    WebhookHistorySummary:
      type: object
      description: One delivery record. Call `GET /v1/webhooks/event/{id}` for the payload.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Delivery record ID. Use it with the detail, calls and send routes.
          example: 0b3c2f4e-7c1a-4e0e-9a51-2f7d1c9e8a10
        transaction_id:
          type: string
          description: >-
            Transaction ID stored with the event, when there is one. For a
            transfer event it is the first of `associated_transactions`, not
            the transfer `reference`. For a collection event it is the
            collection `transaction_id`.
          example: 5d1e7a3b-2c4f-4b8e-9d6a-1f0e3c2b7a95
        event_type:
          type: string
          description: >-
            The event category, such as `transfer` or `cards`. The full event
            type is in the detail route's `payload.event_type`.
          example: transfer
        path:
          type: string
          description: >-
            URL path of your endpoint at the last attempt. Empty before the
            first attempt.
          example: /hooks/gravv
        http_method:
          type: string
          description: Always `POST`
          enum:
            - POST
          example: POST
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        response_status_code:
          type:
            - integer
            - 'null'
          format: int32
          description: >-
            Last HTTP status from your endpoint. Null until your endpoint
            responds. 0 when an attempt failed before Gravv made any call, for
            example because no webhook URL is set or the URL is not https.
          example: 200
        created_at:
          type: string
          format: date-time
          description: When Gravv recorded the event
          example: '2026-10-13T09:15:02.481263Z'
        last_attempt:
          type: string
          format: date-time
          description: >-
            Time of the last failed attempt. The API leaves it out until an
            attempt fails.
          example: '2026-10-13T09:11:15.330127Z'
    WebhookEventDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Delivery record ID
          example: 0b3c2f4e-7c1a-4e0e-9a51-2f7d1c9e8a10
        transaction_id:
          type: string
          description: As in the history list. The API leaves it out when there is none.
          example: 5d1e7a3b-2c4f-4b8e-9d6a-1f0e3c2b7a95
        event_id:
          type: string
          description: >-
            The event's `event_group_id`, the same value as the `X-Event-ID`
            header. It is not the `event_id` in the payload. Deduplicate on
            `payload.event_id`.
          example: 9a7c1e52-6b3d-4f0a-8e21-7d5c4b3a2f10
        event_type:
          type: string
          description: >-
            The event category, such as `transfer` or `cards`. The full event
            type is in `payload.event_type`.
          example: transfer
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        path:
          type: string
          description: URL path of your endpoint. Empty before the first attempt.
          example: /hooks/gravv
        http_method:
          type: string
          enum:
            - POST
          example: POST
        payload:
          type: object
          description: >-
            A stored copy of the event body. Its keys are in a different order
            from the bytes your endpoint received, so you cannot check a
            signature against it.
          additionalProperties: true
        response_headers:
          type: object
          description: Headers your endpoint returned on the last attempt
          additionalProperties:
            type: array
            items:
              type: string
        response_status_code:
          type:
            - integer
            - 'null'
          format: int32
          description: >-
            Last HTTP status from your endpoint. Null until your endpoint
            responds. 0 when an attempt failed before Gravv made any call, for
            example because no webhook URL is set or the URL is not https.
          example: 200
        response_body:
          type: object
          description: >-
            Your endpoint's last response body, up to 64 KiB. Gravv wraps a body
            that is not JSON as `{"error": "Invalid JSON response", "raw":
            "..."}`.
          additionalProperties: true
        attempts:
          type: integer
          format: int32
          description: >-
            Failed attempts so far. A successful delivery does not add to it.
          minimum: 0
          example: 0
        max_retries:
          type: integer
          format: int32
          description: Total attempts allowed
          example: 50
        last_attempt:
          type: string
          format: date-time
          description: Time of the last failed attempt. The API leaves it out until one fails.
        next_attempt:
          type: string
          format: date-time
          description: When the next retry may run. The API leaves it out when none is due.
        created_at:
          type: string
          format: date-time
          example: '2026-10-13T09:15:02.512004Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-13T09:15:31.004417Z'
    WebhookCall:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Attempt ID
        attempt_number:
          type: integer
          description: Attempt number, starting at 1
          example: 1
        request_url:
          type: string
          description: Full URL called
          example: https://merchant.example.com/hooks/gravv
        response_status:
          type:
            - integer
            - 'null'
          description: Your status code. Null when no response came back.
          example: 200
        status:
          type: string
          description: Result of the attempt
          enum:
            - sent
            - failed
          example: sent
        response_time_ms:
          type:
            - integer
            - 'null'
          description: Time to the response, in milliseconds
          example: 184
        created_at:
          type: string
          format: date-time
        error_message:
          type:
            - string
            - 'null'
          description: The connection error, when there was one
security:
  - ApiKeyAuth: []
tags:
  - name: Webhooks
    description: View webhook event history and delivery details
paths:
  /v1/webhooks/history:
    get:
      operationId: getWebhookHistory
      summary: List webhook event history
      description: >-
        Lists the webhook delivery records for your business, newest first.
        There is one record for each event Gravv sent you. Sandbox and live
        keys see separate records. You can combine all filters.
      tags:
        - Webhooks
      parameters:
        - name: transaction_id
          in: query
          required: false
          description: >-
            Exact transaction ID stored with the event. For transfers it is
            the first of `associated_transactions`, not the transfer
            `reference`.
          schema:
            type: string
          example: 5d1e7a3b-2c4f-4b8e-9d6a-1f0e3c2b7a95
        - name: event_type
          in: query
          required: false
          description: >-
            Event category: `transfer`, `inflow`, `account`,
            `applications.accounts`, `external_account`, `cards`, `collection`
            or `customer`. A full event type such as
            `transfer.status.completed` matches nothing and returns an empty
            list.
          schema:
            type: string
          example: transfer
        - name: status
          in: query
          required: false
          description: >-
            Delivery status. Any other value returns an empty list, not an
            error.
          schema:
            $ref: '#/components/schemas/DeliveryStatus'
          example: failed
        - name: start_date
          in: query
          required: false
          description: >-
            Records created at or after this time. Send RFC3339
            (`2026-10-01T00:00:00Z`), a date (`2026-10-01`, read as 00:00 UTC)
            or a datetime without a zone (read as UTC).
          schema:
            type: string
          example: '2026-10-01T00:00:00Z'
        - name: end_date
          in: query
          required: false
          description: >-
            Records created at or before this time, in the same formats. A date
            alone means 00:00 of that day, so the day itself is left out. It
            must not be before `start_date`.
          schema:
            type: string
          example: '2026-10-31T23:59:59Z'
        - name: limit
          in: query
          required: false
          description: >-
            Records per page. The API lowers a value over 100 to 100, and 0
            means the default.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 100
            default: 50
          example: 20
        - name: page
          in: query
          required: false
          description: Page number, starting at 1
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          example: 1
      responses:
        '200':
          description: A page of delivery records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookHistoryResponse'
              example:
                data:
                  items:
                    - id: 0b3c2f4e-7c1a-4e0e-9a51-2f7d1c9e8a10
                      transaction_id: 5d1e7a3b-2c4f-4b8e-9d6a-1f0e3c2b7a95
                      event_type: transfer
                      status: sent
                      path: /hooks/gravv
                      http_method: POST
                      response_status_code: 200
                      created_at: '2026-10-13T09:15:02.481263Z'
                    - id: 8f6d2a1c-3b5e-4c7d-8e9f-0a1b2c3d4e5f
                      event_type: cards
                      status: retrying
                      path: /hooks/gravv
                      http_method: POST
                      response_status_code: 500
                      created_at: '2026-10-13T09:10:44.102938Z'
                      last_attempt: '2026-10-13T09:11:15.330127Z'
                  items_per_page: 50
                  page: 1
                  total_items: 2
                  total_pages: 1
                error: null
        '400':
          description: >-
            The request failed, for example
            `start_date must not be after end_date`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'invalid limit parameter: must be a valid integer'
  /v1/webhooks/event/{id}:
    get:
      operationId: getWebhookEventDetail
      summary: Get webhook event details
      description: >-
        Returns one delivery record with the stored payload, the delivery state
        and your endpoint's last response. Use it to see what was sent and why
        a delivery failed. The response does not include request headers.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        '200':
          description: The delivery record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEventDetail'
                  error:
                    type: 'null'
              example:
                data:
                  id: 0b3c2f4e-7c1a-4e0e-9a51-2f7d1c9e8a10
                  transaction_id: 5d1e7a3b-2c4f-4b8e-9d6a-1f0e3c2b7a95
                  event_id: 9a7c1e52-6b3d-4f0a-8e21-7d5c4b3a2f10
                  event_type: transfer
                  status: sent
                  path: /hooks/gravv
                  http_method: POST
                  payload:
                    event_category: transfer
                    event_data:
                      amount: '100.5'
                      associated_transactions:
                        - 5d1e7a3b-2c4f-4b8e-9d6a-1f0e3c2b7a95
                      client_reference: inv-2291
                      reference: 9a7c1e52-6b3d-4f0a-8e21-7d5c4b3a2f10
                      status: completed
                      transfer_status: completed
                    event_group_id: 9a7c1e52-6b3d-4f0a-8e21-7d5c4b3a2f10
                    event_id: e4b1c0d2-3f5a-4e6b-8c7d-9a0b1c2d3e4f
                    event_type: transfer.status.completed
                    idempotency_key: 9a7c1e52-6b3d-4f0a-8e21-7d5c4b3a2f10:4
                    timestamp: '2026-10-13T09:15:02.481263Z'
                    transaction_id: 5d1e7a3b-2c4f-4b8e-9d6a-1f0e3c2b7a95
                  response_headers:
                    Content-Type:
                      - application/json
                  response_status_code: 200
                  response_body:
                    received: true
                  attempts: 0
                  max_retries: 50
                  created_at: '2026-10-13T09:15:02.512004Z'
                  updated_at: '2026-10-13T09:15:31.004417Z'
                error: null
        '400':
          description: >-
            The request failed. An unknown ID, or one from another business or
            environment, returns `event not found`. If your endpoint's last
            response was JSON but not an object, this route returns
            `failed to process event data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: event not found
  /v1/webhooks/calls/{id}:
    get:
      operationId: getWebhookCallHistory
      summary: Get call history for a webhook event
      description: >-
        Lists every delivery attempt for one record, newest first, with the
        status code, time taken and any connection error. The list leaves out
        attempts that failed before Gravv made the call, such as a missing or
        unsafe URL. Those only add to `attempts` on the detail route.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        '200':
          description: The attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      calls:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookCall'
                  error:
                    type: 'null'
              example:
                data:
                  calls:
                    - id: 71c2e0a4-5b3d-4f6e-8a9b-0c1d2e3f4a5b
                      attempt_number: 2
                      request_url: https://merchant.example.com/hooks/gravv
                      response_status: 200
                      status: sent
                      response_time_ms: 184
                      created_at: '2026-10-13T09:11:15.330127Z'
                      error_message: null
                    - id: 2a9f8e7d-6c5b-4a3f-9e8d-7c6b5a4f3e2d
                      attempt_number: 1
                      request_url: https://merchant.example.com/hooks/gravv
                      response_status: 500
                      status: failed
                      response_time_ms: 92
                      created_at: '2026-10-13T09:10:45.017733Z'
                      error_message: null
                error: null
        '400':
          description: >-
            The request failed. An unknown ID returns
            `event not found or not owned by tenant`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: event not found or not owned by tenant
  /v1/webhooks/event/send/{id}:
    post:
      operationId: retryWebhookEvent
      summary: Resend a webhook event
      description: >-
        Sends one stored event to your current webhook URL now and returns your
        endpoint's response. The call waits up to 30 seconds for your endpoint.
        It needs the `webhook:create` permission. No `Idempotency-Key` is
        needed, and each call sends the event again.


        The resend is not signed and carries no `X-Signature` header. The call
        returns HTTP 200 with your endpoint's status code, even when your
        endpoint returned a non-2xx status. A failed resend puts the event back
        into signed automatic retries.
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        '200':
          description: >-
            The event was sent. Read `status_code` for your endpoint's response
            status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Delivery record ID
                      tenant_id:
                        type: string
                        format: uuid
                        description: Your business ID
                      event_category:
                        type: string
                        example: transfer
                      target_url:
                        type: string
                        description: Full URL called
                        example: https://merchant.example.com/hooks/gravv
                      status_code:
                        type: integer
                        description: HTTP status code returned by your endpoint
                        example: 200
                      duration_ms:
                        type: integer
                        format: int64
                        description: Round trip in milliseconds
                        example: 142
                      response_body:
                        description: >-
                          Your endpoint's response body. Null for an empty
                          body.
                  error:
                    type: 'null'
              example:
                data:
                  id: 0b3c2f4e-7c1a-4e0e-9a51-2f7d1c9e8a10
                  tenant_id: dfa96ede-fc13-43cf-8328-8b910d1cd1d2
                  event_category: transfer
                  target_url: https://merchant.example.com/hooks/gravv
                  status_code: 200
                  duration_ms: 142
                  response_body:
                    received: true
                error: null
        '400':
          description: >-
            The event could not be sent. Errors include
            `event is already being processed`, `event not found`, an unsafe
            URL such as `unsafe webhook url: webhook url must use https scheme`,
            and `webhook delivery failed: <error>` when no response came back.
            The last error also schedules an automatic retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: event is already being processed
