security:
  - ApiKeyAuth: []
tags:
  - name: Accounts
    description: Manage internal accounts
paths:
  /v1/accounts/applications:
    post:
      tags:
        - Accounts
      summary: Create account application
      description: >-
        Create a new account application for a given customer.


        For sandbox and testing integrations, use `polygon` as the
        `blockchain_network`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountApplicationRequest'
            examples:
              Individual application:
                summary: Create an individual account application
                value:
                  customer_id: 123e4567-e89b-12d3-a456-426614174000
                  application_type: individual
                  data:
                    account_type: regular
                    currency: USD
                    blockchain_network: polygon
                    wallet_address: 0x123...
                    wallet_id: 123e4567-e89b-12d3-a456-426614174000
                    label: ops
                    agreement_id: agr_123
                    tos_link: https://example.com/tos
                    tier: tier_1
                    metadata:
                      source: web
                    individual:
                      first_name: John
                      last_name: Doe
                      middle_name: Robert
                      email: john.doe@example.com
                      role: owner
                      phone: '+14155552671'
                      date_of_birth: '1980-01-01'
                      gender: male
                      nationality: US
                      ssn: '000000000'
                      tin: '000000000'
                      income_source: employment
                      employment_status: employed
                      citizenship: US
                      identification_type: passport
                      identification_number: P1234567
                      identification_country: US
                      identification_expiry: '2030-01-01'
                      address:
                        street_line_1: 123 Main St
                        street_line_2: Apt 4B
                        city: San Francisco
                        state: CA
                        postal_code: '94105'
                        country: US
                      id_document_front: data:application/pdf;base64,...
                      id_document_back: data:application/pdf;base64,...
                      proof_of_address_document: data:application/pdf;base64,...
                      source_of_wealth:
                        - SALARY
                      source_of_wealth_other_description: Salary from tech job
                      account_purposes:
                        - PERSONAL_BANKING
                      account_purposes_other_description: Personal savings
                      source_of_funds_list:
                        - INCOME
                      source_of_funds_other_description: Income
                      expected_counterparty_countries:
                        - US
                        - GB
                      expected_fiat_monthly_volume: 10000_TO_50000
                      expected_crypto_monthly_volume: 10000_TO_50000
              Business application:
                summary: Create a business account application
                value:
                  customer_id: 123e4567-e89b-12d3-a456-426614174000
                  application_type: business
                  data:
                    account_type: regular
                    currency: USD
                    blockchain_network: polygon
                    wallet_address: 0x123...
                    wallet_id: 123e4567-e89b-12d3-a456-426614174000
                    label: ops
                    agreement_id: agr_123
                    tos_link: https://example.com/tos
                    tier: tier_1
                    metadata:
                      source: web
                    business:
                      legal_name: Acme Corp
                      trade_name: Acme
                      description: A very detailed description of Acme Corp here.
                      type: llc
                      industry: software
                      website: https://acme.corp
                      registration_number: '12345678'
                      tax_id_number: '000000000'
                      date_of_incorporation: '2010-01-01'
                      country_of_incorporation: US
                      state_of_incorporation: DE
                      business_status: active
                      registered_address:
                        street_line_1: 123 Business Rd
                        street_line_2: Suite 100
                        city: New York
                        state: NY
                        postal_code: '10001'
                        country: US
                      physical_address:
                        street_line_1: 123 Business Rd
                        street_line_2: Suite 100
                        city: New York
                        state: NY
                        postal_code: '10001'
                        country: US
                      mailing_address:
                        street_line_1: 123 Business Rd
                        street_line_2: Suite 100
                        city: New York
                        state: NY
                        postal_code: '10001'
                        country: US
                      primary_contact:
                        first_name: John
                        last_name: Doe
                        email: john.doe@example.com
                        phone: '+14155552671'
                        date_of_birth: '1980-01-01'
                        citizenship: US
                        identification_type: passport
                        identification_number: P1234567
                        identification_country: US
                        address:
                          street_line_1: 123 Main St
                          city: San Francisco
                          state: CA
                          postal_code: '94105'
                          country: US
                      associated_persons:
                        - first_name: Jane
                          last_name: Smith
                          middle_name: Anne
                          email: jane@acme.corp
                          phone: '+14155552672'
                          date_of_birth: '1985-06-15'
                          citizenship: US
                          ssn: '000000000'
                          title: CEO
                          role: director
                          has_ownership: true
                          has_control: true
                          is_signer: true
                          is_director: true
                          ownership_percentage: 100
                          identification_type: passport
                          identification_number: P7654321
                          identification_country: US
                          identification_expiry: '2030-01-01'
                          id_document_front: data:application/pdf;base64,...
                          id_document_back: data:application/pdf;base64,...
                          proof_of_address_document: data:application/pdf;base64,...
                          address:
                            street_line_1: 456 Home Ave
                            street_line_2: Apt 1
                            city: Brooklyn
                            state: NY
                            postal_code: '11201'
                            country: US
                      has_material_intermediary_ownership: false
                      formation_document: data:application/pdf;base64,...
                      ownership_document: data:application/pdf;base64,...
                      proof_of_address_document: data:application/pdf;base64,...
                      proof_of_nature_of_business: data:application/pdf;base64,...
                      is_dao: false
                      account_purpose: operations
                      source_of_funds: revenue
                      industry_financial_services_subtype: none
                      industry_crypto_subtype: none
                      industry_other_description: Software dev
                      expected_counterparty_countries:
                        - US
                        - GB
                      source_of_funds_list:
                        - REVENUE
                      source_of_funds_other_description: Sales revenue
                      tin_verification_document: data:application/pdf;base64,...
                      authorization_document: data:application/pdf;base64,...
                      is_msb: false
                      account_purposes:
                        - BUSINESS_OPERATIONS
                      account_purposes_other_description: Operations
                      primary_target_market: US
                      primary_target_market_other_description: US market
                      expected_fiat_monthly_volume: 10000_TO_50000
                      expected_crypto_monthly_volume: 10000_TO_50000
      responses:
        '200':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags:
        - Accounts
      summary: Get account applications
      description: Retrieve a list of applications with optional filters and pagination.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: items_per_page
          schema:
            type: integer
          description: Number of items per page
        - in: query
          name: customer_id
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: application_type
          schema:
            type: string
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/accounts/applications/pending:
    get:
      tags:
        - Accounts
      summary: Get pending applications
      description: Retrieve a list of pending applications.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Maximum number of pending applications to return.
      responses:
        '200':
          description: List of pending applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApplicationsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/accounts/applications/{id}:
    get:
      tags:
        - Accounts
      summary: Get account application
      description: Retrieve details of a single application by ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    put:
      tags:
        - Accounts
      summary: Update account application
      description: Update data for a draft or rejected application.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
            example:
              data:
                account_type: regular
                currency: USD
                blockchain_network: polygon
                wallet_address: 0x123...
                wallet_id: 123e4567-e89b-12d3-a456-426614174000
                label: ops
                agreement_id: agr_123
                tos_link: https://example.com/tos
                tier: tier_1
                metadata:
                  source: web
                individual:
                  first_name: John
                  last_name: Doe
                  middle_name: Robert
                  email: john.doe@example.com
                  role: owner
                  phone: '+14155552671'
                  date_of_birth: '1980-01-01'
                  gender: male
                  nationality: US
                  ssn: '000000000'
                  tin: '000000000'
                  income_source: employment
                  employment_status: employed
                  citizenship: US
                  identification_type: passport
                  identification_number: P1234567
                  identification_country: US
                  identification_expiry: '2030-01-01'
                  address:
                    street_line_1: 123 Main St
                    street_line_2: Apt 4B
                    city: San Francisco
                    state: CA
                    postal_code: '94105'
                    country: US
                  id_document_front: data:application/pdf;base64,...
                  id_document_back: data:application/pdf;base64,...
                  proof_of_address_document: data:application/pdf;base64,...
                  source_of_wealth:
                    - SALARY
                  source_of_wealth_other_description: Salary from tech job
                  account_purposes:
                    - PERSONAL_BANKING
                  account_purposes_other_description: Personal savings
                  source_of_funds_list:
                    - INCOME
                  source_of_funds_other_description: Income
                  expected_counterparty_countries:
                    - US
                    - GB
                  expected_fiat_monthly_volume: 10000_TO_50000
                  expected_crypto_monthly_volume: 10000_TO_50000
                business:
                  legal_name: Acme Corp
                  trade_name: Acme
                  description: A very detailed description of Acme Corp here.
                  type: llc
