    GlobalMobileMoneyRecipient:
      type: object
      title: Global Mobile Money Recipient
      required:
        - payee_type
        - phone_number
        - currency
        - institution_id
      properties:
        payee_type:
          type: string
          description: Type of payee
          enum:
            - mobile_money
          example: mobile_money
        phone_number:
          type: string
          description: Mobile money account number or phone number
          example: '+233241234567'
        institution_id:
          type: string
          format: uuid
          description: Institution ID
          example: 4b595668-98dc-4cbc-9ac6-1343b6127a58
        currency:
          type: string
          description: Currency code for the account
          example: NGN
          enum:
            - NGN
