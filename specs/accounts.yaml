            - BDT
            - BIF
            - CNY
            - COP
            - DOP
            - EGP
            - ETB
            - GMD
            - GTQ
            - GNF
            - INR
            - ILS
            - JOD
            - LRD
            - MRU
            - MXN
            - MAD
            - MZN
