            account_number:
              type: string
              description: Bank account number
              example: '1245909283'
            iban:
              type: string
              description: International Bank Account Number (IBAN)
              example: GB33BUKB20201555555555
              maxLength: 34
            bic:
              type: string
              example: NG2893A
            currency:
              type: string
              enum:
                - USD
            address:
              $ref: '#/components/schemas/SwiftRecipientAddress'
        - oneOf:
            - title: With account number
              required:
                - account_number
            - title: With IBAN
              required:
                - iban
    SwiftRecipientAddress:
      type: object
      required:
        - address_line1
        - city
        - postal_code
        - country
      properties:
        address_line1:
          type: string
          example: 1800 N Pole St
        house_building_number:
          type: string
          example: 1B
        address_line2:
          type: string
          example: Suite 202
        city:
          type: string
          example: Orlando
        postal_code:
          type: string
          example: '32801'
        state:
          type: string
          example: US-FL
        country:
          type: string
          example: US
