openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    The API gateway for Gravv services.
    Send your API key in the `Api-Key` header to authenticate.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required for POST requests. 1 to 255 printable ASCII characters. A retry
        with the same key and body within 24 hours returns the first response.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: activate-cards-302dabcb-1
  schemas:
    FeatureId:
      type: string
      description: >-
        The catalogue lists six features: `virtual_cards` (Cards),
        `usd_account`, `eur_account` and `gbp_account` (accounts),
        `crypto_wallet` (Wallet) and `international_transfers` (Payout). These
        routes serve cards, so send `virtual_cards`. Open accounts, wallets and
        payouts with their own APIs.
      enum:
        - crypto_wallet
        - virtual_cards
        - eur_account
        - usd_account
        - gbp_account
        - international_transfers
      example: virtual_cards
    FeatureListResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: object
          required:
            - features
          properties:
            customer_id:
              type: string
              format: uuid
              description: The `customer_id` you sent
            country:
              type: string
              description: The `country` you sent
            features:
              type: array
              description: The feature catalogue, in no fixed order
              items:
                type: object
                required:
                  - feature_id
                  - name
                  - description
                  - activated
                properties:
                  feature_id:
                    $ref: '#/components/schemas/FeatureId'
                  name:
                    type: string
                    description: Display name of the feature
                  description:
                    type: string
                    description: What the feature does
                  activated:
                    type: boolean
                    description: >-
                      Whether the customer has an active activation. Always
                      false without `customer_id`. For `virtual_cards` it does
                      not mean a card was issued.
        error:
          type: 'null'
    ActivateFeatureRequest:
      type: object
      required:
        - customer_id
        - feature_id
      properties:
        customer_id:
          type: string
          format: uuid
          description: ID of the customer
          example: 302dabcb-d4fd-4a00-a80b-afad70982614
        feature_id:
          $ref: '#/components/schemas/FeatureId'
        activated_by:
          type: string
          format: uuid
          description: Optional ID of the user who made the request. An invalid value is ignored.
        provider_data:
          type: object
          description: >-
            Data the feature needs. Only `virtual_cards` reads it today, and
            that feature requires it. Send numbers as JSON numbers.
          properties:
            annual_remuneration:
              type: number
              minimum: 1000
              description: Cardholder's yearly income. Required for `virtual_cards`.
              example: 12000
            estimated_monthly_limit:
              type: number
              minimum: 1
              description: >-
                Expected monthly card spend. Required for `virtual_cards`. When
                a card is issued during activation, it also becomes that card's
                daily limit.
              example: 200
            account_id:
              type: string
              format: uuid
              description: >-
                Always send it for `virtual_cards`. It is the ID of your
                business's card account (type `card`, status `active`). The same
                card account backs every cardholder. Leaving it out fails with
                `cards service: internal server error`.
              example: 5d9e677f-f071-4881-a861-7cdcebacd9d5
            funding:
              type: object
              description: How the card is funded
              properties:
                mode:
                  type: string
                  enum:
                    - shared
                    - own
                card_group_id:
                  type: string
                  format: uuid
                  description: Only with `mode` `shared`
            ip_address:
              type: string
              description: >-
                Gravv replaces it with the IP address of the calling server when
                one is present. You do not need to send it.
          additionalProperties: true
    ActivateFeatureResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: object
          required:
            - customer_id
            - feature_id
            - status
          properties:
            customer_id:
              type: string
              format: uuid
              example: 70235ccd-468b-42e1-80d8-950c998299be
            feature_id:
              $ref: '#/components/schemas/FeatureId'
            status:
              type: string
              description: >-
                `active` when activated. For `virtual_cards` this means the card
                application was submitted, not that a card was issued.
                `pending_liveness` when the cardholder must first complete a
                liveness check at `websdk_url`. Nothing is stored, so call again
                afterwards.
              enum:
                - active
                - pending_liveness
                - pending_service
              example: active
            activated_at:
              type: string
              description: Activation time in RFC 3339 format. Empty for `pending_liveness`.
              example: '2026-10-13T11:20:05Z'
            message:
              type: string
              description: Set when an activation already exists, and for `pending_liveness`
            websdk_url:
              type: string
              format: uri
              description: Liveness link for `pending_liveness`. It expires after 30 minutes.
        error:
          type: 'null'
          example: null
    FeatureEligibilityResponse:
      type: object
      required:
        - customer_id
        - eligible
        - feature_id
        - requirements_fulfilled
        - requirements_pending
      properties:
        customer_id:
          type: string
          example: 5793f1ea-91f0-4892-9705-d37e0592dd3a
        eligible:
          type: boolean
          description: >-
            True when nothing is pending. For `virtual_cards` it stays false
            until activation, because the pending `provider_data` items are the
            fields you send to activate.
          example: false
        feature_id:
          type: string
          example: virtual_cards
        requirements_fulfilled:
          type: array
          items:
            $ref: '#/components/schemas/RequirementFulfilled'
        requirements_pending:
          type: array
          items:
            $ref: '#/components/schemas/PendingRequirement'
    RequirementFulfilled:
      type: object
      properties:
        type:
          type: string
          enum:
            - kyc_status
            - provider_data
          example: kyc_status
        value:
          type: string
          example: completed
        fulfilled_at:
          type: string
          description: Time in RFC 3339 format for KYC. Empty for other types.
          example: '2026-10-13T10:01:02Z'
    PendingRequirement:
      type: object
      properties:
        type:
          type: string
          enum:
            - kyc_status
            - provider_data
            - document
          example: provider_data
        required:
          type: string
          description: What is needed
          example: annual_remuneration
        current:
          type: string
          description: The current KYC status, for `kyc_status`
        action:
          type: object
          description: >-
            How to meet the requirement. For `provider_data` it names the
            `data_key` to send in `provider_data` when you activate. For
            `kyc_status` it points to `v1/risk/start-kyc`.
          properties:
            type:
              type: string
              example: provider_data
            data_key:
              type: string
              example: annual_remuneration
            field_type:
              type: string
              example: number
            url:
              type: string
              example: v1/risk/start-kyc
            method:
              type: string
              example: POST
            description:
              type: string
              example: Initiate KYC verification process
    ErrorResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: 'null'
          description: Always null for error responses
          example: null
        error:
          type: string
          example: Failed to check feature eligibility
security:
  - ApiKeyAuth: []
tags:
  - name: Features
    description: >-
      List the features you can turn on for a customer, check what each one
      needs, and activate it
paths:
  /v1/risk/features:
    get:
      tags:
        - Features
      summary: List available features
      description: >-
        Returns the feature catalogue. With `customer_id`, `activated` shows
        which features are active for that customer. The order is not fixed.
        Every error on this route is HTTP 400.
      parameters:
        - in: query
          name: customer_id
          required: false
          schema:
            type: string
            format: uuid
          description: >-
            A customer in your tenant. An unknown customer is a 400
            `CUSTOMER_NOT_FOUND` error.
          example: 302dabcb-d4fd-4a00-a80b-afad70982614
        - name: country
          in: query
          required: false
          description: >-
            Country code. It has no effect today, because every feature is
            available in every country.
          schema:
            type: string
          example: NG
        - name: status
          in: query
          required: false
          description: >-
            Filter by activation. It needs `customer_id`. Without it, every
            feature is inactive. Other values act as `all`.
          schema:
            type: string
            enum:
              - active
              - inactive
              - all
            default: all
      responses:
        '200':
          description: The feature catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureListResponse'
              examples:
                AllFeatures:
                  summary: All features
                  value:
                    data:
                      features:
                        - feature_id: crypto_wallet
                          name: Wallet
                          description: Create and manage wallets
                          activated: false
                        - feature_id: eur_account
                          name: EUR Account
                          description: Create and manage EUR currency accounts
                          activated: false
                        - feature_id: gbp_account
                          name: GBP Account
                          description: Create and manage GBP currency accounts
                          activated: false
                        - feature_id: international_transfers
                          name: Payout
                          description: Send and receive international wire transfers
                          activated: false
                        - feature_id: usd_account
                          name: USD Account
                          description: Create and manage USD currency accounts
                          activated: false
                        - feature_id: virtual_cards
                          name: Cards
                          description: Issue and manage debit/credit cards
                          activated: false
                    error: null
                SpecificCustomer:
                  summary: One customer's features
                  value:
                    data:
                      customer_id: 302dabcb-d4fd-4a00-a80b-afad70982614
                      features:
                        - feature_id: virtual_cards
                          name: Cards
                          description: Issue and manage debit/credit cards
                          activated: true
                        - feature_id: crypto_wallet
                          name: Wallet
                          description: Create and manage wallets
                          activated: false
                    error: null
        '400':
          description: Invalid or unknown customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: >-
                  CUSTOMER_NOT_FOUND: Customer not found. Please verify the
                  customer exists in our system.
  /v1/risk/features/eligibility:
    post:
      tags:
        - Features
      summary: Check feature eligibility
      description: >-
        Lists the requirements a customer has met, and those still pending, for
        one feature. The call only reads data, but it is a POST and needs an
        Idempotency-Key. A repeated key returns the cached answer for 24 hours,
        so use a new key for each check. Every error is HTTP 400.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - feature_id
                - customer_id
              properties:
                feature_id:
                  $ref: '#/components/schemas/FeatureId'
                customer_id:
                  type: string
                  format: uuid
                  description: ID of the customer
                  example: 5793f1ea-91f0-4892-9705-d37e0592dd3a
      responses:
        '200':
          description: Requirements met and pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeatureEligibilityResponse'
                  error:
                    type: 'null'
              examples:
                eligible:
                  summary: Nothing pending
                  value:
                    data:
                      customer_id: 5793f1ea-91f0-4892-9705-d37e0592dd3a
                      eligible: true
                      feature_id: usd_account
                      requirements_fulfilled:
                        - type: kyc_status
                          value: completed
                          fulfilled_at: '2026-10-13T10:01:02Z'
                      requirements_pending: []
                    error: null
                not_eligible:
                  summary: Card fields still to send
                  value:
                    data:
                      customer_id: 5793f1ea-91f0-4892-9705-d37e0592dd3a
                      eligible: false
                      feature_id: virtual_cards
                      requirements_fulfilled:
                        - type: kyc_status
                          value: completed
                          fulfilled_at: '2026-10-13T10:01:02Z'
                      requirements_pending:
                        - type: provider_data
                          required: annual_remuneration
                          action:
                            type: provider_data
                            data_key: annual_remuneration
                        - type: provider_data
                          required: estimated_monthly_limit
                          action:
                            type: provider_data
                            data_key: estimated_monthly_limit
                    error: null
        '400':
          description: >-
            Invalid customer, or the check failed. An unknown `feature_id` and a
            customer with no KYC record both give the generic message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: Failed to check feature eligibility
  /v1/risk/features/activate:
    post:
      tags:
        - Features
      summary: Activate a feature
      description: >-
        Turns on a feature for a customer. For `virtual_cards` it creates a card
        application and, when the application is approved, issues a virtual
        card. Cards need completed KYC with a liveness check, a card-type
        account, and `provider_data` with `annual_remuneration` and
        `estimated_monthly_limit`. If the customer has no liveness check, the
        status is `pending_liveness`. Give the cardholder `websdk_url`, then
        call again.


        `crypto_wallet` and `international_transfers` become active at once. An
        activation that already exists is returned unchanged. Every error is
        HTTP 400.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateFeatureRequest'
            examples:
              ActivateVirtualCards:
                summary: Activate virtual cards
                value:
                  customer_id: 302dabcb-d4fd-4a00-a80b-afad70982614
                  feature_id: virtual_cards
                  provider_data:
                    annual_remuneration: 12000
                    estimated_monthly_limit: 200
                    account_id: 5d9e677f-f071-4881-a861-7cdcebacd9d5
              ActivateCryptoWallet:
                summary: Activate the wallet feature
                value:
                  customer_id: 302dabcb-d4fd-4a00-a80b-afad70982614
                  feature_id: crypto_wallet
      responses:
        '200':
          description: Activated, or a liveness check is needed first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateFeatureResponse'
              examples:
                SuccessfulActivation:
                  summary: Feature activated
                  value:
                    data:
                      customer_id: 302dabcb-d4fd-4a00-a80b-afad70982614
                      feature_id: virtual_cards
                      status: active
                      activated_at: '2026-10-13T11:20:05Z'
                    error: null
                LivenessCheckRequired:
                  summary: Liveness check required
                  value:
                    data:
                      customer_id: 302dabcb-d4fd-4a00-a80b-afad70982614
                      feature_id: virtual_cards
                      status: pending_liveness
                      activated_at: ''
                      message: >-
                        Liveness verification required. Please complete the
                        verification using the provided WebSDK URL.
                      websdk_url: https://verify.gravv.xyz/websdk/p/example_token
                    error: null
        '400':
          description: Any error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                KycNotCompleted:
                  summary: The customer's KYC is not completed
                  value:
                    data: null
                    error: >-
                      failed to check liveness requirement: customer KYC must be
                      completed before activating cards feature
                MinimumIncome:
                  summary: annual_remuneration is too low
                  value:
                    data: null
                    error: >-
                      cards service: annual_remuneration must be a number of at
                      least 1000
                NoCardAccount:
                  summary: No card account, or the card application failed
                  value:
                    data: null
                    error: 'cards service: internal server error'
