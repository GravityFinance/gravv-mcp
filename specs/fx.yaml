    get:
      tags:
        - Fx
      summary: List orders
      operationId: get_v1-fx-orders
      description: >
        Lists your OTC orders, most recent first. Filter with `status`,
        `order_type`, `side`, `search`, `start_date`, and `end_date`, and page
        with `page` and `items_per_page`.


        Filter values that match no orders (including unknown `status` values)
        don't error; they return a `200` with an empty `items` array.
      parameters:
        - name: status
          in: query
          required: false
          description: >-
            Filter by order status: `waiting_approval`, `pending`, `rejected`,
            `cancelled`, or `expired`.
          schema:
            type: string
          example: waiting_approval
        - name: order_type
          in: query
          required: false
          description: Filter by order type.
          schema:
            type: string
            enum:
              - market
              - limit
        - name: side
          in: query
          required: false
          description: Filter by order side.
          schema:
            type: string
            enum:
              - buy
              - sell
        - name: search
          in: query
          required: false
          description: Free-text search filter (for example, an order reference).
          schema:
            type: string
          example: OTC-0VA89I
        - name: start_date
          in: query
          required: false
          description: Only return orders created on or after this date (ISO 8601).
          schema:
            type: string
            format: date
          example: '2026-06-01'
        - name: end_date
          in: query
          required: false
          description: Only return orders created on or before this date (ISO 8601).
          schema:
            type: string
            format: date
          example: '2026-06-30'
        - name: page
          in: query
          required: false
          description: Page number to return.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: items_per_page
          in: query
          required: false
          description: Number of orders per page.
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxOrderListResponse'
              example:
                data:
                  items:
                    - id: 4994339f-4a19-47ef-a86b-1005eff0a4d0
                      order_id: OTC-0VA89I
                      order_type: market
                      side: sell
                      pair:
                        base: USD
                        quote: ZAR
                      amount: '1000.00000000'
                      amount_currency: USD
                      converted_amount: '16242.50000000'
                      converted_currency: ZAR
                      rate: '16.24250000'
                      target_rate: null
                      fee: null
                      status: waiting_approval
                      customer_id: 85034797-3ea1-4ad8-a952-becd67d74acc
                      tenant_id: dfa96ede-fc13-43cf-8328-8b910d1cd1d2
                      source_type: account
                      source_id: 74653c7b-ae84-45ab-8085-2d2493f86d81
                      destination_type: ssi
                      destination_id: b23ffd0e-d0fc-432e-acc9-c396194121b3
                      created_by_user_id: 804201c6-2760-4da1-9c5e-0ff09ebc3b5e
