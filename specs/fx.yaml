    post:
      tags:
        - Fx
      summary: Cancel order
      operationId: post_v1-fx-orders-order_id-cancel
      description: >
        Cancels an order that hasn't executed yet. Orders that are already in
        a final state, or in a state that doesn't allow cancellation, can't be
        cancelled.


        The `Idempotency-Key` header is required; requests without it are
        rejected.
