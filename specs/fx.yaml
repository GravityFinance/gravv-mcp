openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    This is the API Gateway for Gravv services.
    Use the `Api-Key` header for authentication.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        1 to 255 printable ASCII characters. A retry with the same key within 24
        hours returns the first response, including a 400. After you correct a
        request, send a new key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: usd-xaf-order-1042
    OrderIdPath:
      name: order_id
      in: path
      required: true
      description: The `order_id` returned when the order was created
      schema:
        type: string
        format: uuid
      example: 2d4f6a8c-1b3d-4e5f-8a7b-9c0d1e2f3a4b
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    ItemsPerPage:
      in: query
      name: items_per_page
      description: Page size. Values above 100 give 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    SupportedCurrencyPair:
      type: object
      properties:
        currency_pair:
          type: string
          description: Pair key `FROM_CC_TO_CC`, with `XX` as the country of a crypto asset
          example: USD_US_NGN_NG
        pair_type:
          type: string
          enum:
            - fiat
            - crypto
        from_currency:
          type: string
          example: USD
        from_currency_name:
          type: string
          example: US Dollar
        to_currency:
          type: string
          example: NGN
        to_currency_name:
          type: string
          example: NGN
    CurrencyPairRate:
      type: object
      properties:
        rate:
          type: string
          description: Units of the TO currency for 1 unit of the FROM currency
          example: '1368.27'
        direction:
          type: string
          description: '`FROM_TO`'
          example: USD_NGN
        currency_pair:
          type: string
          description: >-
            Pair key `FROM_CC_TO_CC`. One direction can have several rows, one
            for each country pair.
          example: USD_US_NGN_NG
        pair_type:
          type: string
          enum:
            - fiat
            - crypto
        from_currency:
          type: string
          example: USD
        from_currency_name:
          type: string
          example: US Dollar
        to_currency:
          type: string
          example: NGN
        to_currency_name:
          type: string
          example: NGN
        timestamp:
          type: string
          format: date-time
          description: When the rate was last updated. Check it, as a row can be old.
    FxQuoteRequest:
      type: object
      required:
        - amount
      description: Send `currency_pair` or `direction`. Unknown fields are ignored.
      properties:
        currency_pair:
          type: string
          description: >-
            `FROM_TO`: the currency you sell, then the currency you buy, such as
            `USD_XAF`. The four-part form `USD_US_XAF_CM` is also accepted; its
            countries do not change the price. It wins over `direction`.
          example: USD_XAF
        direction:
          type: string
          description: The same `FROM_TO` form as `currency_pair`. It is not BUY or SELL.
          example: USD_XAF
        amount:
          type: string
          description: >-
            Amount you sell, in major units of the FROM currency, as a string. A
            JSON number is rejected.
          example: '10000'
    FxQuote:
      type: object
      properties:
        quote_id:
          type: string
          description: Use it once, with `POST /v1/fx/orders`, before `expires_at`
          example: GRVOTC_3F9A1C
        from_currency:
          type: string
          example: USD
        to_currency:
          type: string
          example: XAF
        from_amount:
          type: string
          description: The amount you sell
          example: '10000'
        to_amount:
          type: string
          description: The amount you buy, which is `from_amount` times `rate`, not rounded
          example: '6052500'
        rate:
          type: string
          description: Units of the TO currency for 1 unit of the FROM currency
          example: '605.25'
        expires_at:
          type: string
          format: date-time
          description: When the quote expires, 5 minutes after it is made
          example: '2026-10-12T09:25:00Z'
    OrderLeg:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: >-
            `internal_account` or `internal_crypto_wallet`. For a destination,
            `external_account` means a settlement instruction, not a customer's
            external account.
          enum:
            - internal_account
            - internal_crypto_wallet
            - external_account
        id:
          type: string
          description: ID of your account, crypto wallet or settlement instruction
    CreateFxOrderRequest:
      type: object
      required:
        - quote_id
      description: >-
        The amounts come from the quote. Unknown fields are ignored; there is no
        `amount`, `pair`, `order_type` or `customer_id`.
      properties:
        quote_id:
          type: string
          description: A quote from `POST /v1/fx/quote` that has not expired or been used
          example: GRVOTC_3F9A1C
        source:
          description: >-
            Where the sold amount comes from: your account or crypto wallet
            holding at least `from_amount` in the FROM currency. It cannot be
            `external_account`.
          allOf:
            - $ref: '#/components/schemas/OrderLeg'
        destination:
          description: >-
            Where the bought amount goes: your account or crypto wallet, or an
            active settlement instruction (`external_account`) in the TO currency.
          allOf:
            - $ref: '#/components/schemas/OrderLeg'
        transaction_id:
          type: string
          format: uuid
          description: Optional ID to give the order. It becomes `order_id`.
        client_reference:
          type: string
          description: Your reference. It does not have to be unique.
          example: inv-2026-1042
        metadata:
          type: object
          description: Your data, returned on the order
          additionalProperties: true
    OrderStatus:
      type: string
      description: >-
        An order made with an API key starts as `pending` and its source is
        debited at once. It then becomes `completed`, or `cancelled` if the
        debit fails. `waiting_approval` is for orders made in the dashboard.
      enum:
        - waiting_approval
        - pending
        - completed
        - rejected
        - cancelled
      example: pending
    FxOrder:
      type: object
      description: An order. Empty fields are left out.
      properties:
        id:
          type: string
          format: uuid
          example: 2d4f6a8c-1b3d-4e5f-8a7b-9c0d1e2f3a4b
        quote_id:
          type: string
          example: GRVOTC_3F9A1C
        status:
          $ref: '#/components/schemas/OrderStatus'
        from_currency:
          type: string
          example: USD
        to_currency:
          type: string
          example: XAF
        pair_code:
          type: string
        rate:
          type: string
          example: '605.25'
        source_amount:
          type: string
          description: The amount sold
          example: '10000'
        destination_amount:
          type: string
          description: The amount bought
          example: '6052500'
        source_type:
          type: string
          enum:
            - internal_account
            - internal_crypto_wallet
        source_id:
          type: string
        destination_type:
          type: string
          enum:
            - internal_account
            - internal_crypto_wallet
            - external_account
        destination_id:
          type: string
        order_type:
          type: string
          enum:
            - market
        quote_source:
          type: string
          description: Which rate table priced the order
        trade_desk_request_id:
          type: string
          description: Only on orders made through the trade desk
        client_reference:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    FxOrderPage:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FxOrder'
            items_per_page:
              type: integer
            page:
              type: integer
            total_items:
              type: integer
            total_pages:
              type: integer
        error:
          type: 'null'
    ErrorResponse:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: string
          description: What went wrong. FX errors carry no code.
  responses:
    BadRequest:
      description: >-
        The request failed. Every FX error is a 400, including not-found and
        outages; read `error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            error: order not found
security:
  - ApiKeyAuth: []
tags:
  - name: FX
    description: Exchange rates, quotes and OTC orders
paths:
  /v1/fx/supported-currencies:
    get:
      tags:
        - FX
      summary: List supported currency pairs
      operationId: listFxCurrencyPairs
      description: >-
        Lists every currency pair FX knows. A listed pair is not always
        enabled for you; `POST /v1/fx/quote` tells you. This route reads no
        query parameters.
      responses:
        '200':
          description: The pairs, in one list with no paging
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportedCurrencyPair'
                  error:
                    type: 'null'
              example:
                data:
                  - currency_pair: USD_US_NGN_NG
                    pair_type: fiat
                    from_currency: USD
                    from_currency_name: US Dollar
                    to_currency: NGN
                    to_currency_name: NGN
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/fx/rates:
    get:
      tags:
        - FX
      summary: List exchange rates
      operationId: listFxRates
      description: >-
        Returns indicative rates for display, sorted by pair. You cannot trade
        at these rates; call `POST /v1/fx/quote` for a firm price. Filters are
        not case-sensitive. When rates are not loaded yet, the error is
        `fx cache is not ready`; retry.
      parameters:
        - in: query
          name: currency_type
          schema:
            type: string
            enum:
              - fiat
              - crypto
        - in: query
          name: from_currency
          schema:
            type: string
          example: USD
        - in: query
          name: to_currency
          schema:
            type: string
          example: NGN
        - in: query
          name: directions
          schema:
            type: string
          description: Comma-separated `FROM_TO` values, such as `USD_NGN,USD_EUR`
        - in: query
          name: currency_pairs
          schema:
            type: string
          description: Comma-separated four-part pair keys, such as `USD_US_EUR_FR`
      responses:
        '200':
          description: The rates, in one list with no paging
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CurrencyPairRate'
                  error:
                    type: 'null'
              example:
                data:
                  - currency_pair: USD_US_NGN_NG
                    direction: USD_NGN
                    from_currency: USD
                    from_currency_name: US Dollar
                    pair_type: fiat
                    rate: '1368.27'
                    timestamp: '2026-10-13T22:20:08.941956Z'
                    to_currency: NGN
                    to_currency_name: NGN
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/fx/quote:
    post:
      tags:
        - FX
      summary: Get a quote
      operationId: getFxQuote
      description: >-
        Returns a firm price to sell an amount of one currency for another. The
        quote lasts 5 minutes and can be used once, only by
        `POST /v1/fx/orders`. It does not set the rate of a transfer. A pair
        that is not enabled for you returns `quote currency pair is not
        supported`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxQuoteRequest'
            example:
              currency_pair: USD_XAF
              amount: '10000'
      responses:
        '200':
          description: The quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FxQuote'
                  error:
                    type: 'null'
              example:
                data:
                  quote_id: GRVOTC_3F9A1C
                  from_currency: USD
                  to_currency: XAF
                  to_amount: '6052500'
                  from_amount: '10000'
                  rate: '605.25'
                  expires_at: '2026-10-12T09:25:00Z'
                error: null
        '400':
          description: The pair is not enabled for you, or the amount is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Pair:
                  summary: The pair cannot be quoted
                  value:
                    data: null
                    error: quote currency pair is not supported
                Amount:
                  summary: The amount is missing or not positive
                  value:
                    data: null
                    error: quote amount must be a positive number
  /v1/fx/orders:
    post:
      tags:
        - FX
      summary: Create an order
      operationId: createFxOrder
      description: >-
        Trades a quote. With an API key there is no approval step: the order
        starts as `pending` and the source is debited at once. Then get the
        order until it is `completed` or `cancelled`. FX orders send no
        webhooks.


        If the error is `order source could not be charged`, an order may still
        exist; list your orders before you retry with a new quote.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFxOrderRequest'
            example:
              quote_id: GRVOTC_3F9A1C
              source:
                type: internal_account
                id: 4b3a2c1d-0e9f-4a8b-9c7d-6e5f4a3b2c1d
              destination:
                type: external_account
                id: b7e1c2d3-4f5a-4b6c-9d8e-7f6a5b4c3d2e
              client_reference: inv-2026-1042
              metadata:
                desk: treasury
      responses:
        '200':
          description: The order is created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      order_id:
                        type: string
                        format: uuid
                      quote_id:
                        type: string
                      status:
                        $ref: '#/components/schemas/OrderStatus'
                  error:
                    type: 'null'
              example:
                data:
                  order_id: 2d4f6a8c-1b3d-4e5f-8a7b-9c0d1e2f3a4b
                  quote_id: GRVOTC_3F9A1C
                  status: pending
                error: null
        '400':
          description: >-
            The quote is expired or used, a leg is invalid, the source balance is
            too low, or the debit failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Quote:
                  summary: Get a new quote
                  value:
                    data: null
                    error: quote is invalid or expired
                Balance:
                  summary: The source holds too little
                  value:
                    data: null
                    error: 'bad source: [400] source balance is not enough for currency: USD, amount: 10000'
                Destination:
                  summary: The settlement instruction is not active or not in the TO currency
                  value:
                    data: null
                    error: 'bad destination: [400] invalid order destination'
        '403':
          description: >-
            The key lacks `fx:order_create`, or your business does not have
            access to the OTC trade desk
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                  error:
                    type: object
                    additionalProperties: true
    get:
      tags:
        - FX
      summary: List orders
      operationId: listFxOrders
      description: Lists your orders, newest first. `status` is the only filter.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxOrderPage'
              example:
                data:
                  items:
                    - id: 2d4f6a8c-1b3d-4e5f-8a7b-9c0d1e2f3a4b
                      quote_id: GRVOTC_3F9A1C
                      status: pending
                      from_currency: USD
                      to_currency: XAF
                      rate: '605.25'
                      source_amount: '10000'
                      destination_amount: '6052500'
                      source_type: internal_account
                      source_id: 4b3a2c1d-0e9f-4a8b-9c7d-6e5f4a3b2c1d
                      destination_type: external_account
                      destination_id: b7e1c2d3-4f5a-4b6c-9d8e-7f6a5b4c3d2e
                      order_type: market
                      client_reference: inv-2026-1042
                      metadata:
                        desk: treasury
                      created_at: '2026-10-12T09:21:04Z'
                  items_per_page: 20
                  page: 1
                  total_items: 1
                  total_pages: 1
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/fx/orders/pending-approvals:
    get:
      tags:
        - FX
      summary: List orders waiting for approval
      operationId: listFxPendingApprovals
      description: >-
        Lists orders in `waiting_approval`, newest first. Only orders made in
        the dashboard wait for approval, so orders made with an API key never
        appear here. A scoped key needs `fx:order_approve`. Approving and
        rejecting are done in the dashboard.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
      responses:
        '200':
          description: A page of orders waiting for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxOrderPage'
              example:
                data:
                  items: []
                  items_per_page: 20
                  page: 1
                  total_items: 0
                  total_pages: 0
                error: null
        '400':
          description: The key may not approve orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: caller is not permitted to approve or reject orders
  /v1/fx/orders/{order_id}:
    get:
      tags:
        - FX
      summary: Get an order
      operationId: getFxOrder
      description: >-
        Returns one order. `pending` covers both a debit in progress and a
        debit that landed and is waiting to settle. Not-found is a 400.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FxOrder'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/fx/orders/{order_id}/cancel:
    post:
      tags:
        - FX
      summary: Cancel an order
      operationId: cancelFxOrder
      description: >-
        Cancels a `waiting_approval` or `pending` order whose debit is not in
        progress. Cancelling does not return money that was already debited;
        contact support for that. The request has no body.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The order is cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - cancelled
                  error:
                    type: 'null'
              example:
                data:
                  id: 2d4f6a8c-1b3d-4e5f-8a7b-9c0d1e2f3a4b
                  status: cancelled
                error: null
        '400':
          description: The order is not found, already final, or its debit is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'order cannot be cancelled in status: completed'
