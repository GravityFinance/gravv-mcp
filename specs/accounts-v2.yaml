              example:
                data:
                  account_id: 6f1c2a9e-3b1d-4f7a-9c62-0d8e4b7a5c11
                  status: pending
                error: null
        '400':
          description: >-
            Invalid request, a customer that does not exist or has not completed
            KYC, or no bank fits the request. The machine code is in
            `details.<field>`, such as `ACCOUNT_TYPE_RESERVED_FOR_TENANT` on
            `account_type` (`card` or `default` for a customer other than your
            business), `DEFAULT_REQUIRES_MAIN_CATEGORY` on `category`, or, with
            `bank_code`, `UNKNOWN_BANK`, `BANK_NOT_AVAILABLE`,
            `ACCOUNT_TYPE_NOT_SUPPORTED`, `CURRENCY_NOT_SUPPORTED`,
            `CATEGORY_NOT_SUPPORTED`, `CUSTOMER_TYPE_NOT_SUPPORTED`,
            `COUNTRY_NOT_SERVED` or `SUBDIVISION_NOT_SERVED`. Without
            `bank_code`, the same problems return `UNSUPPORTED_COMBINATION`.
            A savings account returns `SAVINGS_CURRENCY_NOT_SUPPORTED` on
            `currency` (not USD), `SAVINGS_ACCOUNT_TYPE_NOT_SUPPORTED` on
            `account_type` (not `regular`), `SAVINGS_NETWORK_NOT_SUPPORTED` on
            `network` (not `avalanche_c_chain`) or `SAVINGS_WALLET_NOT_ACCEPTED`
            on `wallet_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                KycIncomplete:
                  summary: The customer has not completed KYC
                  value:
                    data: null
                    error: >-
                      the customer for the customer_id supplied has not completed
                      KYC; complete the customer's KYC before opening an account
                      for them
                    details:
                      customer_id: >-
                        CUSTOMER_KYC_INCOMPLETE: the customer for the customer_id
                        supplied has not completed KYC; complete the customer's
                        KYC before opening an account for them
                MissingFields:
                  summary: The form is missing fields
                  value:
                    data: null
                    error: Date of Birth is required (and 1 other field; see details)
                    details:
                      date_of_birth: 'required: is required'
                      permanent_address.city: 'required: is required'
                NetworkRequired:
                  summary: The bank offers token wallets and you sent no network
                  value:
                    data: null
                    error: network is required for account options that support wallet integration
        '409':
          description: >-
            The customer is at the account limit, the bank is disabled for this
            account, an application is already in progress at this bank, or a
            request with the same Idempotency-Key is still running. Also
            `CARD_ACCOUNT_ALREADY_EXISTS` (a second card account for the
            customer), `DEFAULT_ACCOUNT_ALREADY_EXISTS` (a second default
            account for your business), `MAIN_ACCOUNT_ALREADY_EXISTS` (a second
            main default account), `WALLET_ALREADY_ASSIGNED` (the wallet
            already backs another account) and `SAVINGS_ACCOUNT_ALREADY_EXISTS`
            (a second savings account for the customer).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/IdempotencyErrorResponse'
              example:
                data: null
                error: >-
                  this customer already holds the maximum number of USD accounts
                  permitted for this account type (5)
        '422':
          description: You used the Idempotency-Key before with a different body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyErrorResponse'
        '503':
          description: Gravv could not read the customer record. Retry with the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Accounts v2
      summary: List accounts
      operationId: listAccountsV2
      description: >-
        Lists all your accounts, newest first, with bank details and
        balances. Only the single-account read returns status reasons. The API
        rejects unknown query parameters with a 400. A bad filter value is an error, not
        an empty page.
      parameters:
        - in: query
          name: customer_id
          schema:
            type: string
          description: Filter by customer
        - in: query
          name: excluded_customer_id
          schema:
            type: string
          description: Leave out this customer's accounts
        - in: query
          name: status
          schema:
            type: string
            enum:
              - pending
              - active
              - frozen
              - closed
              - rejected
              - failed
              - deleted
              - manual_review
        - in: query
          name: category
          description: >-
            Filter by category. `virtual` and `multi_currency` find older
            accounts only.
          schema:
            $ref: '#/components/schemas/AccountCategory'
        - in: query
          name: currency
          schema:
            type: string
          description: Three-letter ISO 4217 code
        - in: query
          name: network
          schema:
            $ref: '#/components/schemas/Network'
        - in: query
          name: bank_code
          schema:
            type: string
        - in: query
          name: label
          schema:
            type: string
          description: Exact label. Use `search` for part of a label.
        - in: query
          name: type
          schema:
            type: string
          description: Account type, such as `operating`
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive search across label, currency, status, type and wallet address
        - in: query
          name: created_from
          schema:
            type: string
          description: Created at or after, as RFC 3339 or YYYY-MM-DD (inclusive)
          example: '2026-10-01'
        - in: query
          name: created_to
          schema:
            type: string
          description: Created before, as RFC 3339 or YYYY-MM-DD (exclusive)
          example: '2026-11-01'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: >-
            Page size, 1 to 200. A `limit` that is not a whole number returns
            400. A whole number outside 1 to 200 becomes 50.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccountV2'
                      page:
                        type: integer
                      items_per_page:
                        type: integer
                        description: The page size used
                      total_pages:
                        type: integer
                      total_items:
                        type: integer
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v2/accounts/requirements:
    get:
      tags:
        - Accounts v2
      summary: Get account requirements
      operationId: getAccountRequirements
      description: >-
        Returns the form that create checks for one bank, currency and
        customer type: fields, documents, party rules and token networks. Send
        `customer_id` to see the values already on file, and `country` so that
        this call chooses the same bank as create.


        A field is needed only when `required` is true and its `applies_when`
        and `required_when` conditions hold. When `has_existing_ref` is true,
        send no `data.root` on create. When `existing_application` is present,
        finish that application instead.
      parameters:
        - in: query
          name: customer_type
          required: true
          schema:
            type: string
            enum:
              - individual
              - business
        - in: query
          name: currency
          required: true
          schema:
            type: string
          description: Three-letter ISO 4217 code
          example: USD
        - in: query
          name: bank_code
          schema:
            type: string
          description: A `bank_code` from the capabilities
          example: cross_river_bank
        - in: query
          name: account_type
          schema:
            type: string
          example: operating
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/Category'
        - in: query
          name: country
          schema:
            type: string
          description: The customer's citizenship or incorporation country, alpha-2 or alpha-3
          example: GB
        - in: query
          name: subdivision
          schema:
            type: string
          description: ISO 3166-2 code or a bare state code. Needs `country`.
        - in: query
          name: customer_id
          schema:
            type: string
            format: uuid
          description: Customer to fill the form for
      responses:
        '200':
          description: The form for this bank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
              example:
                data:
                  min_parties: null
                  max_parties: null
                  fields:
                    - name: first_name
                      type: string
                      scope: root
                      group: identity
                      required: true
                      write_only: false
                      label: First Name
                      is_predefined: true
                    - name: tax_id_number
                      type: string
                      scope: root
                      group: us_tax
                      required: true
                      applies_when:
                        field: citizenship_country
                        op: eq
                        value: US
                      write_only: true
                      label: Tax ID Number
                      is_predefined: false
                  documents:
                    - types:
                        - national_id
                        - passport
                        - drivers_license
                      scope: root
                      required: true
                      new_document_fields:
                        - document_type
                        - content
                        - issuing_country
                        - number
                        - issued_date
                        - expiration_date
                  token_options:
                    - network: polygon
                      asset: usdc
                  has_existing_ref: false
                error: null
        '400':
          description: >-
            Missing parameters, or no bank fits the request
            (`UNSUPPORTED_COMBINATION`). A `bank_code` that does not exist
            returns `UNKNOWN_BANK`. `category` accepts only `main`,
            `sub_account` and `savings`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: Customer Type is required (and 1 other field; see details)
                details:
                  currency: 'REQUIRED: Currency is required'
                  customer_type: 'REQUIRED: Customer Type is required'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/accounts/applications:
    get:
      tags:
        - Accounts v2
      summary: List account applications
      operationId: listAccountApplicationsV2
      description: >-
        Lists your account applications, newest first, without status reasons.
        `count` is the number on this page, not a total. Page until `count` is
        less than `limit`. A misspelled `status` returns an empty list.
      parameters:
        - in: query
          name: customer_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      applications:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApplicationV2'
                      count:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v2/accounts/applications/{application_id}:
    get:
      tags:
        - Accounts v2
      summary: Get an account application
      operationId: getAccountApplicationV2
      description: >-
        Returns one application with what it waits for. Act on `status_reason`.
        Upload `required_documents` or send `required_fields` with the update,
        or send the customer to `required_action_url` for terms or verification.
        Use `status`, not the deprecated `provisioning` object.
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApplicationV2'
                  error:
                    type: 'null'
              example:
                data:
                  application_id: 5e7a9c1b-2d4f-4a6b-8c0d-e1f2a3b4c5d6
                  customer_id: 0b6f3c1e-2a4d-4c8e-9f10-7d2a6b5e4c33
                  customer_type: individual
                  registration_type: individual
                  status: blocked
                  parties:
                    - role: primary
                      status: declared
                      first_name: Jane
                      last_name: Doe
                  created_at: '2026-10-13T09:12:44.512031Z'
                  updated_at: '2026-10-13T09:20:02.118734Z'
                  status_reason: awaiting_customer_data
                  required_fields:
                    - tax_id_number
                  requires_user_action: true
                error: null
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Accounts v2
      summary: Update an account application
      operationId: updateAccountApplicationV2
      description: >-
        Sends the data or documents the bank asked for, and resumes opening the
        account. Get the application first. It must be `blocked`, or
        `manual_review` for documents. Send every requested item in one call.
        After a partial answer, the application stays `blocked`.


        This route takes no Idempotency-Key, so a retry uploads again. The
        response leaves out the status reason fields. Get the application again
        to see what is still needed. For terms or verification, send the
        customer to `required_action_url` instead.
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationV2Request'
            example:
              customer:
                tax_id_number: '123456789'
              documents:
                - document_type: proof_of_address
                  issuing_country: US
                  filename: bill.pdf
                  content: <base64>
      responses:
        '200':
          description: The updated application
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApplicationV2'
                  error:
                    type: 'null'
              example:
                data:
                  application_id: 5e7a9c1b-2d4f-4a6b-8c0d-e1f2a3b4c5d6
                  customer_id: 0b6f3c1e-2a4d-4c8e-9f10-7d2a6b5e4c33
                  customer_type: individual
                  registration_type: individual
                  status: processing
                  created_at: '2026-10-13T09:12:44.512031Z'
                  updated_at: '2026-10-13T10:02:31.004112Z'
                  validation:
                    ok: true
                error: null
        '400':
          description: The application cannot take this update, or a field or document is wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotEditable:
                  summary: The application is not waiting for an update
                  value:
                    data: null
                    error: application is not editable
                NotRequested:
                  summary: The bank did not ask for this field
                  value:
                    data: null
                    error: Tax ID Number was not requested for this application
                    details:
                      tax_id_number: >-
                        INVALID_VALUE: Tax ID Number was not requested for this
                        application
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/accounts/{id}:
    get:
      tags:
        - Accounts v2
      summary: Get an account
      operationId: getAccountV2
      description: >-
        Returns one account with bank details, balances and, when it is not
        `active`, the reason. Poll it after create until `status` is `active`.
        When `requires_user_action` is true, act on `status_reason` with
        `application_id`. `balance` and `balance_details` are in major units.
        `ledger_balance` is in minor units.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountV2'
                  error:
                    type: 'null'
              example:
                data:
                  id: 6f1c2a9e-3b1d-4f7a-9c62-0d8e4b7a5c11
                  label: Jane USD
                  date_created: '2026-10-13T09:12:44Z'
                  wallet_address: '0x5a3e9b0c7d2f41e8a6b4c3d2e1f0a9b8c7d6e5f4'
                  blockchain_network: polygon
                  type: operating
                  customer_id: 0b6f3c1e-2a4d-4c8e-9f10-7d2a6b5e4c33
                  currency: USD
                  status: pending
                  status_reason: awaiting_customer_document
                  required_documents:
                    - proof_of_address
                  requires_user_action: true
                  category: sub_account
                  bank_name: Example Bank
                  bank_code: cross_river_bank
                  settlement_enabled: false
                  application_id: 5e7a9c1b-2d4f-4a6b-8c0d-e1f2a3b4c5d6
                error: null
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/accounts/simulate/deposit:
    post:
      tags:
        - Sandbox
      summary: Simulate a deposit
      operationId: simulateDeposit
      description: >-
        Sandbox only. A live key gets a 403. Sends a test bank deposit to an
        account through the normal deposit flow, with fees, ledger entries and
        webhooks. The account must be `active` with bank details.


        A 200 means Gravv accepted the deposit, not that it settled. Wait for the
        `transfer.inflow.completed` or `transfer.inflow.deposit_settled`
        webhook. Each new Idempotency-Key makes a new deposit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateDepositRequest'
            example:
              account_id: 6f1c2a9e-3b1d-4f7a-9c62-0d8e4b7a5c11
              amount: '250.00'
              rail: wire
      responses:
        '200':
          description: Deposit accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                      reference:
                        type: string
                        description: Reference of the test deposit
                      state:
                        type: string
                        enum:
                          - pending
                          - processing
                          - blocked
                          - completed
                          - failed
                          - compensated
                  error:
                    type: 'null'
              example:
                data:
                  accepted: true
                  reference: d3b07384-d9a0-4c8f-9e2b-6f1a2c3d4e5f
                  state: pending
                error: null
        '400':
          description: Invalid amount or rail, or the account cannot take a test deposit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: account has no linked virtual account to deposit into
        '403':
          description: Not a sandbox key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'Forbidden: insufficient permissions to perform this action'
        '404':
          $ref: '#/components/responses/NotFound'
