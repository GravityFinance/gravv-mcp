                    annual_deposit_range:
                      type: string
                      description: Person, on the EUR and USD option
                      enum:
                        - less_than_5k
                        - from_5k_to_50k
                        - from_50k_to_150k
                        - more_than_150k
                    transaction_frequency:
                      type: string
                      description: Person, on the EUR and USD option
                      enum:
                        - once_per_year
                        - once_every_few_months
                        - a_few_times_per_month
                        - once_per_week
                        - more_than_once_per_week
                    legal_name:
                      type: string
                      description: Business, both forms
                      example: Acme Exports Ltd
                    dba_name:
                      type: string
                      description: >-
                        Business. Trading name, required on the USD, EUR and GBP
                        option.
                    business_type:
                      type: string
                      description: Business, on the USD, EUR and GBP option
                    business_description:
                      type: string
                      description: Business, on the USD, EUR and GBP option
                    registration_number:
                      type: string
                      description: Business, on the EUR and USD option
                    industry:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`.
                    incorporation_country:
                      type: string
                      description: >-
                        Business, both forms. Alpha-2 code. Gravv routes a
                        business by it.
                      example: GB
                    incorporation_date:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. YYYY-MM-DD.
                    website:
                      type: string
                      description: >-
                        Business. Required on the EUR and USD option, starting
                        with `http://` or `https://`.
                    business_address:
                      description: >-
                        Business address, both forms. Send `state`, except on
                        the USD, EUR and GBP option, which needs it only for an
                        address in the US.
                      allOf:
                        - $ref: '#/components/schemas/AccountAddress'
                    source_of_funds:
                      type: string
                      description: Business, on the EUR and USD option
                      enum:
                        - revenue
                        - trading_income
                        - investments
                        - loans_credits
                        - crypto_mining
                        - client_funds
                    legal_entity_type:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `limited_liability_company`.
                    business_tax_id:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. Write-only. The
                        company's tax ID.
                    business_ownership_type:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `private`.
                    estimated_monthly_turnover:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `up_to_50k`.
                    estimated_transaction_value:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `up_to_15k`.
                    monthly_transaction_frequency:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `up_to_20`.
                parties:
                  type: array
                  description: >-
                    Business only. The API refuses it for individuals. Declare 1
                    to 10 people. Each entry is an associated person from the
                    customer record (`id` plus any changes) or a new person with
                    the new-party fields. Leave it out to declare every
                    associated person on the record. Both forms ask for names,
                    `date_of_birth`, `email`, `phone_daytime`, `has_ownership`,
                    `has_control` and `is_signer`, and `ownership_percentage`
                    for an owner. The USD, EUR and GBP option adds
                    `citizenship_country` and `is_director`, and needs
                    `ownership_percentage` from 1 to 100, and at least 25 for a
                    person with control. The EUR and USD option adds
                    `tax_residence_country` and `residential_address`.
