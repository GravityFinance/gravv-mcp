openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    Open bank accounts at a chosen bank, read them with balances and status reasons, and send what the bank asks for.
    Send your API key in the `Api-Key` header to authenticate.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required for POST requests. The key is 1 to 255 printable ASCII
        characters. A retry with the same key within 24 hours returns the first response, so
        reuse the key when you retry the same request.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: open-usd-account-jane-1
    AccountIdPath:
      name: id
      in: path
      required: true
      description: ID of the account
      schema:
        type: string
        format: uuid
      example: 6f1c2a9e-3b1d-4f7a-9c62-0d8e4b7a5c11
    ApplicationIdPath:
      name: application_id
      in: path
      required: true
      description: >-
        ID of the account application. Read it from the account
        (`application_id`) or from the application webhooks.
      schema:
        type: string
        format: uuid
      example: 5e7a9c1b-2d4f-4a6b-8c0d-e1f2a3b4c5d6
  schemas:
    Network:
      type: string
      description: >-
        Blockchain network, in lower case. Gravv supports stellar, polygon,
        ethereum, avalanche_c_chain and solana.
      enum:
        - stellar
        - polygon
        - ethereum
        - avalanche_c_chain
        - solana
      example: polygon
    Category:
      type: string
      description: >-
        `main` is your business's own account. `sub_account` is an account for
        one of your customers. These are the only two categories you can open.
      enum:
        - main
        - sub_account
      example: sub_account
    AccountCategory:
      type: string
      description: >-
        `main`, `sub_account` or `savings`. Older accounts can also show
        `virtual` or `multi_currency`. You cannot open an account in those two.
      enum:
        - main
        - sub_account
        - savings
        - virtual
        - multi_currency
      example: sub_account
    ErrorResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: 'null'
          example: null
        error:
          type: string
          description: >-
            Error message. When several fields fail, it names the first and
            says how many others are in `details`. Branch on the HTTP status
            and the `details` codes, not on this text.
          example: Customer ID is required
        details:
          type: object
          description: >-
            Field problems, keyed by field path. Each value is `CODE: message`,
            such as `REQUIRED: Customer ID is required`. The API joins several
            problems on one field with `; `.
          additionalProperties:
            type: string
    IdempotencyErrorResponse:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - idempotency_in_flight
                - idempotency_key_reused
            message:
              type: string
    DocumentUpload:
      type: object
      description: >-
        A document. Send `id` to reuse a document already on file, or
        `content` to upload a new one, never both.
      properties:
        id:
          type: string
          description: ID of a document already on file
        document_type:
          type: string
          description: Type of a new document. Required with `content`.
          enum:
            - national_id
            - passport
            - drivers_license
            - permanent_resident_card
            - employment_authorization
            - other
            - proof_of_address
            - selfie_photo
            - tax_form_w8ben
            - signed_terms_document
            - articles_of_incorporation
            - ownership_document
            - control_structure
            - compliance_document
            - tax_id_letter
            - bank_statement
            - source_of_funds
            - denial_explanation_letter
            - regulatory_action_explanation
          example: passport
        document_type_side:
          type: string
          description: Which side, for identity documents sent one side at a time
          enum:
            - front
            - back
          default: front
        document_subtype:
          type: string
          description: Optional subtype
        content:
          type: string
          description: >-
            The file as standard or URL-safe base64. JPEG, PNG or PDF, at most
            2 MB decoded.
          example: <base64>
        filename:
          type: string
          example: passport.jpg
        issuing_country:
          type: string
          description: Issuing country as an alpha-2 code. Required for every type except `selfie_photo`.
          example: GB
        number:
          type: string
          description: Document number. Required for identity documents.
          example: '123456789'
        issued_date:
          type: string
          description: Issue date as YYYY-MM-DD. Required for identity documents.
          example: '2020-01-15'
        expiration_date:
          type: string
          description: Expiry date as YYYY-MM-DD. Required for identity documents.
          example: '2030-01-14'
    AccountAddress:
      type: object
      description: A street address. The API refuses a P.O. Box.
      properties:
        address_line:
          type: string
          description: Street address
          example: 1 High St
        city:
          type: string
          example: London
        state:
          type: string
          description: >-
            State or region as an ISO 3166-2 code, such as `GB-LND` or `US-CA`
          example: GB-LND
        postal_code:
          type: string
          example: EC1A 1BB
        country:
          type: string
          description: Country as an alpha-2 code
          example: GB
    CreateAccountParty:
      type: object
      description: >-
        A person declared on a business account: an associated person on the
        customer record by `id`, with any changes, or a new person with the
        new-party fields.
      additionalProperties: true
      properties:
        id:
          type: string
          description: ID of an associated person on the customer record
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentUpload'
    CreateAccountV2Request:
      description: >-
        Choose the tab for the kind of account. Each kind takes different
        top-level fields and a different form in `data`.
      oneOf:
        - title: Wallet-backed USD account
          description: >-
            A USD account with US bank details whose deposits arrive as USDC in
            the account's own wallet. Choose an option whose `token_wallets` is
            not empty, then send `network` or `wallet_id`.
          type: object
          required:
            - customer_id
            - currency
          anyOf:
            - required:
                - network
            - required:
                - wallet_id
          additionalProperties: false
          properties:
            customer_id:
              type: string
              description: >-
                An existing customer whose KYC is completed. The API checks it
                before every other field.
              format: uuid
              example: 0b6f3c1e-2a4d-4c8e-9f10-7d2a6b5e4c33
            customer_type:
              type: string
              description: >-
                `individual` or `business`. Always send it, because bank choice
                and routing use the value you send. Defaults to the customer's
                profile type.
              enum:
                - individual
                - business
              example: individual
            account_type:
              type: string
              description: >-
                Account type from the option's `account_types`: `operating`,
                `regular`, `card` or `default`. Defaults to `operating`. Only
                your business's own customer can hold `card` or `default`.
              example: operating
            currency:
              type: string
              description: >-
                Three-letter ISO 4217 code. The API also accepts lower case.
              enum:
                - USD
              example: USD
            category:
              description: >-
                `main` for your business's own account, `sub_account` for a
                customer's account. Defaults to `main` for your business's own
                customer and `sub_account` for any other customer.
              allOf:
                - $ref: '#/components/schemas/Category'
            label:
              type: string
              description: Your label for the account, at most 255 bytes
              example: Jane USD
            bank_code:
              type: string
              description: >-
                A `bank_code` from `GET /v1/accounts/capabilities` whose option
                has a non-empty `token_wallets`. Leave it out to use the default
                USD option, the highest-priority bank that fits.
              example: cross_river_bank
            network:
              description: >-
                Network for the account's token wallet. Send `network` or
                `wallet_id`, never both. It must be one of the networks in the
                option's `token_wallets` (`token_options` on the requirements
                form), and one of stellar, polygon, ethereum, avalanche_c_chain
                or solana.
              allOf:
                - $ref: '#/components/schemas/Network'
            wallet_id:
              type: string
              description: >-
                An existing wallet of yours to use instead of `network`. Gravv
                takes the network from the wallet, and the option must offer
                that network. Send one, not both.
            data:
              type: object
              description: >-
                The form from `GET /v2/accounts/requirements`. Put `root` scope
                fields in `data.root`, party fields in `data.parties[]`, and
                documents in `data.documents[]` or a party's `documents`.
              properties:
                root:
                  type: object
                  description: >-
                    The root fields of the option's form from `GET
                    /v2/accounts/requirements`, which is the full and current
                    list. The fields below are those the forms of this kind of
                    account ask for. Gravv fills in the fields the customer
                    record already answers. Three forms apply: one for the
                    default USD option, one for the USD, EUR and GBP option, and
                    one for the EUR and USD option. Include
                    `citizenship_country` for a person or
                    `incorporation_country` for a business, because Gravv routes
                    by it. Do not put `network` or `wallet_id` here.
                  additionalProperties: true
                  properties:
                    first_name:
                      type: string
                      description: Person, every form
                      example: Jane
                    middle_name:
                      type: string
                      description: Person, optional
                    last_name:
                      type: string
                      description: Person, every form
                      example: Doe
                    date_of_birth:
                      type: string
                      description: Person, every form. YYYY-MM-DD.
                      example: '1990-04-02'
                    email:
                      type: string
                      description: >-
                        Person, every form. Business, on the default USD option
                        (the business email) and the USD, EUR and GBP option.
                      example: jane@example.com
                    phone:
                      type: string
                      description: >-
                        Business, on the default USD option. The business phone
                        number with its country code, such as `+442071234567`.
                    phone_daytime:
                      type: string
                      description: >-
                        Phone number in E.164 format. Person, on the default USD
                        option and the EUR and USD option. Business, on the USD,
                        EUR and GBP option.
                      example: '+447700900123'
                    gender:
                      type: string
                      description: Person, on the default USD option
                      enum:
                        - female
                        - male
                    citizenship_country:
                      type: string
                      description: >-
                        Person, every form. Alpha-2 code. Gravv routes a person
                        by it.
                      example: GB
                    tax_residence_country:
                      type: string
                      description: >-
                        Person. Alpha-2 code. Required on the default USD option
                        and the EUR and USD option, and on the USD, EUR and GBP
                        option for anyone who is not a US citizen.
                      example: GB
                    permanent_address:
                      description: >-
                        Person's home address, every form. Send `state`.
                      allOf:
                        - $ref: '#/components/schemas/AccountAddress'
                    tax_id_type:
                      type: string
                      description: >-
                        Person: on the default USD option, `ssn` for a US
                        citizen; on the USD, EUR and GBP option, `ssn` once you
                        send `tax_id_number`. Business: required on the default
                        USD option and the USD, EUR and GBP option, and `ein`
                        for a company incorporated in the US. On the default USD
                        option a business sends `ein`, `ssn`, `tin`, `vat` or
                        `utr`.
                      enum:
                        - ssn
                        - ein
                        - tin
                        - vat
                        - utr
                    tax_id_number:
                      type: string
                      description: >-
                        Write-only. The number of `tax_id_type`, in any format.
                        Gravv sends only its letters and digits to the bank. A
                        US citizen sends it on the default USD option. A
                        business sends it on the default USD option and the
                        USD, EUR and GBP option. If the business has no tax ID
                        for a valid reason, send `999999999`.
                    immigration_status:
                      type: string
                      description: >-
                        Person who is not a US citizen, on the USD, EUR and GBP
                        option
                      enum:
                        - permanent_resident
                        - non_permanent_resident
                        - non_resident
                    international_supplement:
                      type: object
                      description: >-
                        A person who is not a US citizen, on the USD, EUR and
                        GBP option. Four yes or no questions. When an answer is
                        true, also send its details field.
                      properties:
                        has_us_bank_account:
                          type: boolean
                          description: >-
                            Whether the person has a US bank account
                        has_denied_bank_account:
                          type: boolean
                          description: >-
                            Whether a bank has refused the person an account
                        denial_details:
                          type: string
                          description: >-
                            Required when `has_denied_bank_account` is true
                        has_regulatory_action:
                          type: boolean
                          description: >-
                            Whether a regulator has taken action against the
                            person
                        regulatory_action_details:
                          type: string
                          description: >-
                            Required when `has_regulatory_action` is true
                        is_politically_exposed:
                          type: boolean
                          description: >-
                            Whether the person is politically exposed
                        pep_details:
                          type: string
                          description: >-
                            Required when `is_politically_exposed` is true
                    expected_activity:
                      type: object
                      description: >-
                        Person, on the USD, EUR and GBP option, for every
                        currency. Other channels, such as `ach_out` and
                        `wire_domestic_in`, are optional.
                      additionalProperties: true
                      properties:
                        expected_avg_daily_balance:
                          description: >-
                            Expected average daily balance, in the account
                            currency. Required.
                        ach_in:
                          type: object
                          description: >-
                            Expected incoming ACH payments. Required, and `0` is
                            a valid count.
                          properties:
                            monthly_count:
                              type: integer
                              description: Payments a month
                            monthly_amount:
                              description: >-
                                Total a month, in the account currency
                    source_of_income:
                      type: string
                      description: Person, on the EUR and USD option
                      enum:
                        - salary
                        - pension
                        - investment
                        - property
                        - friends_and_family
                        - benefits
                    employment_status:
                      type: string
                      description: Person, on the EUR and USD option
                      enum:
                        - employed
                        - homemaker
                        - retired
                        - self_employed
                        - student
                        - unemployed
                    work_industry:
                      type: string
                      description: >-
                        Person, on the EUR and USD option. One of the form's
                        `options`.
                    annual_deposit_range:
                      type: string
                      description: Person, on the EUR and USD option
                      enum:
                        - less_than_5k
                        - from_5k_to_50k
                        - from_50k_to_150k
                        - more_than_150k
                    transaction_frequency:
                      type: string
                      description: Person, on the EUR and USD option
                      enum:
                        - once_per_year
                        - once_every_few_months
                        - a_few_times_per_month
                        - once_per_week
                        - more_than_once_per_week
                    legal_name:
                      type: string
                      description: Business, every form
                      example: Acme Exports Ltd
                    dba_name:
                      type: string
                      description: >-
                        Business. Trading name, required on the USD, EUR and GBP
                        option.
                    business_type:
                      type: string
                      description: >-
                        Business, on the default USD option and the USD, EUR and
                        GBP option
                    business_description:
                      type: string
                      description: >-
                        Business, on the default USD option and the USD, EUR and
                        GBP option
                    registration_number:
                      type: string
                      description: >-
                        Business, on the default USD option and the EUR and USD
                        option
                    industry:
                      type: string
                      description: >-
                        Business, on the default USD option and the EUR and USD
                        option. One of the form's `options`.
                    incorporation_country:
                      type: string
                      description: >-
                        Business, every form. Alpha-2 code. Gravv routes a
                        business by it.
                      example: GB
                    incorporation_date:
                      type: string
                      description: >-
                        Business, on the default USD option and the EUR and USD
                        option. YYYY-MM-DD.
                    website:
                      type: string
                      description: >-
                        Business. Required on the default USD option and the
                        EUR and USD option, starting with `http://` or
                        `https://`.
                    business_address:
                      description: >-
                        Business address, every form. Send `state`, except on
                        the USD, EUR and GBP option, which needs it only for an
                        address in the US.
                      allOf:
                        - $ref: '#/components/schemas/AccountAddress'
                    source_of_funds:
                      description: >-
                        Business, on the EUR and USD option: required, one of
                        `revenue`, `trading_income`, `investments`,
                        `loans_credits`, `crypto_mining` or `client_funds`. On
                        the default USD option, an optional object of questions
                        about the money in the account. In that object,
                        `expected_monthly_payments_usd` is an amount, a number
                        or a decimal string such as `"25000"`. The API refuses
                        the old ranges, such as `under_5k`.
                    legal_entity_type:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `limited_liability_company`.
                    business_tax_id:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. Write-only. The
                        company's tax ID.
                    business_ownership_type:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `private`.
                    estimated_monthly_turnover:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `up_to_50k`.
                    estimated_transaction_value:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `up_to_15k`.
                    monthly_transaction_frequency:
                      type: string
                      description: >-
                        Business, on the EUR and USD option. One of the form's
                        `options`, such as `up_to_20`.
                parties:
                  type: array
                  description: >-
                    Business only. The API refuses it for individuals. Declare 1
                    to 10 people. Each entry is an associated person from the
                    customer record (`id` plus any changes) or a new person with
                    the new-party fields. Leave it out to declare every
                    associated person on the record. Every form asks for names,
                    `date_of_birth`, `email`, `phone_daytime`, `has_ownership`,
                    `has_control` and `is_signer`, and `ownership_percentage`
                    for an owner. The default USD option adds
                    `citizenship_country`, the person's own
                    `residential_address`, and `tax_id_type` and
                    `tax_id_number` for every party: `ssn` for a US citizen,
                    otherwise `tin` (a national tax or identity number) or
                    `utr`, or `999999999` for a person who has none. The USD, EUR and GBP option adds
                    `citizenship_country` and `is_director`, and needs
                    `ownership_percentage` from 1 to 100, and at least 25 for a
                    person with control. The EUR and USD option adds
                    `tax_residence_country` and `residential_address`.
                  items:
                    $ref: '#/components/schemas/CreateAccountParty'
                documents:
                  type: array
                  description: >-
                    Root documents. When you send none, Gravv uses the documents
                    on the customer record. A person sends one identity document
                    and a `proof_of_address`. A business sends
                    `articles_of_incorporation`, `ownership_document` and
                    `proof_of_address`, plus `control_structure` on the default
                    USD option and the EUR and USD option. Each party sends an
                    identity document in its own `documents`, and a
                    `proof_of_address` too on the default USD option.
                  items:
                    $ref: '#/components/schemas/DocumentUpload'
        - title: Wallet-backed EUR or GBP account
          description: >-
            A EUR account with an IBAN or a GBP account with a sort code, whose
            deposits arrive as USDC in the account's own wallet. Two options
            offer EUR and one offers GBP.
          type: object
          required:
            - customer_id
            - currency
          anyOf:
            - required:
                - network
            - required:
                - wallet_id
          additionalProperties: false
          properties:
            customer_id:
              type: string
              description: >-
                An existing customer whose KYC is completed. The API checks it
                before every other field.
              format: uuid
              example: 0b6f3c1e-2a4d-4c8e-9f10-7d2a6b5e4c33
            customer_type:
              type: string
              description: >-
                `individual` or `business`. Always send it, because bank choice
                and routing use the value you send. Defaults to the customer's
                profile type.
              enum:
                - individual
                - business
              example: individual
            account_type:
              type: string
              description: >-
                Account type from the option's `account_types`: `operating`,
                `regular`, `card` or `default`. Defaults to `operating`. Only
                your business's own customer can hold `card` or `default`.
              example: operating
            currency:
              type: string
              description: >-
                Three-letter ISO 4217 code. The API also accepts lower case. The
                EUR and USD option does not offer GBP.
              enum:
                - EUR
                - GBP
              example: EUR
            category:
              description: >-
                `main` for your business's own account, `sub_account` for a
                customer's account. Defaults to `main` for your business's own
                customer and `sub_account` for any other customer.
              allOf:
                - $ref: '#/components/schemas/Category'
            label:
              type: string
              description: Your label for the account, at most 255 bytes
              example: Jane USD
            bank_code:
              type: string
              description: >-
                A `bank_code` from `GET /v1/accounts/capabilities` whose option
                has a non-empty `token_wallets`. Leave it out to use the USD,
                EUR and GBP option, the highest-priority bank that fits.
              example: lead_bank
            network:
              description: >-
                Network for the account's token wallet. Send `network` or
                `wallet_id`, never both. It must be one of the networks in the
                option's `token_wallets` (`token_options` on the requirements
                form), and one of stellar, polygon, ethereum, avalanche_c_chain
                or solana.
              allOf:
                - $ref: '#/components/schemas/Network'
            wallet_id:
              type: string
              description: >-
                An existing wallet of yours to use instead of `network`. Gravv
                takes the network from the wallet, and the option must offer
                that network. Send one, not both.
            data:
              type: object
              description: >-
                The form from `GET /v2/accounts/requirements`. Put `root` scope
                fields in `data.root`, party fields in `data.parties[]`, and
                documents in `data.documents[]` or a party's `documents`.
              properties:
                root:
                  type: object
                  description: >-
                    The root fields of the option's form from `GET
                    /v2/accounts/requirements`, which is the full and current
                    list. The fields below are those the forms of this kind of
                    account ask for. Gravv fills in the fields the customer
                    record already answers. Two forms apply: one for the USD,
                    EUR and GBP option and one for the EUR and USD option. Each
                    option uses its USD form for EUR and GBP. Include
                    `citizenship_country` for a person or
                    `incorporation_country` for a business, because Gravv routes
                    by it. Do not put `network` or `wallet_id` here.
                  additionalProperties: true
                  properties:
                    first_name:
                      type: string
                      description: Person, both forms
                      example: Jane
                    middle_name:
                      type: string
                      description: Person, optional
                    last_name:
                      type: string
                      description: Person, both forms
                      example: Doe
                    date_of_birth:
                      type: string
                      description: Person, both forms. YYYY-MM-DD.
                      example: '1990-04-02'
                    email:
                      type: string
                      description: >-
                        Person, both forms. Business, on the USD, EUR and GBP
                        option.
                      example: jane@example.com
                    phone_daytime:
                      type: string
                      description: >-
                        Phone number in E.164 format. Person, on the EUR and USD
                        option. Business, on the USD, EUR and GBP option.
                      example: '+447700900123'
                    citizenship_country:
                      type: string
                      description: >-
                        Person, both forms. Alpha-2 code. Gravv routes a person
                        by it.
                      example: GB
                    tax_residence_country:
                      type: string
                      description: >-
                        Person. Alpha-2 code. Required on the EUR and USD
                        option, and on the USD, EUR and GBP option for anyone
                        who is not a US citizen.
                      example: GB
                    permanent_address:
                      description: >-
                        Person's home address, both forms. Send `state`.
                      allOf:
                        - $ref: '#/components/schemas/AccountAddress'
                    tax_id_type:
                      type: string
                      description: >-
                        On the USD, EUR and GBP option. Person: `ssn` once you
                        send `tax_id_number`. Business: required, and `ein` for
                        a US company.
                      enum:
                        - ssn
                        - ein
                        - tin
                    tax_id_number:
                      type: string
                      description: >-
                        Write-only. The number of `tax_id_type`. Required for a
                        business on the USD, EUR and GBP option.
                    immigration_status:
                      type: string
                      description: >-
                        Person who is not a US citizen, on the USD, EUR and GBP
                        option
                      enum:
                        - permanent_resident
                        - non_permanent_resident
                        - non_resident
                    international_supplement:
                      type: object
                      description: >-
                        A person who is not a US citizen, on the USD, EUR and
                        GBP option. Four yes or no questions. When an answer is
                        true, also send its details field.
                      properties:
                        has_us_bank_account:
                          type: boolean
                          description: >-
                            Whether the person has a US bank account
                        has_denied_bank_account:
                          type: boolean
                          description: >-
                            Whether a bank has refused the person an account
                        denial_details:
                          type: string
                          description: >-
                            Required when `has_denied_bank_account` is true
                        has_regulatory_action:
                          type: boolean
                          description: >-
                            Whether a regulator has taken action against the
