                    $ref: '#/components/schemas/DocumentUpload'
        - title: USD account in the US (no wallet)
          description: >-
            A fiat-only USD account at a US bank, for a person whose
            `citizenship_country` is US or a company incorporated in the US.
            Deposits stay in dollars and the account has no wallet. The option
            usually allows one account per customer.
          type: object
          required:
            - customer_id
            - currency
            - bank_code
          additionalProperties: false
          properties:
            customer_id:
              type: string
              description: >-
                An existing customer whose KYC is completed. The API checks it
                before every other field.
              format: uuid
              example: 0b6f3c1e-2a4d-4c8e-9f10-7d2a6b5e4c33
            customer_type:
              type: string
              description: >-
                `individual` or `business`. Always send it, because bank choice
                and routing use the value you send. Defaults to the customer's
                profile type.
              enum:
                - individual
                - business
              example: individual
            account_type:
              type: string
              description: >-
                Account type from the option's `account_types`: `operating`,
                `regular`, `card` or `default`. Defaults to `operating`. Only
                your business's own customer can hold `card` or `default`.
              example: operating
            currency:
              type: string
              description: >-
                Three-letter ISO 4217 code. The API also accepts lower case.
              enum:
                - USD
              example: USD
            category:
              description: >-
                `main` for your business's own account, `sub_account` for a
                customer's account. Defaults to `main` for your business's own
                customer and `sub_account` for any other customer.
              allOf:
                - $ref: '#/components/schemas/Category'
            label:
              type: string
              description: Your label for the account, at most 255 bytes
              example: Jane USD
            bank_code:
              type: string
              description: >-
                The `bank_code` of the US option, from capabilities with
                `country=US` and an empty `token_wallets`. Required here:
                without it, a USD request goes to the default USD option, which
                is wallet-backed and asks for `network`.
            account_structure:
              type: string
              description: >-
                Not yet live. Only for an option that offers FBO accounts, and
                no live option does yet. `fbo_account` opens another account in
                the customer's own name, and `subledger` opens one beneath their
                FBO account. Leave it out, and the customer's first account at
                the bank is an FBO account and each later one is a subledger.
                The API refuses it at any other option.
              enum:
                - fbo_account
                - subledger
              x-not-yet-live: true
            parent_account_id:
              type: string
              description: >-
                Not yet live. The customer's FBO account that a subledger opens
                beneath. Leave it out to use their oldest one. Do not send it
                with `account_structure` `fbo_account`.
              format: uuid
              x-not-yet-live: true
            data:
              type: object
              description: >-
                The form from `GET /v2/accounts/requirements`. Put `root` scope
                fields in `data.root`, party fields in `data.parties[]`, and
                documents in `data.documents[]` or a party's `documents`.
              properties:
                root:
                  type: object
                  description: >-
                    The root fields of the option's form from `GET
                    /v2/accounts/requirements`, which is the full and current
                    list. The fields below are those the forms of this kind of
                    account ask for. Gravv fills in the fields the customer
                    record already answers. Include `citizenship_country` for a
                    person or `incorporation_country` for a business, because
                    Gravv routes by it.
                  additionalProperties: true
                  properties:
                    first_name:
                      type: string
                      description: Person
                      example: Jane
                    middle_name:
                      type: string
                      description: Person, optional
                    last_name:
                      type: string
                      description: Person
                      example: Doe
                    date_of_birth:
                      type: string
                      description: Person. YYYY-MM-DD.
                    email:
                      type: string
                      description: Person and business
                    phone_daytime:
                      type: string
                      description: Person. Phone number in E.164 format.
                    citizenship_country:
                      type: string
                      description: >-
                        Person. Gravv routes a person by it, and this option
                        serves only US citizens.
                      enum:
                        - US
                    permanent_address:
                      description: Person's home address, with `state`
                      allOf:
                        - $ref: '#/components/schemas/AccountAddress'
                    mailing_address:
                      description: >-
                        Optional mailing address, for a person or a business
                      allOf:
                        - $ref: '#/components/schemas/AccountAddress'
                    employment_status:
                      type: string
                      description: Person
                      enum:
                        - employed
                        - homemaker
                        - retired
                        - self_employed
                        - student
                        - unemployed
                    employer_info:
                      type: object
                      description: >-
                        Person, when `employment_status` is `employed`
                      properties:
                        current_employer:
                          type: string
                          description: Name of the employer
                        occupation:
                          type: string
                          description: The person's occupation
                        permanent_address:
                          description: The employer's address
                          allOf:
                            - $ref: '#/components/schemas/AccountAddress'
                    income_source:
                      type: string
                      description: >-
                        Person, when you send no
                        `employer_info.current_employer`
                    tax_id_type:
                      type: string
                      description: >-
                        Person: required, `ssn` for a US citizen. Business:
                        required, `ein` for a US company.
                      enum:
                        - ssn
                        - ein
                        - tin
                    tax_id_number:
                      type: string
                      description: >-
                        Required and write-only. The number of `tax_id_type`.
                    expected_activity:
                      type: object
                      description: >-
                        Person and business. Other channels, such as `ach_out`,
                        `wire_domestic_in` and `check_deposits`, are optional.
                      additionalProperties: true
                      properties:
                        expected_avg_daily_balance:
                          description: >-
                            Expected average daily balance, in the account
                            currency. Required.
                        ach_in:
                          type: object
                          description: >-
                            Expected incoming ACH payments. Required, and `0` is
                            a valid count.
                          properties:
                            monthly_count:
                              type: integer
                              description: Payments a month
                            monthly_amount:
                              description: >-
                                Total a month, in the account currency
                    legal_name:
                      type: string
                      description: Business
                      example: Rocky Mountain Bakery LLC
                    dba_name:
                      type: string
                      description: Business. Trading name, optional.
                    registration_number:
                      type: string
                      description: Business
                    incorporation_country:
                      type: string
                      description: >-
                        Business. Gravv routes a business by it, and this option
                        serves only US companies.
                      enum:
                        - US
                    incorporation_date:
                      type: string
                      description: Business. YYYY-MM-DD.
                    state_incorporated:
                      type: string
                      description: Business, optional. State of incorporation.
                    industry:
                      type: string
                      description: >-
                        Business. One of the form's `options`, such as
                        `manufacturing`.
                    website:
                      type: string
                      description: Business, optional
                    business_status:
                      type: string
                      description: Business
                      enum:
                        - operating
                        - non_operating
                    business_entity_type:
                      type: string
                      description: Business
                      enum:
                        - corporation
                        - llc
                        - partnership
                        - unincorporated_business
                        - international
                    corporation_taxed_as:
                      type: string
                      description: >-
                        Business, when `business_entity_type` is `corporation`
                      enum:
                        - c_corp
                        - s_corp
                    llc_taxed_as:
                      type: string
                      description: >-
                        Business, when `business_entity_type` is `llc`
                      enum:
                        - c_corp
                        - s_corp
                        - partnership
                    business_address:
                      description: Business address, with `state`
                      allOf:
                        - $ref: '#/components/schemas/AccountAddress'
                    autofill_tax_form:
                      type: boolean
                      x-not-yet-live: true
                      description: >-
                        Not yet live. Lets a non-US applicant ask the bank to
                        fill the tax form. Production rejects this field as
                        unknown, so do not send it there.
                parties:
                  type: array
                  description: >-
                    Business only. The API refuses it for individuals. Declare 1
                    to 10 people. Each entry is an associated person from the
                    customer record (`id` plus any changes) or a new person with
                    the new-party fields. Each needs names, `email`,
                    `party_role` (such as `primary` or `authorized_individual`),
                    `date_of_birth`, `citizenship_country`, `permanent_address`
                    and `mailing_address`, and `ownership_percentage` for an
                    owner. A US citizen also needs `tax_id_type` `ssn` and
                    `tax_id_number`. A person who is not a US citizen also needs
                    `immigration_status` and `tax_residence_country`.
                  items:
                    $ref: '#/components/schemas/CreateAccountParty'
                documents:
                  type: array
                  description: >-
                    Root documents. When you send none, Gravv uses the documents
                    on the customer record. A person sends one identity document
                    and a `proof_of_address`. A business sends
                    `articles_of_incorporation`, `ownership_document`,
                    `proof_of_address` and `control_structure`, and each party
                    sends an identity document in its own `documents`.
                  items:
                    $ref: '#/components/schemas/DocumentUpload'
        - title: EUR or GBP account with its own IBAN
          description: >-
