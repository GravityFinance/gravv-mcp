                        - investment
                        - property
                        - friends_and_family
                        - benefits
                    employment_status:
                      type: string
                      description: Person, on the EUR and USD option
                      enum:
                        - employed
                        - homemaker
                        - retired
                        - self_employed
                        - student
                        - unemployed
                    work_industry:
                      type: string
                      description: >-
                        Person, on the EUR and USD option. One of the form's
