            bank_code:
              type: string
              description: >-
                The `bank_code` of the IBAN option, from capabilities, with
                `token_wallets: []` and `max_accounts_per_customer: 1`. Required
                here: without it, a EUR or GBP request goes to the wallet-backed
                USD, EUR and GBP option.
            data:
              type: object
              description: >-
                The form from `GET /v2/accounts/requirements`. Put `root` scope
