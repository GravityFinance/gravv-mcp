                      description: Person
                      example: Jane
                    middle_name:
                      type: string
                      description: Person, optional
                    last_name:
                      type: string
                      description: Person
                      example: Doe
                    date_of_birth:
                      type: string
                      description: Person. YYYY-MM-DD.
                    birth_place:
                      type: string
                      description: Person. The town or city of birth.
                    email:
                      type: string
                      description: Person
                    phone_daytime:
                      type: string
                      description: Person. Phone number in E.164 format.
                    citizenship_country:
                      type: string
                      description: >-
                        Person. Alpha-2 code. Gravv routes a person by it.
                      example: GB
                    tax_residence_country:
                      type: string
                      description: >-
                        Person, optional. The country of tax residence, if it
                        differs.
                    tax_id_type:
                      type: string
                      description: >-
                        Person. Required when the person pays tax in the US or
                        you send `tax_id_number`: `ssn` in the US, `tin`
                        anywhere else.
                      enum:
                        - ssn
                        - tin
                    tax_id_number:
                      type: string
                      description: >-
                        Person. Write-only. Required with `tax_id_type`.
                    permanent_address:
