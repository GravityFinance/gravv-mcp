openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    This is the API Gateway for Gravv services.
    Use the `Api-Key` header for authentication.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required for POST requests. 1 to 255 printable ASCII characters. A retry
        with the same key and body within 24 hours returns the first response.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: card-kyc-b84d9a52-attempt-1
  schemas:
    StartKYCRequest:
      type: object
      required:
        - customer_id
      properties:
        customer_id:
          type: string
          format: uuid
          description: ID of the customer to verify. Other fields are ignored.
    StartKYCResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: object
          required:
            - status
            - review_status
            - web_url
          properties:
            status:
              type: string
              description: Always `success`.
              enum:
                - success
              example: success
            review_status:
              type: string
              description: Always `pending`.
              enum:
                - pending
              example: pending
            web_url:
              type: string
              format: uri
              description: Hosted verification link. It expires after one hour.
              example: https://verify.gravv.xyz/websdk/p/example_token
            applicant_id:
              type: string
              description: Verification applicant ID. Returned on the first start only.
              example: 66f0c2a1b3d4e5f6a7b8c9d0
            kyc_level:
              type: string
              description: >-
                Verification level, `basic`. An empty string when a started
                verification is restarted.
              example: basic
            external_user_id:
              type: string
              description: >-
                The customer ID. An empty string when a started verification is
                restarted.
              example: d2581d3c-7c55-4607-9717-546694194636
        error:
          type: 'null'
          example: null
    UploadDocumentRequest:
      type: object
      required:
        - customer_id
        - metadata
        - content
        - filename
      properties:
        customer_id:
          type: string
          format: uuid
          description: ID of the customer this document belongs to
          example: b84d9a52-2978-43e5-9b86-eac9839e1146
        metadata:
          $ref: '#/components/schemas/DocumentMetadata'
        content:
          type: string
          format: byte
          description: >-
            The file as plain standard base64. The decoded file must be a JPEG,
            PNG or PDF. Keep files under 5 MB; larger files fail with a 400.
          example: >-
            iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
        filename:
          type: string
          description: >-
            Name of the file. It must end in `.jpg`, `.jpeg`, `.png` or `.pdf`, in
            any case.
          example: passport_front.jpg
          maxLength: 255
          pattern: \.([Jj][Pp][Ee]?[Gg]|[Pp][Nn][Gg]|[Pp][Dd][Ff])$
    DocumentMetadata:
      type: object
      required:
        - idDocType
        - country
      properties:
        idDocType:
          type: string
          description: >-
            Type of document, in lower case. Individual customers need a
            `selfie` plus one of `passport`, `id_card` or `drivers_license`.
            Business customers need one of `company_doc`,
            `registration_certificate` or `formation_document`. These names
            differ from the customer KYC upload; do not mix the two upload flows
            for one customer.
          enum:
            - passport
            - id_card
            - drivers_license
            - selfie
            - residence_permit
            - utility_bill
            - bank_card
            - vehicle_registration_certificate
            - other
            - registration_certificate
            - company_doc
            - formation_document
            - ownership_document
            - proof_of_address
            - proof_of_address_document
          example: passport
        idDocSubType:
          type: string
          description: >-
            Which side of the document this is. Send the back of a card as a
            second upload with `BACK_SIDE`.
          enum:
            - FRONT_SIDE
            - BACK_SIDE
          example: FRONT_SIDE
        country:
          type: string
          minLength: 3
          maxLength: 3
          description: >-
            Issuing country as an ISO 3166-1 alpha-3 code. Required for every
            type, including `selfie`.
          example: NGA
        firstName:
          type: string
          description: First name as shown on the document
          example: John
          maxLength: 100
        middleName:
          type: string
          description: Middle name as shown on the document
          example: Michael
          maxLength: 100
        lastName:
          type: string
          description: Last name as shown on the document
          example: Doe
          maxLength: 100
        issuedDate:
          type: string
          format: date
          description: Issue date as YYYY-MM-DD
          example: '2020-01-15'
        validUntil:
          type: string
          format: date
          description: Expiry date as YYYY-MM-DD
          example: '2030-01-15'
        number:
          type: string
          description: Document number
          example: A12345678
          maxLength: 50
        dob:
          type: string
          format: date
          description: Date of birth as YYYY-MM-DD
          example: '1990-05-20'
        placeOfBirth:
          type: string
          description: Place of birth as shown on the document
          example: New York, NY
          maxLength: 100
    UploadDocumentResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/UploadDocumentSuccess'
            - $ref: '#/components/schemas/BusinessError'
        error:
          type: 'null'
          example: null
    UploadDocumentSuccess:
      type: object
      required:
        - status
        - customer_id
        - document_type
        - country
        - message
      properties:
        status:
          type: string
          enum:
            - success
          example: success
        customer_id:
          type: string
          format: uuid
          description: ID of the customer the document was saved for
          example: b84d9a52-2978-43e5-9b86-eac9839e1146
        document_type:
          type: string
          description: >-
            Stored type, in upper case. For example `id_card` is stored as
            `ID_CARD`, `drivers_license` as `DRIVERS`, and `company_doc` as
            `REGISTRATION_CERTIFICATE`.
          example: PASSPORT
        document_sub_type:
          type: string
          description: The `idDocSubType` you sent
          example: FRONT_SIDE
        country:
          type: string
          description: Issuing country as an alpha-3 code
          example: NGA
        message:
          type: string
          description: >-
            Confirmation text. Despite its wording, the next call is `POST
            /v1/risk/start-kyc-s2s`.
          example: Document saved. Use /initiate-kyc to submit for verification.
    BusinessError:
      type: object
      description: >-
        A validation or storage failure, returned with HTTP 200. The message is
        generic; check the request against the rules on this page.
      required:
        - status
        - error_code
        - message
      properties:
        status:
          type: string
          enum:
            - error
          example: error
        error_code:
          type: string
          enum:
            - INVALID_REQUEST
            - DOCUMENT_ERROR
          example: INVALID_REQUEST
        message:
          type: string
          example: >-
            The provided data format is invalid. Please check your request and
            try again.
    StartKYCS2SRequest:
      type: object
      required:
        - customer_id
      properties:
        customer_id:
          type: string
          format: uuid
          description: >-
            ID of the customer to verify. Upload the required documents for this
            customer first.
          example: aabe0a33-6716-42e2-bbca-7abf1a8bd91c
    StartKYCS2SResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/StartKYCS2SResult'
            - $ref: '#/components/schemas/StartKYCS2SCodeResult'
        error:
          type: 'null'
          example: null
    StartKYCS2SResult:
      type: object
      required:
        - status
        - applicant_id
        - message
      properties:
        status:
          type: string
          description: >-
            `pending` when every document was sent for review.
            `partial_success` when some documents failed; the customer finishes
            on `web_url`.
          enum:
            - pending
            - partial_success
          example: pending
        applicant_id:
          type: string
          description: Verification applicant ID
          example: 66f0c2a1b3d4e5f6a7b8c9d0
        message:
          type: string
          example: KYC verification initiated. Status will be updated via webhook.
        web_url:
          type: string
          format: uri
          description: Hosted link to finish the failed documents. Only on `partial_success`.
          example: https://verify.gravv.xyz/websdk/p/example_token
        failed_documents:
          type: array
          description: Documents that could not be sent. Only on `partial_success`.
          items:
            type: object
            properties:
              doc_type:
                type: string
                description: Stored type, such as `ID_CARD`
                example: SELFIE
              reason:
                type: string
                example: Upload failed
    StartKYCS2SCodeResult:
      type: object
      description: >-
        Missing documents, or KYC already completed. Returned with HTTP 200.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - MISSING_DOCUMENTS
            - KYC_ALREADY_COMPLETED
          example: MISSING_DOCUMENTS
        message:
          type: string
          example: Required documents have not been uploaded for this customer
        details:
          type: object
          properties:
            missing_documents:
              type: array
              items:
                type: string
              example:
                - SELFIE
    ErrorResponse:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: 'null'
          description: Always null for error responses
          example: null
        error:
          type: string
          description: >-
            Error message. Most messages start with an upper-case code and a
            colon, such as `CUSTOMER_NOT_FOUND: ...`.
          example: >-
            CUSTOMER_NOT_FOUND: Customer not found. Please verify the customer
            exists in our system.
security:
  - ApiKeyAuth: []
tags:
  - name: Card KYC
    description: Verify a cardholder, with a liveness check, for card issuance
paths:
  /v1/risk/start-kyc:
    post:
      tags:
        - Card KYC
      summary: Start KYC verification
      operationId: startCardholderKyc
      description: >
        Starts hosted verification for a cardholder, with a liveness check, and
        returns a link. The link expires after one hour.


        Do not call this for a customer whose KYC is already `completed`. It
        sets the customer's KYC back to `pending` until the new review ends,
        which can block accounts and cards. To get only a liveness check, use
        the link that feature activation returns.


        Every error on this route is HTTP 400.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartKYCRequest'
            examples:
              KYCRequest:
                summary: KYC Example
                value:
                  customer_id: d2581d3c-7c55-4607-9717-546694194636
      responses:
        '200':
          description: Link issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartKYCResponse'
              example:
                data:
                  status: success
                  applicant_id: 66f0c2a1b3d4e5f6a7b8c9d0
                  kyc_level: basic
                  review_status: pending
                  external_user_id: d2581d3c-7c55-4607-9717-546694194636
                  web_url: https://verify.gravv.xyz/websdk/p/example_token
                error: null
        '400':
          description: >-
            Any error, including an unknown customer and a start already in
            progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CustomerNotFound:
                  summary: The customer does not exist in your tenant
                  value:
                    data: null
                    error: >-
                      CUSTOMER_NOT_FOUND: Customer not found. Please verify the
                      customer exists in our system.
                PersonsNotVerified:
                  summary: A business's associated persons are not verified
                  value:
                    data: null
                    error: >-
                      KYC_NOT_FOUND: Basic KYC must be completed before upgrading
                      to higher levels.
                InProgress:
                  summary: Another start for this customer is running
                  value:
                    data: null
                    error: >-
                      KYC for customer d2581d3c-7c55-4607-9717-546694194636 is
                      already in progress; retry shortly
  /v1/risk/upload-document:
    post:
      tags:
        - Card KYC
      summary: Upload document
      operationId: uploadCardholderKycDocument
      description: >
        Stores one document file for a cardholder. This is step 1 of
        server-to-server card KYC. Nothing is sent for review until you call
        `POST /v1/risk/start-kyc-s2s`.


        **Check `data.status`.** A validation failure returns HTTP 200 with
        `data.status: error` and a generic message. Common causes are a
        two-letter country, a file name that does not end in `.jpg`, `.jpeg`,
        `.png` or `.pdf`, a PDF selfie, or a date that is not YYYY-MM-DD.


        Every upload is stored as a front image. Send the back of a card as a
        second upload with `idDocSubType: BACK_SIDE`. Uploading the same type
        and sub-type again replaces the earlier file. Keep files under 5 MB.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
            examples:
              PassportUpload:
                summary: Upload a passport
                value:
                  customer_id: b84d9a52-2978-43e5-9b86-eac9839e1146
                  metadata:
                    idDocType: passport
                    idDocSubType: FRONT_SIDE
                    country: USA
                    firstName: John
                    middleName: Michael
                    lastName: Doe
                    issuedDate: '2020-01-15'
                    validUntil: '2030-01-15'
                    number: A12345678
                    dob: '1990-05-20'
                    placeOfBirth: New York, NY
                  content: >-
                    iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
                  filename: passport_front.png
              SelfieUpload:
                summary: Upload a selfie
                value:
                  customer_id: b84d9a52-2978-43e5-9b86-eac9839e1146
                  metadata:
                    idDocType: selfie
                    country: NGA
                  content: >-
                    iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
                  filename: selfie.png
              BusinessCompanyDocument:
                summary: Upload a business document
                value:
                  customer_id: c84d9a52-2978-43e5-9b86-eac9839e1147
                  metadata:
                    idDocType: company_doc
                    country: NGA
                    number: RC123456
                  content: >-
                    iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
                  filename: registration_certificate.png
      responses:
        '200':
          description: >-
            Document stored, or a validation failure with `data.status: error`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponse'
              examples:
                SuccessPassport:
                  summary: Passport stored
                  value:
                    data:
                      status: success
                      customer_id: b84d9a52-2978-43e5-9b86-eac9839e1146
                      document_type: PASSPORT
                      document_sub_type: FRONT_SIDE
                      country: USA
                      message: Document saved. Use /initiate-kyc to submit for verification.
                    error: null
                ValidationFailed:
                  summary: The request failed validation
                  value:
                    data:
                      status: error
                      error_code: INVALID_REQUEST
                      message: >-
                        The provided data format is invalid. Please check your
                        request and try again.
                    error: null
        '400':
          description: Invalid customer, missing KYC record, or a file that is too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CustomerNotFound:
                  summary: The customer does not exist in your tenant
                  value:
                    data: null
                    error: >-
                      CUSTOMER_NOT_FOUND: Customer not found. Please verify the
                      customer exists in our system.
                MissingIdempotencyKey:
                  summary: Idempotency-Key header missing
                  value:
                    data: null
                    error: missing idempotency key in request headers
        '409':
          description: A request with the same Idempotency-Key is still running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                data: null
                error:
                  code: idempotency_in_flight
                  message: >-
                    A request with the same Idempotency-Key is currently being
                    processed
        '413':
          description: The request body is too large.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      limit:
                        type: integer
              example:
                data: null
                error:
                  code: request_body_too_large
                  message: Request body exceeds the maximum allowed size
                  limit: 13997400
        '422':
          description: The Idempotency-Key was used before with a different body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                data: null
                error:
                  code: idempotency_key_reused
                  message: >-
                    Idempotency-Key was previously used with a different request
                    payload
  /v1/risk/start-kyc-s2s:
    post:
      tags:
        - Card KYC
      summary: Initiate server-to-server KYC verification
      operationId: startCardholderKycS2S
      description: >
        Sends the documents you uploaded for a cardholder for review. This is
        step 2 of server-to-server card KYC.


        Three outcomes return HTTP 200, so check `data.status` and `data.code`:
        `pending` (sent for review), `partial_success` (the customer finishes
        on `web_url`), or a `code` of `MISSING_DOCUMENTS` or
        `KYC_ALREADY_COMPLETED`.


        This flow records no liveness check, so card activation will ask for
        one. Other errors are HTTP 400.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartKYCS2SRequest'
            examples:
              IndividualKYC:
                summary: Individual KYC Request
                value:
                  customer_id: aabe0a33-6716-42e2-bbca-7abf1a8bd91c
              BusinessKYB:
                summary: Business KYB Request
                value:
                  customer_id: b84d9a52-2978-43e5-9b86-eac9839e1146
      responses:
        '200':
          description: Sent for review, partly sent, or a coded result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartKYCS2SResponse'
              examples:
                Pending:
                  summary: All documents sent for review
                  value:
                    data:
                      status: pending
                      applicant_id: 66f0c2a1b3d4e5f6a7b8c9d0
                      message: KYC verification initiated. Status will be updated via webhook.
                    error: null
                PartialSuccess:
                  summary: Some documents failed; the customer finishes on the link
                  value:
                    data:
                      status: partial_success
                      applicant_id: 66f0c2a1b3d4e5f6a7b8c9d0
                      web_url: https://verify.gravv.xyz/websdk/p/example_token
                      failed_documents:
                        - doc_type: SELFIE
                          reason: Upload failed
                      message: Upload failed
                    error: null
                MissingDocuments:
                  summary: Required documents are missing
                  value:
                    data:
                      code: MISSING_DOCUMENTS
                      message: Required documents have not been uploaded for this customer
                      details:
                        missing_documents:
                          - government_id (PASSPORT, ID_CARD, or DRIVERS)
                          - SELFIE
                    error: null
                AlreadyCompleted:
                  summary: KYC is already completed
                  value:
                    data:
                      code: KYC_ALREADY_COMPLETED
                      message: KYC verification has already been completed for this customer.
                    error: null
        '400':
          description: Any other error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CustomerNotFound:
                  summary: The customer does not exist in your tenant
                  value:
                    data: null
                    error: >-
                      CUSTOMER_NOT_FOUND: Customer not found. Please verify the
                      customer exists in our system.
                ProcessingFailed:
                  summary: The review could not start
                  value:
                    data: null
                    error: >-
                      KYC_PROCESSING_ERROR: KYC processing failed. Please try
                      again later or contact support.
