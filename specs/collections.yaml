          schema:
            type: string
            format: uuid
          description: Filter saved cards by customer ID.
          example: f827e428-c497-4b21-8855-99d978909c28
      responses:
        '200':
          description: List of saved cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedCard'
                  error:
                    type: 'null'
              example:
                data:
                  - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    card_token: tokn_80aebb6ea2594a74bc215a64
                    card_last4: '1111'
                    card_brand: visa
                    card_exp_month: '12'
                    card_exp_year: '2028'
                    is_default: true
                    is_expiring_soon: false
                    created_at: '2026-04-08T10:00:00Z'
                error: null
  /v1/collections/cards/{card_id}:
    get:
      tags:
        - Collections
      summary: Get saved card
      description: >
        Returns a single saved card by ID. Returns 404 if the card does not
        exist or is inactive, and 403 if the card belongs to a different tenant.
      parameters:
        - in: path
          name: card_id
          required: true
          schema:
            type: string
            format: uuid
          description: Saved card ID
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        '200':
          description: Saved card details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SavedCard'
                  error:
                    type: 'null'
              example:
                data:
                  id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  card_token: tokn_80aebb6ea2594a74bc215a64
                  card_last4: '1111'
                  card_brand: visa
                  card_exp_month: '12'
                  card_exp_year: '2028'
                  is_default: true
                  is_expiring_soon: false
                  created_at: '2026-04-08T10:00:00Z'
                error: null
    delete:
      tags:
        - Collections
      summary: Delete saved card
      description: >
        This operation is idempotent. It returns success even if the card
        doesn't exist.
      parameters:
        - in: path
          name: card_id
          required: true
          schema:
            type: string
            format: uuid
          description: Saved card ID
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        '200':
          description: Card deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCardResponse'
              example:
                success: true
                message: card deleted successfully
