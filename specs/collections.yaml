                BankTransferResponse:
                  summary: Bank transfer collection
                  value:
                    data:
                      transaction_id: e07aa829-cda4-4c51-bd43-09a2f1e6604d
                      instruction: <p>You have a pending payment.</p>
                      bank_info:
                        account_number: '9876543210'
                        bank_name: Example Bank
                        account_name: Example Collections
                      account: '0123456789'
                      client_reference: order-1002
                      status: created
                      onramp_status: initialized
                      new_onramp_status: initialized
                      status_transition_deadline: '2026-10-31T23:59:59Z'
