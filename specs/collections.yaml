          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'amount: amount has too many decimal places'
  /v1/collections/{id}:
    get:
      tags:
        - Collections
      summary: Get transaction by ID
      operationId: getCollection
      description: >-
        Returns the status and details of a collection. Pass the
        `transaction_id` from the create call, the charge call or a webhook.
        The `id` in this response is a different value.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The collection's `transaction_id`
          example: 07b655cc-3dbd-4f6c-a16c-4657946d2e08
        - in: query
          name: enrich
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: Send `true` to include the payer details in `enriched_info`
          example: 'true'
      responses:
        '200':
          description: The collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CollectionDetails'
                  error:
                    type: 'null'
              example:
                data:
                  id: 5b0d7c1e-2f7e-4c55-9a51-0d4c1a6c2e11
                  transaction_status: completed
                  onramp_status: transfer_completed
                  new_onramp_status: settlement_completed
                  status_transition_deadline: '2026-10-31T23:59:59Z'
                  amount: '50.00'
                  asset: USDC
                  network: polygon
                  customer_id: 04dfb2e5-1274-4214-b5fd-3415fde7dc17
                  client_reference: order-1001
                  fee_cents: 0
                  total_amount_cents: 5000
                  country: Nigeria
                  currency: United States Dollar
                  payment_method: Credit/Debit Card
                  transaction_source: card
                  destination_wallet_address: '0x445906a6766927c5da8b2fca0e0db5d7b5565ef8'
                  web3_tx_hash: '0x56713ddd7478bbe69925a4aa477d9cb74b56c4c041a304ca3160b2289b6e3a44'
                  card_brand: VISA
                  card_last4: '1111'
                  approval_state: approved
                  three_ds_status: not_required
                  created_at: '2026-10-12T09:14:03Z'
                  status_updated_at: '2026-10-12T09:21:40Z'
                  completed_at: '2026-10-12T09:21:40Z'
                  events:
                    - event_type: payment_initiated
                      title: Payment initiated
                      date: '2026-10-12T09:14:03Z'
                error: null
        '400':
          description: >-
            The request failed. An unknown ID returns
            `transaction not found: resource not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'transaction not found: resource not found'
  /v1/collections/cards/payment-intents:
    post:
      tags:
        - Collections
      summary: Create payment intent
      operationId: createCardPaymentIntent
      description: >-
        Creates a card payment intent. It lasts 24 hours and allows at most 5
        charge attempts.


        Without `card_token`, the response has a `payment_link` for the payer.
        With `card_token`, Gravv charges the saved card at once. The response
        is then HTTP 200 whatever the outcome, so check `data.status`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
            examples:
              CreateIntentOnly:
                summary: Create an intent and save the card
                value:
                  customer_id: f827e428-c497-4b21-8855-99d978909c28
                  client_customer_id: merchant-user-123
                  amount: '3.50'
                  currency: USD
                  client_reference: order-abc-123
                  save_card: true
                  destination:
                    destination_type: internal_crypto_wallet
                    id: b628ff35-429b-48f7-bcf0-6a49df106fc6
                  source:
                    source_type: external
                    methods:
                      - card
                  metadata:
                    order_id: ord_123
              CreateIntentAndCharge:
                summary: Create an intent and charge a saved card
                value:
                  customer_id: f827e428-c497-4b21-8855-99d978909c28
                  client_customer_id: merchant-user-123
                  amount: '9.99'
                  currency: USD
                  client_reference: sub-2026-10
                  card_token: tokn_80aebb6ea2594a74bc
                  destination:
                    destination_type: internal_crypto_wallet
                    id: b628ff35-429b-48f7-bcf0-6a49df106fc6
                  source:
                    source_type: external
                    methods:
                      - card
      responses:
        '200':
          description: The payment intent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentIntent'
                  error:
                    type: 'null'
              examples:
                IntentCreated:
                  summary: Intent created
                  value:
                    data:
                      intent_id: pi_429f578b-675a-4b68-abe3-856cd976257f
                      client_reference: order-abc-123
                      status: created
                      amount: '3.50'
                      currency: USD
                      created_at: '2026-10-12T10:00:00Z'
                      expires_at: '2026-10-13T10:00:00Z'
                      metadata:
                        order_id: ord_123
                      payment_link: https://checkout.example.com/pi_429f578b-675a-4b68-abe3-856cd976257f?session=eyJqd3QiOiIuLi4ifQ==
                    error: null
                ChargeProcessing:
                  summary: Saved card charged
                  value:
                    data:
                      intent_id: pi_0c6f2d7a-1b0e-4f3e-9a3d-4b5c6d7e8f90
                      client_reference: sub-2026-10
                      status: processing
                      transaction_id: 90950347-d40b-4ab9-aa77-f1882750477c
                      message: Card charged successfully
                      amount: '9.99'
                      currency: USD
                      created_at: '2026-10-12T10:00:00Z'
                      expires_at: '2026-10-13T10:00:00Z'
                    error: null
                ChargeFailed:
                  summary: Saved card declined
                  value:
                    data:
                      intent_id: pi_0c6f2d7a-1b0e-4f3e-9a3d-4b5c6d7e8f90
                      client_reference: sub-2026-10
                      status: charge_failed
                      message: 'The card has insufficient funds: payment declined'
                      amount: '9.99'
                      currency: USD
                      created_at: '2026-10-12T10:00:00Z'
                      expires_at: '2026-10-13T10:00:00Z'
                    error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/collections/cards/payment-intents/charge:
    post:
      tags:
        - Collections
      summary: Charge card
      operationId: chargeSavedCard
      description: >-
        Charges a saved card against an open payment intent, server to server.
        Use it for repeat charges after the payer saved a card. The card must
        be saved under the intent's `client_customer_id`.


        A saved card can be charged at most 5 times in 24 hours, and each
        charge can be at most 3 times the card's first payment. A declined
        charge returns HTTP 400 with a sentence such as
        `The card has insufficient funds: payment declined`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeCardRequest'
            example:
              payment_intent_id: pi_429f578b-675a-4b68-abe3-856cd976257f
              card_token: tokn_80aebb6ea2594a74bc
              first_name: Jane
              last_name: Doe
              email: jane@example.com
              billing_address1: 123 Market St
              billing_city: San Francisco
              billing_state: CA
              billing_zip: '94105'
              billing_country: US
      responses:
        '200':
          description: >-
            The charge went through, or 3D Secure is needed. For
            `requires_action`, send the payer to `next_action_url`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChargeCardResult'
                  error:
                    type: 'null'
              example:
                data:
                  transaction_id: 90950347-d40b-4ab9-aa77-f1882750477c
                  payment_intent_id: pi_429f578b-675a-4b68-abe3-856cd976257f
                  status: succeeded
                error: null
        '400':
          description: >-
            The charge failed or was declined. Read the decline code from
            `GET /v1/collections/{id}` or the failed webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'The card has insufficient funds: payment declined'
  /v1/collections/cards:
    get:
      tags:
        - Collections
      summary: Get saved cards
      operationId: listSavedCards
      description: >-
        Lists a customer's saved cards, default card first, then newest. The
        list includes cards that are not active yet; only a card with
        `is_active` true can be charged.
      parameters:
        - in: query
          name: customer_id
          required: true
          schema:
            type: string
            format: uuid
          description: The customer's ID. Always send it.
          example: f827e428-c497-4b21-8855-99d978909c28
        - in: query
          name: client_customer_id
          required: false
          schema:
            type: string
          description: >-
            When set, cards are matched by this value only, and `customer_id`
            is not used to filter.
          example: merchant-user-123
      responses:
        '200':
          description: The saved cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedCard'
                  error:
                    type: 'null'
              example:
                data:
                  - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    card_token: tokn_80aebb6ea2594a74bc
                    card_last4: '1111'
                    card_brand: visa
                    card_exp_month: '12'
                    card_exp_year: '2028'
                    is_default: true
                    is_active: true
                    cardholder_name: JANE DOE
                    is_expiring_soon: false
                    billing_info:
                      first_name: Jane
                      last_name: Doe
                      country: US
                    created_at: '2026-10-01T10:00:00Z'
                error: null
        '400':
          description: >-
            The request failed. A missing or invalid `customer_id` returns
            `invalid customer_id format: invalid input`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'invalid customer_id format: invalid input'
  /v1/collections/cards/{card_id}:
    get:
      tags:
        - Collections
      summary: Get saved card
      operationId: getSavedCard
      description: >-
        Returns one active saved card by the `id` from the list. Ignore
        `is_active` in this response: it always reads `false`.
      parameters:
        - in: path
          name: card_id
          required: true
          schema:
            type: string
            format: uuid
          description: The saved card `id`, not the card token
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        '200':
          description: The saved card
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SavedCard'
                  error:
                    type: 'null'
              example:
                data:
                  id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  card_token: tokn_80aebb6ea2594a74bc
                  card_last4: '1111'
                  card_brand: visa
                  card_exp_month: '12'
                  card_exp_year: '2028'
                  is_default: true
                  is_active: false
                  is_expiring_soon: false
                  created_at: '2026-10-01T10:00:00Z'
                error: null
        '400':
          description: >-
            The request failed. An unknown or inactive card returns
            `saved card not found or inactive: resource not found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'saved card not found or inactive: resource not found'
    delete:
      tags:
        - Collections
      summary: Delete saved card
      operationId: deleteSavedCard
      description: >-
        Removes a saved card. Send the owner's `customer_id` and the
        `card_token` in the body: the card deleted is the one named by
        `card_token`, not by the path. A request without a body fails with
        `EOF`. A token that matches no active card returns
        `card already deleted`.
      parameters:
        - in: path
          name: card_id
          required: true
          schema:
            type: string
          description: The saved card `id`. It does not choose the card.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCardRequest'
            example:
              customer_id: f827e428-c497-4b21-8855-99d978909c28
              card_token: tokn_80aebb6ea2594a74bc
      responses:
        '200':
          description: The card was deleted, or was already deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        enum:
                          - card deleted successfully
                          - card already deleted
                        example: card deleted successfully
                  error:
                    type: 'null'
              example:
                data:
                  success: true
                  message: card deleted successfully
                error: null
        '400':
          description: >-
            The request failed. A card saved under another customer returns
            `card does not belong to customer: permission denied`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'card_token is required: invalid input'
