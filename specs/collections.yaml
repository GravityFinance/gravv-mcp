openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    This is the API Gateway for Gravv services.
    Use the `Api-Key` header for authentication.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required for POST requests. Reuse it only to retry the same request. A
        400 is stored with the key for 24 hours, so use a new key after you fix
        a rejected body.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: order_789_attempt_1
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: >-
        Optional ID of the payer's device. On a payment intent it is stored
        and reused for later saved-card charges.
      schema:
        type: string
      example: device-7f3a9c
  schemas:
    ErrorResponse:
      type: object
      properties:
        data:
          type: 'null'
          example: null
        error:
          type: string
          example: 'amount: amount has too many decimal places'
    Amount:
      type: string
      description: >-
        Amount in major units, as a string with at most 2 decimal places. It
        must be greater than zero and inside the allowed range for the method.
      example: '50.00'
    Network:
      type: string
      description: Settlement network
      enum:
        - polygon
        - ethereum
        - base
        - stellar
        - solana
        - avalanche
      example: polygon
    Metadata:
      type: object
      description: >-
        Your own data, returned in webhooks for this collection. At most 50
        keys. The keys `provider_response`, `internal_transaction_id` and
        `system_metadata` are reserved. For `bank_transfer`, put the payer's
        bank account number in `bank_account_number`.
      additionalProperties: true
      properties:
        bank_account_number:
          type: string
          description: The payer's bank account number, for `bank_transfer`
          example: '0123456789'
      example:
        order_id: '12345'
    CollectionSource:
      title: External source
      type: object
      required:
        - source_type
        - methods
      properties:
        source_type:
          type: string
          enum:
            - external
          example: external
        methods:
          type: array
          minItems: 1
          description: >-
            Payment methods to offer. Send one group only: `card`, `apple_pay`
            and `google_pay` together, or `bank_transfer` alone. `pix` and
            `mobile_money` are not available in any country, so a request with
            them is rejected. Availability depends on the customer's address
            country.
          items:
            type: string
            enum:
              - card
              - apple_pay
              - google_pay
              - pix
              - bank_transfer
              - mobile_money
          example:
            - card
    InternalDestination:
      title: Internal destination
      type: object
      required:
        - destination_type
        - id
      properties:
        destination_type:
          type: string
          description: Type of internal destination
          enum:
            - internal_account
            - internal_crypto_wallet
          example: internal_crypto_wallet
        id:
          type: string
          format: uuid
          description: >-
            An account ID for `internal_account`, or a wallet ID for
            `internal_crypto_wallet`
          example: 88d645b6-6d27-4d20-ae1b-9469343156fa
    ExternalCryptoDestination:
      title: External crypto wallet
      type: object
      required:
        - destination_type
        - wallet_address
        - network
      properties:
        destination_type:
          type: string
          enum:
            - external_crypto_wallet
          example: external_crypto_wallet
        wallet_address:
          type: string
          minLength: 26
          description: >-
            Address of the external wallet. Gravv checks only its length, so
            check that the address is on `network`. Funds sent to a wrong
            address are lost.
          example: '0x445906a6766927c5da8b2fca0e0db5d7b5565ef8'
        network:
          $ref: '#/components/schemas/Network'
    Destination:
      oneOf:
        - $ref: '#/components/schemas/InternalDestination'
        - $ref: '#/components/schemas/ExternalCryptoDestination'
    CollectionRequest:
      type: object
      required:
        - customer_id
        - client_customer_id
        - amount
        - currency
        - source
        - destination
      properties:
        customer_id:
          type: string
          format: uuid
          description: >-
            Your Gravv customer. The customer record must have a phone number
            and a date of birth. Its address country decides which methods are
            available; there is no `country` field.
          example: 04dfb2e5-1274-4214-b5fd-3415fde7dc17
        client_customer_id:
          type: string
          description: Your own reference for the customer
          example: checkers_user
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: >-
            Amount in major units, as a string with at most 2 decimal places.
            For card methods it is a USD amount, whatever `currency` you send.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: >-
            Three-letter ISO 4217 code in upper case. For `bank_transfer`, use
            the local currency of the customer's country.
          example: USD
        asset:
          type: string
          description: >-
            Stablecoin to settle in, such as `USDC` or `USDT`. If you leave it
            out, USD settles as USDC, and a local currency settles as its
            tokenized asset where there is one.
          example: USDC
        network:
          allOf:
            - $ref: '#/components/schemas/Network'
          description: >-
            Settlement network. If you send it, it must match the destination
            network.
        client_reference:
          type: string
          description: >-
            Your reference. It must be unique across your collections and
            payment intents. Gravv generates one if you leave it out.
          example: order-1001
        is_anonymous:
          type: boolean
          default: false
          description: When true, the payer's name and email are not sent to the card checkout
        save_card:
          type: boolean
          default: false
          description: Ask the card checkout to save the card
        metadata:
          $ref: '#/components/schemas/Metadata'
        source:
          $ref: '#/components/schemas/CollectionSource'
        destination:
          $ref: '#/components/schemas/Destination'
    OnrampStatus:
      type: string
      description: >-
        The step the collection is at. Until 2026-10-31T23:59:59Z this has the
        old label, such as `provider_success`. After that date it has the new
        label, such as `payment_succeeded`. Read `new_onramp_status` to get the
        new label today.
      enum:
        - created
        - initialized
        - initialize
        - pending
        - awaiting_capture
        - provider_initiated
        - provider_success
        - provider_failed
        - provider_voided
        - transfer_queued
        - transfer_initialized
        - transfer_success
        - transfer_failed
        - transfer_completed
        - settlement_abandoned
        - abandoned
        - expired
        - cancelled
        - refund_initiated
        - refunded
        - refund_failed
        - chargeback_opened
        - chargeback_won
        - chargeback_lost
        - suspected_fraud
        - pending_review
      x-not-yet-live-values:
        - settlement_abandoned
      example: provider_success
    NewOnrampStatus:
      type: string
      description: >-
        The step the collection is at, with the new label. Sent until
        2026-10-31T23:59:59Z, when `onramp_status` takes the same values.
      enum:
        - created
        - initialized
        - initialize
        - pending
        - awaiting_capture
        - payment_initiated
        - payment_succeeded
        - payment_failed
        - payment_voided
        - settlement_queued
        - settlement_initiated
        - settlement_succeeded
        - settlement_failed
        - settlement_completed
        - settlement_abandoned
        - abandoned
        - expired
        - cancelled
        - refund_initiated
        - refunded
        - refund_failed
        - chargeback_opened
        - chargeback_won
        - chargeback_lost
        - suspected_fraud
        - pending_review
      x-not-yet-live-values:
        - settlement_abandoned
      example: payment_succeeded
    StatusTransitionDeadline:
      type: string
      format: date-time
      description: When `onramp_status` switches to the new labels. Sent until then.
      example: '2026-10-31T23:59:59Z'
    Collection:
      type: object
      description: >-
        The new collection. Card methods return `payment_link`. `bank_transfer`
        returns `instruction`, `bank_info`, `account`, `converted_amount` and
        `rate`.
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Collection ID. Use it with `GET /v1/collections/{id}`.
          example: 07b655cc-3dbd-4f6c-a16c-4657946d2e08
        status:
          type: string
          description: Always `created` when the collection is made
          enum:
            - created
          example: created
        onramp_status:
          type: string
          description: >-
            Always `initialized` here. Read the step from
            `GET /v1/collections/{id}`.
          enum:
            - initialized
          example: initialized
        new_onramp_status:
          type: string
          enum:
            - initialized
          example: initialized
        status_transition_deadline:
          $ref: '#/components/schemas/StatusTransitionDeadline'
        payment_link:
          type: string
          format: uri
          description: Card checkout link. Send the payer here.
          example: https://checkout.example.com/payment/07b655cc-3dbd-4f6c-a16c-4657946d2e08
        instruction:
          type: string
          description: HTML payment instructions to show the payer
          example: <p>You have a pending payment.</p>
        bank_info:
          type: object
          description: The account the payer sends funds to
          properties:
            account_number:
              type: string
            bank_name:
              type: string
            account_name:
              type: string
        account:
          type: string
          description: The payer account used
          example: '0123456789'
        client_reference:
          type: string
          description: Your reference, or the one Gravv generated
          example: order-1001
        country:
          type: string
          description: The customer's country code
          example: NG
        currency:
          type: string
          example: USD
        amount:
          type: string
          example: '50.00'
        asset:
          type: string
          description: Settlement asset
          example: USDC
        network:
          type: string
          description: Settlement network
          example: polygon
        converted_amount:
          type: string
          description: Amount in the settlement asset. `0.00` for card methods.
          example: '0.00'
        rate:
          type: string
          description: Rate used. `0.00` for card methods.
          example: '0.00'
    CollectionDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Internal record ID. It is not the collection ID: do not use it with
            this endpoint.
          example: 5b0d7c1e-2f7e-4c55-9a51-0d4c1a6c2e11
        transaction_status:
          type: string
          description: >-
            Status of the collection. `pending` also covers expired, cancelled
            and voided collections; read `onramp_status` for the step.
          enum:
            - pending
            - completed
            - failed
            - refunded
            - refund_pending
            - disputed
          example: completed
        onramp_status:
          $ref: '#/components/schemas/OnrampStatus'
        new_onramp_status:
          $ref: '#/components/schemas/NewOnrampStatus'
        status_transition_deadline:
          $ref: '#/components/schemas/StatusTransitionDeadline'
        amount:
          type: string
          example: '50.00'
        asset:
          type: string
          example: USDC
        network:
          type: string
          example: polygon
        customer_id:
          type: string
          format: uuid
        client_reference:
          type: string
        fee_cents:
          type: integer
          description: Always 0. Collection fees are billed to you separately.
          example: 0
        total_amount_cents:
          type: integer
          description: The amount in cents
          example: 5000
        country:
          type: string
          description: Country name, such as `Nigeria`
        currency:
          type: string
          description: Currency name, such as `United States Dollar`
        payment_method:
          type: string
          description: Method display name, such as `Credit/Debit Card`
        payment_status:
          type: string
          description: Payment status reported by the payment network
        transaction_source:
          type: string
          enum:
            - card
            - bank_transfer
            - mobile_money
            - wire_transfer
            - pix
            - digital_wallet
          example: card
        instruction:
          type: string
        destination_wallet_address:
          type: string
        web3_tx_hash:
          type: string
          description: On-chain hash. Set once the collection settles.
        error_code:
          type: string
          description: >-
            Machine code when the collection failed, such as `ABANDONED` or a
            decline code like `INSUFFICIENT_FUNDS`.
          example: ABANDONED
        error_message:
          type: string
          description: A short sentence for `error_code`
          example: The payment was not completed by the customer
        card_brand:
          type: string
        card_last4:
          type: string
        approval_state:
          type: string
          enum:
            - approved
            - pending
            - declined
        avs_response_code:
          type: string
        avs_response_description:
          type: string
        cvv_response_code:
          type: string
        cvv_response_description:
          type: string
        three_ds_status:
          type: string
          example: not_required
        decline_code:
          type: string
        decline_reason:
          type: string
        decline_hint:
          type: string
        created_at:
          type: string
          format: date-time
        status_updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        enriched_info:
          type: object
          description: Payer details. Sent only when `enrich=true`.
          additionalProperties: true
        events:
          type: array
          description: Status history
          items:
            type: object
            properties:
              event_type:
                type: string
                example: payment_initiated
              title:
                type: string
              date:
                type: string
                format: date-time
    CreatePaymentIntentRequest:
      type: object
      required:
        - customer_id
        - client_customer_id
        - amount
        - currency
        - destination
        - source
      properties:
        customer_id:
          type: string
          format: uuid
          description: >-
            Your Gravv customer. The customer record must have a phone number
            and a date of birth.
          example: f827e428-c497-4b21-8855-99d978909c28
        client_customer_id:
          type: string
          description: >-
            Your reference for the customer. Saved cards are looked up by this
            value, so use the same one every time.
          example: merchant-user-123
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: >-
            USD amount in major units, as a string with at most 2 decimal
            places.
          example: '3.50'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        country:
          type: string
          description: >-
            Alpha-2 country code, stored on the intent. Card availability still
            uses the customer's address country.
          example: US
        client_reference:
          type: string
          description: >-
            Your reference. It must be unique across your collections and
            payment intents.
          example: order-abc-123
        card_token:
          type: string
          description: >-
            A saved card token from `GET /v1/collections/cards`. When you send
            it, the card is charged at once.
          example: tokn_80aebb6ea2594a74bc
        save_card:
          type: boolean
          default: false
          description: Ask the checkout to save the card
        redirect_url:
          type: string
          format: uri
          description: >-
            Where to send the payer after checkout. Gravv adds
            `payment_intent_id` and `client_reference` to it.
          example: https://example.com/checkout/done
        asset:
          type: string
          description: Stablecoin to settle in. If you leave it out, USD settles as USDC.
          example: USDC
        network:
          allOf:
            - $ref: '#/components/schemas/Network'
          description: Settlement network. If you send it, it must match the destination.
        metadata:
          $ref: '#/components/schemas/Metadata'
        destination:
          $ref: '#/components/schemas/Destination'
        source:
          type: object
          required:
            - source_type
            - methods
          properties:
            source_type:
              type: string
              enum:
                - external
              example: external
            methods:
              type: array
              minItems: 1
              items:
                type: string
                enum:
                  - card
              example:
                - card
    PaymentIntent:
      type: object
      properties:
        intent_id:
          type: string
          description: Payment intent ID. Send it as `payment_intent_id` to charge a card.
          example: pi_429f578b-675a-4b68-abe3-856cd976257f
        status:
          type: string
          description: >-
            `created` without a card token. With a card token: `processing`
            when the charge went through, `requires_action` for 3D Secure, or
            `charge_failed` with the reason in `message`.
          enum:
            - created
            - processing
            - requires_action
            - charge_failed
          example: created
        client_reference:
          type: string
          example: order-abc-123
        amount:
          type: string
          example: '3.50'
        currency:
          type: string
          example: USD
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 24 hours after `created_at`
        metadata:
          type: object
          additionalProperties: true
        payment_link:
          type: string
          format: uri
          description: >-
            Checkout link, without a card token. It carries a secret for this
            payment, so send it only to the payer.
        client_secret:
          type: string
          description: Sent only when Gravv could not build a payment link
        payment_key:
          type: string
          description: Sent only when Gravv could not build a payment link
        transaction_id:
          type: string
          format: uuid
          description: Collection ID, when a card token charge went through
        message:
          type: string
          description: Outcome of a card token charge
          example: Card charged successfully
        requires_action:
          type: boolean
        next_action_type:
          type: string
          enum:
            - redirect_to_url
        next_action_url:
          type: string
          format: uri
          description: The 3D Secure page to send the payer to
    ChargeCardRequest:
      type: object
      description: >-
        Billing fields are optional. A field you leave out falls back to the
        saved card's billing record, then to the customer record.
      required:
        - payment_intent_id
        - card_token
      properties:
        payment_intent_id:
          type: string
          description: The `intent_id`, with its `pi_` prefix
          example: pi_429f578b-675a-4b68-abe3-856cd976257f
        card_token:
          type: string
          description: A saved card token, saved under the intent's `client_customer_id`
          example: tokn_80aebb6ea2594a74bc
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane@example.com
        phone_number:
          type: string
          description: E.164 format
          example: '+14155551234'
        date_of_birth:
          type: string
          description: '`YYYY-MM-DD`, `MM/DD/YYYY` or `DD/MM/YYYY`'
          example: '1990-05-12'
        billing_address1:
          type: string
          example: 123 Market St
        billing_city:
          type: string
          example: San Francisco
        billing_state:
          type: string
          example: CA
        billing_zip:
          type: string
          description: Checked against the billing country
          example: '94105'
        billing_country:
          type: string
          description: ISO 3166-1 alpha-2
          example: US
    ChargeCardResult:
      type: object
      properties:
        payment_intent_id:
          type: string
          example: pi_429f578b-675a-4b68-abe3-856cd976257f
        status:
          type: string
          enum:
            - succeeded
            - requires_action
          example: succeeded
        transaction_id:
          type: string
          format: uuid
          description: Collection ID. Left out when 3D Secure is needed.
          example: 90950347-d40b-4ab9-aa77-f1882750477c
        requires_action:
          type: boolean
        next_action_type:
          type: string
          enum:
            - redirect_to_url
        next_action_url:
          type: string
          format: uri
          description: The 3D Secure page to send the payer to
    SavedCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Card ID for `GET /v1/collections/cards/{card_id}`
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        card_token:
          type: string
          description: Token to charge or delete the card
          example: tokn_80aebb6ea2594a74bc
        card_last4:
          type: string
          example: '1111'
        card_brand:
          type: string
          example: visa
        card_exp_month:
          type: string
          example: '12'
        card_exp_year:
          type: string
          example: '2028'
        is_default:
          type: boolean
          example: true
        is_active:
          type: boolean
          description: >-
            Only an active card can be charged. A card is inactive until its
            first payment settles.
          example: true
        cardholder_name:
          type: string
          example: JANE DOE
        is_expiring_soon:
          type: boolean
          description: True when the card expires within 30 days
          example: false
        billing_info:
          type: object
          description: Billing details saved with the card, when there are any
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            address1:
              type: string
            city:
              type: string
            state:
              type: string
            zip:
              type: string
            country:
              type: string
        created_at:
          type: string
          format: date-time
          example: '2026-10-01T10:00:00Z'
    DeleteCardRequest:
      type: object
      required:
        - customer_id
        - card_token
      properties:
        customer_id:
          type: string
          format: uuid
          description: The card owner's customer ID
          example: f827e428-c497-4b21-8855-99d978909c28
        card_token:
          type: string
          description: Token of the card to delete
          example: tokn_80aebb6ea2594a74bc
  responses:
    BadRequest:
      description: >-
        The request failed. Every collections error is a 400, including
        not-found; read `error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - ApiKeyAuth: []
tags:
  - name: Collections
    description: Collect payments from payers
paths:
  /v1/collections:
    post:
      tags:
        - Collections
      summary: Initiate a collection
      operationId: createCollection
      description: >-
        Starts a collection from a payer. Card methods return a `payment_link`
        for the payer. `bank_transfer` returns payment instructions and bank
        details. The funds settle in stablecoin to the destination.


        Card amounts are charged in USD. Bank transfer works in BJ, BW, BF, CM,
        CI, CG, GA, ML, MW, NG, RW, ZA, TZ, TG, UG and ZM, chosen by the
        customer's address country. For saved cards and repeat charges, use
        payment intents.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
            examples:
              CardCollection:
                summary: Card collection to a wallet
                value:
                  amount: '50.00'
                  currency: USD
                  customer_id: 04dfb2e5-1274-4214-b5fd-3415fde7dc17
                  client_customer_id: checkers_user
                  client_reference: order-1001
                  source:
                    source_type: external
                    methods:
                      - card
                  destination:
                    destination_type: internal_crypto_wallet
                    id: bccb74d8-9715-478d-bcac-9d8184a19530
              BankTransferCollection:
                summary: Bank transfer collection to an external wallet
                value:
                  amount: '15000.00'
                  currency: NGN
                  asset: USDC
                  customer_id: 04dfb2e5-1274-4214-b5fd-3415fde7dc17
                  client_customer_id: checkers_user
                  client_reference: order-1002
                  source:
                    source_type: external
                    methods:
                      - bank_transfer
                  destination:
                    destination_type: external_crypto_wallet
                    wallet_address: '0x445906a6766927c5da8b2fca0e0db5d7b5565ef8'
                    network: polygon
                  metadata:
                    bank_account_number: '0123456789'
      responses:
        '200':
          description: The collection was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Collection'
                  error:
                    type: 'null'
              examples:
                CardResponse:
                  summary: Card collection
                  value:
                    data:
                      transaction_id: 07b655cc-3dbd-4f6c-a16c-4657946d2e08
                      payment_link: https://checkout.example.com/payment/07b655cc-3dbd-4f6c-a16c-4657946d2e08
                      client_reference: order-1001
                      status: created
                      onramp_status: initialized
                      new_onramp_status: initialized
                      status_transition_deadline: '2026-10-31T23:59:59Z'
                      country: NG
                      currency: USD
                      amount: '50.00'
                      asset: USDC
                      network: polygon
                      converted_amount: '0.00'
                      rate: '0.00'
