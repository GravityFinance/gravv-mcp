          description: |
            Payload too large. The decoded document exceeds the 10 MB service
            limit, or the request body exceeded the ingress 15 MB limit. The
            ingress-layer 413 is returned as HTML by nginx and does not match
            the schema below. (gateway-level)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error:
