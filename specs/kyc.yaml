                    system.
        '409':
          description: >-
            Concurrent in-flight request with the same Idempotency-Key
            (gateway-level)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error:
                  code: CONFLICT
                  message: >-
                    A request with the same Idempotency-Key is currently being
                    processed
