          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error:
                  code: UNPROCESSABLE_ENTITY
                  message: >-
                    Idempotency-Key was previously used with a different request
                    payload
        '500':
          description: Internal processing error during document upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error:
                  code: KYC_PROCESSING_ERROR
                  message: >-
                    Document processing failed. Please verify your documents and
                    try again.
  /v1/customers/kyc/start-s2s:
    post:
      tags:
        - KYC
      summary: Initiate server-to-server KYC verification
      description: >
        Initiates server-to-server (S2S) KYC verification for a customer who has
        already uploaded the required documents using the
        `/v1/customers/kyc/upload-document` endpoint.


        This is step 2 of the S2S verification process. Before calling this
        endpoint, upload all required documents.


        For business customers, complete KYC verification for every associated
        person before starting the business's verification.


        On success, verification is initiated and the review outcome is
        delivered later by webhook. Business customers must upload a
        registration certificate first, or the request fails with a 400.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartKYCS2SRequest'
            examples:
              IndividualKYC:
                summary: Individual KYC Request
                value:
                  customer_id: aabe0a33-6716-42e2-bbca-7abf1a8bd91c
              BusinessKYC:
                summary: Business KYC Request
                value:
                  customer_id: b84d9a52-2978-43e5-9b86-eac9839e1146
      responses:
        '200':
          description: KYC verification initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartKYCS2SResponse'
              example:
                data:
                  status: pending
                  message: >-
                    KYC verification initiated. Status will be updated via
                    webhook.
                error: null
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentError'
              example:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: The customer ID provided is not valid
        '404':
          description: Customer or KYC record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              examples:
                CustomerNotFound:
                  summary: The specified customer does not exist
                  value:
                    data: null
                    error:
                      code: CUSTOMER_NOT_FOUND
                      message: >-
                        Customer not found. Please verify the customer exists in
                        our system.
                KycNotFound:
                  summary: No KYC record exists for the specified level
                  value:
                    data: null
                    error:
                      code: KYC_NOT_FOUND
                      message: KYC record not found for the specified level.
        '409':
          description: KYC already completed for this customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error:
                  code: KYC_ALREADY_COMPLETED
                  message: >-
                    KYC verification has already been completed for this
                    customer.
        '412':
          description: Required documents have not been uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NoDocuments:
                  summary: No documents uploaded for the customer
                  value:
                    data: null
                    error:
                      code: INVALID_REQUEST
                      message: >-
                        no documents found for customer; please upload required
                        documents before initiating S2S verification
                MissingIdDocument:
                  summary: Required ID document is missing
                  value:
                    data: null
                    error:
                      code: INVALID_REQUEST
                      message: missing required ID document
                MissingSelfie:
                  summary: Required selfie document is missing
                  value:
                    data: null
                    error:
                      code: INVALID_REQUEST
                      message: missing required selfie document
        '500':
          description: Internal processing error during S2S initiation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error:
                  code: KYC_PROCESSING_ERROR
                  message: failed to upload documents to verification provider
  /v1/customers/{customer_id}/kyc/documents:
