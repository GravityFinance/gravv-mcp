  /v1/customers/{customer_id}/kyc/status:
    get:
      tags:
        - KYC
      summary: Get applicant verification status
      description: >
        Retrieves the current KYC review status for a customer from the
        verification provider.


        Use this endpoint to check a customer's verification outcome after you
        initiate KYC. While a review is in progress, `reviewStatus` is `pending`
        and `reviewResult` is omitted. Once the review finishes, `reviewStatus`
        is `completed` and `reviewResult` contains the decision.
      parameters:
        - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: Current verification status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCStatusResponse'
              examples:
                Approved:
                  summary: Review approved
                  value:
                    data:
                      reviewStatus: completed
                      reviewResult:
                        reviewAnswer: approved
                      reviewDate: 2026-06-19 21:59:00+0000
                      priority: 0
                    error: null
                Rejected:
                  summary: Review rejected
                  value:
                    data:
                      reviewStatus: completed
                      reviewResult:
                        reviewAnswer: rejected
                        rejectLabels:
                          - BAD_SELFIE
                          - SCREENSHOTS
                          - UNSATISFACTORY_PHOTOS
                        reviewRejectType: RETRY
                      reviewDate: 2026-06-19 20:44:19+0000
                      priority: 0
                    error: null
                Pending:
                  summary: Review pending
                  value:
                    data:
                      reviewStatus: pending
                      priority: 0
                    error: null
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentError'
              example:
                data: null
                error:
                  code: INVALID_REQUEST
                  message: >-
                    The customer ID provided is not valid. Please verify the
                    customer ID format.
        '404':
          description: Customer or applicant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              examples:
                CustomerNotFound:
                  summary: The specified customer does not exist
                  value:
                    data: null
                    error:
                      code: CUSTOMER_NOT_FOUND
                      message: >-
                        Customer not found. Please verify the customer exists in
                        our system.
                NoApplicant:
                  summary: KYC has not been initiated for the customer
                  value:
                    data: null
                    error:
                      code: KYC_NOT_FOUND
                      message: >-
                        no applicant found for customer; KYC has not been
                        initiated
        '500':
          description: Internal processing error while retrieving status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error:
                  code: KYC_PROCESSING_ERROR
                  message: failed to retrieve applicant status
