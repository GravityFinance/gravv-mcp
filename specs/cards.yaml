  /v1/cards/{card_id}/update:
    patch:
      tags:
        - Cards
      summary: Update card status
      description: >
        Update the status of a card. You can freeze a card temporarily or block
        it permanently.


        **Status Options:**

        - `active`: Card is active, and you can use it for transactions

        - `freeze`: Card is temporarily frozen, and you can't use it until you
        reactivate it by updating the status to active

        - `blocked`: Card is permanently blocked, and you can't reactivate it
      parameters:
        - in: path
          name: card_id
          required: true
          description: The ID of the card to update
          schema:
            type: string
            format: uuid
          example: dce0192a-9b3d-440b-9500-33dc9ac8dc20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardStatusRequest'
            examples:
              FreezeCard:
                summary: Freeze a card
                value:
                  status: freeze
              ActivateCard:
                summary: Activate a card
                value:
                  status: active
              BlockCard:
                summary: Block a card
                value:
                  status: blocked
      responses:
        '200':
          description: Card status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCardStatusResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgumentError'
              example:
                data: null
                error:
                  code: INVALID_ARGUMENT
                  message: >-
                    Invalid status value. Must be one of: active, freeze,
                    blocked
                  details: {}
        '404':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              example:
                data: null
                error:
                  code: NOT_FOUND
                  message: Card not found
                  details: {}
