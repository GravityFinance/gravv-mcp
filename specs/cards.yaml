openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    The API gateway for Gravv services.
    Send your API key in the `Api-Key` header to authenticate.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        1 to 255 printable ASCII characters. A retry with the same key within 24
        hours returns the first response. Use a new key for each new card or
        withdrawal, and the same key to retry a failed one.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: issue-card-jane-1
    CardIdPath:
      name: card_id
      in: path
      required: true
      description: ID of the card
      schema:
        type: string
        format: uuid
      example: dce0192a-9b3d-440b-9500-33dc9ac8dc20
    ClientPublicKey:
      name: X-Client-Public-Key
      in: header
      required: true
      description: >-
        Your RSA public key in PEM form (`PUBLIC KEY` or `RSA PUBLIC KEY`), then
        base64-encoded with the standard alphabet. Use a key of 2048 bits or
        more.
      schema:
        type: string
      example: LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0K...
  schemas:
    CardStatus:
      type: string
      description: >-
        `active` can spend. `freeze` is a temporary hold. `blocked` is permanent.
        `inactive` is issued but not yet activated. An empty value is an
        application with no card yet.
      enum:
        - active
        - freeze
        - blocked
        - inactive
        - ''
      example: active
    ApplicationStatus:
      type: string
      description: >-
        Wait for `approved` before you issue a card. `needs_verification` means
        the cardholder must open `application_link`.
      enum:
        - approved
        - pending
        - needs_information
        - needs_verification
        - manual_review
        - denied
        - locked
        - canceled
        - ''
      example: approved
    BillingAddress:
      type:
        - object
        - 'null'
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country_iso_code:
          type: string
    ShippingAddress:
      type: object
      description: Required for a physical card. `address_line2` is not read.
      required:
        - address_line1
        - city
        - postal_code
        - country_code
        - phone_number
        - method
      properties:
        address_line1:
          type: string
          maxLength: 255
          example: 201 Allen St
        city:
          type: string
          maxLength: 100
          example: New York
        state:
          type: string
          maxLength: 100
          example: New York
        postal_code:
          type: string
          description: Send it as a string, so leading zeros are kept
          example: '10002'
        country_code:
          type: string
          description: Alpha-2 code
          example: US
        phone_number:
          type: string
          minLength: 10
          maxLength: 20
          example: '12125550123'
        method:
          type: string
          enum:
            - standard
            - express
            - international
            - apc
            - uspsInternational
            - overnight
          example: standard
    Funding:
      type: object
      description: >-
        How the card is funded. `shared` joins a card group and shares its
        balance; without `card_group_id` it joins the cardholder's default
        group. `own` gives the card its own balance. Leave it out to use the
        application's group.
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - shared
            - own
        card_group_id:
          type: string
          format: uuid
          description: Only with `shared`
        ip_address:
          type: string
          description: Cardholder's IP address, for `own` on some live cards
        annual_remuneration:
          type: number
          description: Cardholder's yearly income, for `own` on some live cards
    CreateApplicationRequest:
      type: object
      required:
        - customer_id
        - account_id
        - annual_remuneration
        - estimated_monthly_limit
        - ip_address
      description: The API ignores unknown fields. Send the numbers as JSON numbers.
      properties:
        customer_id:
          type: string
          format: uuid
          description: >-
            The cardholder. Their `basic` KYC must be completed. For a business
            card, an associated person of the business.
          example: 9e3cccad-e9ae-47a0-81ee-063af0159310
        account_id:
          type: string
          format: uuid
          description: Your active account of type `card`
          example: 9b40be8d-9d74-4d2a-8897-dea3ef80ad23
        annual_remuneration:
          type: number
          exclusiveMinimum: 0
          description: Cardholder's yearly income in USD
          example: 60000
        estimated_monthly_limit:
          type: number
          exclusiveMinimum: 0
          description: Expected monthly spend in USD, not more than `annual_remuneration`
          example: 2000
        ip_address:
          type: string
          description: The cardholder's IP address
          example: 203.0.113.24
        type:
          type: string
          enum:
            - individual
            - business
          default: individual
        business_customer_id:
          type: string
          format: uuid
          description: >-
            Required with `type: business`. The business must have completed
            KYB and have a `business_name`, which is printed on the card.
        funding:
          $ref: '#/components/schemas/Funding'
    CardApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Application ID. The first card issued gets the same ID.
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
        network:
          type: string
          example: visa
        currency:
          type: string
          example: USD
        asset:
          type:
            - string
            - 'null'
          example: USDC
        status:
          description: >-
            The card's status, not the application's. It stays empty until a
            card is issued, so do not poll it for approval.
          allOf:
            - $ref: '#/components/schemas/CardStatus'
        application_link:
          type: string
          description: Verification page for the cardholder, live only. Empty when there is none.
        address:
          $ref: '#/components/schemas/BillingAddress'
    Card:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
        name_on_card:
          type: string
          example: Jane Doe
        customer_id:
          type: string
        blockchain_network:
          type: string
          example: polygon
        proxy_address:
          type:
            - string
            - 'null'
        masked_pan:
          type: string
          description: '`*******` and the last 4 digits'
          example: '*******9351'
        expiry:
          type: string
          description: >-
            `MM/YYYY`. Sandbox cards show `YYYY-MM-DD`, so parse both. Empty when
            not known.
          example: 07/2029
        network:
          type: string
          example: visa
        currency:
          type: string
          example: USD
        asset:
          type:
            - string
            - 'null'
          example: USDC
        card_type:
          type: string
          enum:
            - virtual
            - physical
        status:
          $ref: '#/components/schemas/CardStatus'
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
        shipping_address:
          oneOf:
            - $ref: '#/components/schemas/ShippingAddress'
            - type: 'null'
        spending_controls:
          type: object
          properties:
            type:
              type: string
              enum:
                - virtual
                - physical
            activated:
              type: boolean
            daily_transaction_limit:
              type: integer
              description: The card's spending limit, in whole USD per day
              example: 50
    CardEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Card'
        error:
          type: 'null'
    CardListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
        name_on_card:
          type: string
        blockchain_network:
          type: string
        masked_pan:
          type: string
          description: The last 4 digits only
          example: '9032'
        expiry:
          type: string
          description: As stored, such as `8/2029`. Sandbox cards show `YYYY-MM-DD`.
          example: 8/2029
        network:
          type: string
        currency:
          type: string
        asset:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/CardStatus'
        card_type:
          type: string
          enum:
            - virtual
            - physical
        wallet_address:
          type: string
          description: Address that holds the card's funds
        account_id:
          type: string
          description: The card account
        proxy_address:
          type:
            - string
            - 'null'
        address:
          $ref: '#/components/schemas/BillingAddress'
    EncryptedPayload:
      type: object
      description: >-
        Decrypt `encrypted_key` with your RSA private key (RSA-OAEP, SHA-256) to
        get an AES-256 key. Then decrypt `ciphertext` with AES-256-GCM using
        `nonce` (12 bytes); the last 16 bytes of `ciphertext` are the tag. All
        three values are standard base64.
      properties:
        encrypted_key:
          type: string
        nonce:
          type: string
        ciphertext:
          type: string
    ErrorResponse:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: string
          description: What went wrong
  responses:
    BadRequest:
      description: >-
        The request failed. Every card error is a 400, including not-found.
        Read `error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            error: card does not exist
security:
  - ApiKeyAuth: []
tags:
  - name: Cards
    description: Issue and manage cards
paths:
  /v1/cards/applications/new:
    post:
      tags:
        - Cards
      summary: Create a card application
      operationId: createCardApplication
      description: >-
        Opens a card application for a customer whose `basic` KYC is completed,
        using your active `card` account. In live, apply with
        `POST /v1/risk/features/activate` and `feature_id: virtual_cards`
        instead; this route works in sandbox.


        A second call for the same customer returns the existing application,
        in the shape of `GET /v1/cards/applications/{application_id}`, and does
        not check the new body. The response has no `application_status`; read
        it from `GET /v1/cards/applications`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            example:
              customer_id: 9e3cccad-e9ae-47a0-81ee-063af0159310
              account_id: 9b40be8d-9d74-4d2a-8897-dea3ef80ad23
              annual_remuneration: 60000
              estimated_monthly_limit: 2000
              ip_address: 203.0.113.24
      responses:
        '200':
          description: The new application, or the customer's existing one
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        title: New application
                        properties:
                          message:
                            type: string
                            example: Card application request successful
                          status:
                            type: boolean
                            example: true
                          id:
                            type: string
                            format: uuid
                      - $ref: '#/components/schemas/CardApplication'
                  error:
                    type: 'null'
              example:
                data:
                  message: Card application request successful
                  status: true
                  id: a14ec356-f33d-4384-ba68-4d9bfa19765b
                error: null
        '400':
          description: A missing field, incomplete KYC, or an unusable card account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: basic level kyc needs to be completed to create an application
  /v1/cards/applications:
    get:
      tags:
        - Cards
      summary: List card applications
      operationId: listCardApplications
      description: >-
        Lists your card applications, newest first, with `application_status`.
        This is the only route that returns it. Poll it until the status is
        `approved`, or wait for the `cards.application.update` webhook. It
        takes no filters.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: items_per_page
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: A page of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            customer_id:
                              type: string
                            date_created:
                              type: string
                              format: date-time
                            date_updated:
                              type: string
                              format: date-time
                            application_status:
                              $ref: '#/components/schemas/ApplicationStatus'
                            application_link:
                              type: string
                      items_per_page:
                        type: integer
                      page:
                        type: integer
                      total_items:
                        type: integer
                      total_pages:
                        type: integer
                  error:
                    type: 'null'
              example:
                data:
                  items:
                    - id: ac21ddfc-f6ba-432c-abb3-c5e2243e8ef7
                      customer_id: 1805c3be-abca-4698-9cbd-789fc1d619eb
                      date_created: '2026-10-05T10:48:18.170061Z'
                      date_updated: '2026-10-06T15:31:40.273281Z'
                      application_status: approved
                      application_link: ''
                  items_per_page: 10
                  page: 1
                  total_items: 1
                  total_pages: 1
                error: null
  /v1/cards/applications/{application_id}:
    get:
      tags:
        - Cards
      summary: Get a card application
      operationId: getCardApplication
      description: >-
        Returns one application. Its `status` is the card's status and stays
        empty until a card is issued, so use `GET /v1/cards/applications` to
        wait for approval.
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: a14ec356-f33d-4384-ba68-4d9bfa19765b
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CardApplication'
                  error:
                    type: 'null'
              example:
                data:
                  id: a14ec356-f33d-4384-ba68-4d9bfa19765b
                  date_created: '2026-10-01T10:00:00.123456Z'
                  date_updated: '2026-10-01T10:05:00.654321Z'
                  network: visa
                  currency: USD
                  asset: USDC
                  status: ''
                  application_link: ''
                  address: null
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/cards:
    post:
      tags:
        - Cards
      summary: Create a card
      operationId: createCard
      description: >-
        Issues a virtual or physical card once the customer's application is
        `approved`. The first card gets the application's ID. Each further card
        needs a new Idempotency-Key; a customer can hold 10 cards, not counting
        blocked ones. Gravv sets a PIN for you; read it with `GET
        /v1/cards/{card_id}/pin`. Fund the card with a transfer whose
        destination is the card.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - card_limit
                - card_type
                - name_on_card
              description: The API ignores unknown fields and reports only the first problem.
              properties:
                customer_id:
                  type: string
                  format: uuid
                  example: 9e3cccad-e9ae-47a0-81ee-063af0159310
                card_limit:
                  type: number
                  exclusiveMinimum: 0
                  description: Spending limit in whole USD per day. Decimals are dropped.
                  example: 50
                card_type:
                  type: string
                  enum:
                    - virtual
                    - physical
                name_on_card:
                  type: string
                  maxLength: 100
                  example: Jane Doe
                shipping_address:
                  $ref: '#/components/schemas/ShippingAddress'
                funding:
                  $ref: '#/components/schemas/Funding'
            example:
              customer_id: 9e3cccad-e9ae-47a0-81ee-063af0159310
              card_limit: 50
              card_type: virtual
              name_on_card: Jane Doe
      responses:
        '200':
          description: The card is issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Card creation request is processing
                      status:
                        type: boolean
                      id:
                        type: string
                        format: uuid
                      fee_charged:
                        type: boolean
                        description: Always false
                  error:
                    type: 'null'
              example:
                data:
                  message: Card creation request is processing
                  status: true
                  id: dce0192a-9b3d-440b-9500-33dc9ac8dc20
                  fee_charged: false
                error: null
        '400':
          description: >-
            Invalid field, no approved application, the card cap reached, or the
            card could not be created. Field errors use names such as
            `CardLimit` and `CountryISOCode`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: card application is not yet approved!
    get:
      tags:
        - Cards
      summary: List cards
      operationId: listCards
      description: >-
        Lists your cards, newest first. Applications with no card yet are
        included with an empty `status`; send
        `status=active,freeze,blocked,inactive` to list cards only.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: items_per_page
          schema:
            type: integer
            minimum: 1
            default: 10
        - in: query
          name: status
          schema:
            type: string
          description: One or more card statuses, comma-separated
          example: active,freeze
        - in: query
          name: card_type
          schema:
            type: string
          description: '`virtual`, `physical` or both, comma-separated'
        - in: query
          name: customer_id
          schema:
            type: string
        - in: query
          name: card_id
          schema:
            type: string
      responses:
        '200':
          description: A page of cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CardListItem'
                      items_per_page:
                        type: integer
                      page:
                        type: integer
                      total_items:
                        type: integer
                      total_pages:
                        type: integer
                  error:
                    type: 'null'
  /v1/cards/{card_id}:
    get:
      tags:
        - Cards
      summary: Get a card
      operationId: getCard
      description: >-
        Returns one card without its full number. `daily_transaction_limit` is
        the card's only limit. The format of `masked_pan` and `expiry` differs
        from the list.
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      responses:
        '200':
          description: The card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEnvelope'
              example:
                data:
                  id: dce0192a-9b3d-440b-9500-33dc9ac8dc20
                  date_created: '2026-10-10T13:04:36.544962Z'
                  date_updated: '2026-10-13T17:57:26.56108Z'
                  name_on_card: Jane Doe
                  customer_id: 9e3cccad-e9ae-47a0-81ee-063af0159310
                  blockchain_network: polygon
                  proxy_address: null
                  masked_pan: '*******9351'
                  expiry: 07/2029
                  network: visa
                  currency: USD
                  asset: USDC
                  card_type: virtual
                  status: active
                  billing_address: null
                  shipping_address: null
                  spending_controls:
                    type: virtual
                    activated: true
                    daily_transaction_limit: 50
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/cards/{card_id}/balance:
    get:
      tags:
        - Cards
      summary: Get a card balance
      operationId: getCardBalance
      description: >-
        Returns what the card can spend and the balance of its card group, in
        USD as JSON numbers. `balance` is 0 unless the card is `active`.
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      responses:
        '200':
          description: The balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      balance:
                        type: number
                      group_balance:
                        type: number
                        description: Balance shared by the cards in the group
                      currency:
                        type: string
                        example: USD
                      shared:
                        type: boolean
                        description: True when several cards share the group
                      card_group_id:
                        type: string
                        format: uuid
                  error:
                    type: 'null'
              example:
                data:
                  balance: 22.5
                  group_balance: 22.5
                  currency: USD
                  shared: false
                  card_group_id: 3f1d0c5e-2a8b-4b7e-9f3a-6c1e2d4b5a70
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/cards/{card_id}/sensitive-details:
    get:
      tags:
        - Cards
      summary: Get card sensitive details
      operationId: getCardSensitiveDetails
      description: >-
        Returns the full card number and CVV, encrypted to your RSA public key.
        The decrypted text is `{"pan": "...", "cvv": "..."}`; it has no expiry.
        Decrypt it only in a secure client, and never log it.
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
        - $ref: '#/components/parameters/ClientPublicKey'
      responses:
        '200':
          description: The encrypted details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EncryptedPayload'
                  error:
                    type: 'null'
        '400':
          description: Missing or invalid key header, or an unknown card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: x_client_public_key is required
  /v1/cards/{card_id}/pin:
    get:
      tags:
        - Cards
      summary: Get a card PIN
      operationId: getCardPin
      description: >-
        Returns the card PIN, encrypted to your RSA public key in the same way
        as the sensitive details. The decrypted text is `{"pin": "4821"}`. Only
        the first 6 characters of a PIN are returned.
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
        - $ref: '#/components/parameters/ClientPublicKey'
      responses:
        '200':
          description: The encrypted PIN
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EncryptedPayload'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
    put:
      tags:
        - Cards
      summary: Set a card PIN
      operationId: updateCardPin
      description: >-
        Sets a new PIN. Send 4 digits as a string. A weak PIN such as `1234` can
        be refused. This route needs no Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - card_pin
              properties:
                card_pin:
                  type: string
                  example: '4821'
            example:
              card_pin: '4821'
      responses:
        '200':
          description: The PIN is set
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    example: card pin updated successfully
                  error:
                    type: 'null'
              example:
                data: card pin updated successfully
                error: null
        '400':
          description: The PIN is missing or was refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: card pin update failed
  /v1/cards/{card_id}/update:
    patch:
      tags:
        - Cards
      summary: Update a card's status and limit
      operationId: updateCardStatus
      description: >-
        Freezes, unfreezes or blocks a card, and sets its daily limit. Always
        send `limit` with `status`. A call without `limit` sets the limit to 0,
        which stops a live card from spending. To change only the limit, send
        the current status with the new limit.


        `blocked` is permanent. Allowed changes are `active` to `freeze` or
        `blocked`, `freeze` to `active` or `blocked`, and `inactive` to
        `active` or `blocked`. Gravv sends the `cards.status.update` webhook
        when the status changes. This route needs no Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - limit
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - freeze
                    - blocked
                limit:
                  type: integer
                  minimum: 0
                  description: Daily limit in whole USD. Send it on every call.
                  example: 200
            examples:
              Freeze:
                summary: Freeze a card
                value:
                  status: freeze
                  limit: 200
              Unfreeze:
                summary: Unfreeze a card
                value:
                  status: active
                  limit: 200
              Block:
                summary: Block a card permanently
                value:
                  status: blocked
                  limit: 200
      responses:
        '200':
          description: The updated card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEnvelope'
        '400':
          description: >-
            Invalid status or limit, a blocked card, or a change that is not
            allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: card is blocked and cannot be updated
  /v1/cards/withdraw:
    post:
      tags:
        - Cards
      summary: Withdraw from a card
      operationId: withdrawFromCard
      description: >-
        Moves money from an `active` card back to its card account. Some cards,
        including every new sandbox card, return the error `this card withdraws
        by transfer`. For those, send a `POST /v1/transfer` from the card to its
        card account. Retry a failed call with the same Idempotency-Key. Gravv
        also sends the result as the `cards.transaction.withdraw` webhook.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - card_id
                - amount
              properties:
                card_id:
                  type: string
                  format: uuid
                  example: dce0192a-9b3d-440b-9500-33dc9ac8dc20
                amount:
                  type: number
                  exclusiveMinimum: 0
                  description: >-
                    USD, as a JSON number with at most 2 decimal places, not more
                    than the card's `balance`
                  example: 20
            example:
              card_id: dce0192a-9b3d-440b-9500-33dc9ac8dc20
              amount: 20
      responses:
        '200':
          description: The withdrawal is done
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tx_hash:
                        type: string
                  error:
                    type: 'null'
              example:
                data:
                  tx_hash: '0x2e5d0af9189b4b4c23bc64b96295e730609ec91e50e452a5da0a4af4bfe5c192'
                error: null
        '400':
          description: The card is not active, the balance is too low, or the card withdraws by transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error: 'this card withdraws by transfer: send a transfer from the card to its account'
