  /v1/cards/{card_id}/sensitive-details:
    get:
      tags:
        - Cards
      summary: View card sensitive details
      description: >
        Retrieve encrypted sensitive card details, such as `cvv` and
        `card_number`.


        **Security Requirements:**


        1. Generate RSA key pair (2048-bit minimum).

        2. Base64-encode the PEM-formatted public key, including the
           `-----BEGIN PUBLIC KEY-----` and `-----END PUBLIC KEY-----`
           markers and the newlines between them.

        3. Send encoded public key in `X-Client-Public-Key` header.

        4. Server returns `cvv` and `card_number` encrypted with your
           public key.

        5. Decrypt response using your private key.
      parameters:
        - in: path
          name: card_id
          required: true
          description: The ID of the card to retrieve sensitive details for
          schema:
            type: string
            format: uuid
          example: dce0192a-9b3d-440b-9500-33dc9ac8dc20
        - in: header
          name: X-Client-Public-Key
          required: true
          description: >-
            Base64-encoded PEM-formatted RSA public key used to encrypt the
            response. Encode the entire `public.pem` file contents, including
            the `-----BEGIN PUBLIC KEY-----` and `-----END PUBLIC KEY-----`
            markers and the newlines between them.
          schema:
            type: string
          example: LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KTUlJQklqQU5CZ2txaGtpRzl3MEJBUUVGQUFPQ0FROEFNSUlCQ2dLQ0FRRUEuLi4tLS0tLUVORCBQVUJMSUMgS0VZLS0tLS0=
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCardSensitiveDetailsRequest'
            example: {}
      responses:
        '200':
          description: Encrypted card sensitive details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewCardSensitiveDetailsResponse'
              example:
                data:
                  ciphertext: >-
                    IjBkZlJMWUVXMzJ5MjdySzhWQlp1WHM5N1hzZ0szNGFSb1VScTJrbDhyazkzSmUrM0lTTXNiOCs4bmo2MW9LdDYxdkN0d0w1NSI=
                  encrypted_key: >-
                    IkUxdXhGa2c3ekpVaUJmWFlhcnVhM0dZRyt1amZJczBpMDJsak85QnIvVjkzSGxvWWxDNk1xaVlyYkNGQnJtTHFkVkwybmlFbkxDemliOUoweWI3RTg5YUFvTEZncmFkNFV0Z2cvV1ZUK29HbGZPZWRJVnREU1ZvSmNWaDMrSExnSUMybnBaTWJkelpualB6b21PcThCcGpNN09yWG1FeHUvd3pHblhpYXIyRT0i
                  nonce: Img2M29JSVVESTZ2aS90S2si
                error: null
