openapi: 3.1.0
info:
  title: Gravv API Gateway
  description: |
    This is the API Gateway for Gravv services.
    Use the `Api-Key` header for authentication.
  version: 1.0.0
servers:
  - url: https://api.gravv.xyz
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
  parameters:
    CustomerId:
      in: query
      name: customer_id
      schema:
        type: string
        format: uuid
      example: bfe261a3-3630-4781-8249-6b0ab1123235
    AccountId:
      in: query
      name: account_id
      schema:
        type: string
        format: uuid
      description: Transactions that send from or receive into this account
      example: a4d83e55-435e-41c9-9a0b-dcb99f690c95
    CardId:
      in: query
      name: card_id
      schema:
        type: string
        format: uuid
      example: c1d2e3f4-a5b6-4890-abcd-ef1234567890
    TxHash:
      in: query
      name: tx_hash
      schema:
        type: string
      description: Exact blockchain transaction hash
    WalletAddress:
      in: query
      name: wallet_address
      schema:
        type: string
      description: Sending or receiving wallet address, not case-sensitive
    Channel:
      in: query
      name: channel
      schema:
        type: string
      description: >-
        One or more channels, comma-separated, such as `ach,wire`. See the
        `channel` values on the transaction. An unknown value returns nothing.
      example: bank_transfer
    Direction:
      in: query
      name: direction
      schema:
        type: string
        enum:
          - in
          - out
    Status:
      in: query
      name: status
      schema:
        type: string
      description: >-
        One or more of `pending`, `completed`, `failed`, `waiting_approval` and
        `paused`, comma-separated
      example: completed
    TransactionType:
      in: query
      name: transaction_type
      schema:
        type: string
      description: >-
        One or more transaction types, comma-separated. See the
        `transaction_type` values on the transaction. An unknown value returns
        nothing.
      example: global_remittance
  responses:
    BadRequest:
      description: >-
        The request failed. Every transactions error is a 400, including
        not-found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error: invalid request params
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        data:
          type: 'null'
        error:
          type: string
          example: transaction not found
    TransactionStatus:
      type: string
      description: >-
        `paused` means the transfer needs something from you; see
        `POST /v1/transfer/{id}/resume`. A returned payment keeps `completed`
        and adds a new row.
      enum:
        - pending
        - completed
        - failed
        - waiting_approval
        - paused
      example: pending
    GetTransactionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Transaction'
        error:
          type: 'null'
    GetTransactionsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
            page:
              type: integer
              example: 1
            items_per_page:
              type: integer
              description: The number of items on this page, not the page size you asked for
              example: 10
            total_pages:
              type: integer
              example: 5
            total_items:
              type: integer
              description: >-
                An estimate when there is more than one page, and 0 on an empty
                page. Use `total_pages`.
              example: 48
        error:
          type: 'null'
    TransactionMetadata:
      type: object
      description: Details that depend on the transaction type. Empty fields can be null or left out.
      properties:
        authorize_time:
          type:
            - string
            - 'null'
          format: date-time
        card_id:
          type:
            - string
            - 'null'
        card_type:
          type:
            - string
            - 'null'
        declined_reason:
          type:
            - string
            - 'null'
        iban:
          type:
            - string
            - 'null'
        merchant_category:
          type:
            - string
            - 'null'
        merchant_category_code:
          type:
            - string
            - 'null'
        merchant_city:
          type:
            - string
            - 'null'
        merchant_country:
          type:
            - string
            - 'null'
        merchant_id:
          type:
            - string
            - 'null'
        merchant_name:
          type:
            - string
            - 'null'
        recipient_blockchain_memo:
          type:
            - string
            - 'null'
        recipient_blockchain_network:
          type:
            - string
            - 'null'
        recipient_crypto_asset:
          type:
            - string
            - 'null'
        recipient_institution_id:
          type:
            - string
            - 'null'
          format: uuid
        recipient_institution_name:
          type:
            - string
            - 'null'
        recipient_name:
          type:
            - string
            - 'null'
        recipient_number:
          type:
            - string
            - 'null'
        recipient_routing_number:
          type:
            - string
            - 'null'
        recipient_wallet_address:
          type:
            - string
            - 'null'
        sender_account_number:
          type:
            - string
            - 'null'
        sender_bank_name:
          type:
            - string
            - 'null'
        sender_blockchain_network:
          type:
            - string
            - 'null'
        sender_crypto_asset:
          type:
            - string
            - 'null'
        sender_name:
          type:
            - string
            - 'null'
        sender_number:
          type:
            - string
            - 'null'
        sender_routing_number:
          type:
            - string
            - 'null'
        sender_wallet_address:
          type:
            - string
            - 'null'
        session_id:
          type:
            - string
            - 'null'
        transaction_notes:
          type:
            - string
            - 'null'
        local_amount:
          type:
            - string
            - 'null'
          description: Local equivalent amount as a decimal string
          example: '4500.00'
        local_amount_currency:
          type:
            - string
            - 'null'
          description: ISO 4217 currency code for local_amount
          example: NGN
        uetr:
          type:
            - string
            - 'null'
          description: Unique end-to-end transaction reference (SWIFT UETR)
        user_email:
          type:
            - string
            - 'null'
        user_firstname:
          type:
            - string
            - 'null'
        user_id:
          type:
            - string
            - 'null'
        user_lastname:
          type:
            - string
            - 'null'
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: f77465f8-0bcd-4199-a747-c2618208c907
        amount:
          type: string
          description: Amount in `currency`, as a decimal string
          example: '5.50'
        currency:
          type:
            - string
            - 'null'
          example: USD
        balance_before:
          type: string
          example: '100.00'
        balance_after:
          type: string
          example: '105.50'
        channel:
          type: string
          enum:
            - avalanche
            - ethereum
            - solana
            - stellar
            - polygon
            - base
            - sui
            - tron
            - ach
            - wire
            - rtp
            - swift
            - sepa
            - bank_transfer
            - mobile_money
            - internal
            - swap
            - card
            - card_funding
            - card_withdrawal
            - card_payment
            - savings
            - savings_withdrawal
            - savings_interest
            - otc
          example: internal
        client_metadata:
          type:
            - string
            - 'null'
          description: The `client_metadata` sent with the transfer
          example: '{"order_id":"12345"}'
        client_reference:
          type:
            - string
            - 'null'
          example: inv-114
        customer_id:
          type: string
          format: uuid
          example: bfe261a3-3630-4781-8249-6b0ab1123235
        date_created:
          type: string
          format: date-time
          example: '2026-10-13T09:15:22.9Z'
        description:
          type: string
          example: Invoice 114
        direction:
          type: string
          enum:
            - in
            - out
          example: out
        external_id:
          type:
            - string
            - 'null'
        fee:
          type:
            - string
            - 'null'
          example: '1.5'
        metadata:
          $ref: '#/components/schemas/TransactionMetadata'
        receiving_account_id:
          type:
            - string
            - 'null'
          format: uuid
        reference:
          type: string
          format: uuid
          description: The transfer `reference`
          example: 3f0c6a8e-6b1d-4c1e-9a55-0d2f7b9e4a11
        remark:
          type:
            - string
            - 'null'
          description: Why it failed, when known
        sending_account_id:
          type:
            - string
            - 'null'
          format: uuid
        sending_account_name:
          type:
            - string
            - 'null'
          example: Acme Ops USD
        sending_account_number:
          type:
            - string
            - 'null'
          example: '4000123456'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        tenant_id:
          type: string
          format: uuid
          example: 89fa0d5e-3acf-4834-968f-6a9f0186ab59
        transaction_type:
          type: string
          description: US payouts are `bank_account`; refunds are `transfer_refund`.
          enum:
            - internal_transfer
            - crypto_transfer
            - crypto_funding
            - global_remittance
            - ach_transfer
            - wire_transfer
            - sepa_transfer
            - swift_transfer
            - fps_transfer
            - bank_transfer
            - bank_account
            - mobile_money
            - card_funding
            - card_withdrawal
            - card_payment
            - card_collection
            - account_funding
            - credit
            - debit
            - fee_charge
            - subscription_fee
            - invoice_payment
            - otc
            - transfer_refund
            - stablecoin_conversion
          example: global_remittance
        tx_hash:
          type:
            - string
            - 'null'
          description: Blockchain transaction hash
    TransactionsVolumeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            total_volume:
              type: string
              description: Sum of the matching amounts, as a decimal string
              example: '12450.75'
        error:
          type: 'null'
    ExportTransactionsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            file_content:
              type: string
              description: The file, base64-encoded
              example: aWQsZGF0ZV9jcmVhdGVkLGFtb3VudCxjdXJyZW5jeQo=
            file_name:
              type: string
              example: transactions_2026-10-13.csv
            content_type:
              type: string
              enum:
                - text/csv
                - application/json
              example: text/csv
            total_records:
              type: integer
              description: Rows in the file, at most 10
              example: 10
        error:
          type: 'null'
security:
  - ApiKeyAuth: []
tags:
  - name: Transactions
    description: Read transaction records
paths:
  /v1/transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      operationId: listTransactions
      description: >-
        Lists your transactions, newest first. Filters that take values accept
        a comma-separated list. There is no date filter; use the export for
        dates. A typo in a filter value returns an empty list, not an error.
        Page until a page is empty, using `total_pages`.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: items_per_page
          schema:
            type: integer
            minimum: 1
            default: 10
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/TxHash'
        - $ref: '#/components/parameters/WalletAddress'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/TransactionType'
      responses:
        '200':
          description: A page of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/transactions/{transaction_id}:
    get:
      tags:
        - Transactions
      summary: Get a transaction
      operationId: getTransaction
      description: >-
        Returns one transaction. Poll it after a transfer until `status` is
        `completed` or `failed`; `paused` means the transfer needs something
        from you. Not-found is a 400.
      parameters:
        - in: path
          name: transaction_id
          required: true
          description: The `transaction_id` from `POST /v1/transfer`
          schema:
            type: string
            format: uuid
          example: 8d4e2b6c-1f3a-4e7b-b0c9-5a6d7e8f9a01
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionResponse'
              example:
                data:
                  id: 8d4e2b6c-1f3a-4e7b-b0c9-5a6d7e8f9a01
                  customer_id: bb6c6022-f1d8-492f-80f0-7547134bb42f
                  amount: '250'
                  currency: USD
                  date_created: '2026-10-13T09:15:22.9Z'
                  direction: out
                  transaction_type: global_remittance
                  description: Invoice 114
                  sending_account_id: b9c2cb0d-e09a-496f-8655-d8c4b7aaf2f8
                  sending_account_name: Acme Ops USD
                  sending_account_number: '4000123456'
                  receiving_account_id: null
                  reference: 3f0c6a8e-6b1d-4c1e-9a55-0d2f7b9e4a11
                  tenant_id: 89fa0d5e-3acf-4834-968f-6a9f0186ab59
                  channel: bank_transfer
                  status: pending
                  remark: null
                  client_reference: inv-114
                  fee: '1.5'
                  tx_hash: null
                  metadata:
                    recipient_name: Ada Obi
                    local_amount: '382500'
                    local_amount_currency: NGN
                  external_id: null
                  balance_before: '10000'
                  balance_after: '9748.5'
                  client_metadata: null
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/transactions/volume:
    get:
      tags:
        - Transactions
      summary: Get transaction volume
      operationId: getTransactionsVolume
      description: >-
        Returns the sum of the matching amounts. It adds up every currency,
        direction and status you do not filter out, so filter by an account
        and `status=completed`. There is no date filter.
      parameters:
        - in: query
          name: sending_account_id
          schema:
            type: string
            format: uuid
        - in: query
          name: receiving_account_id
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/TransactionType'
      responses:
        '200':
          description: The total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsVolumeResponse'
              example:
                data:
                  total_volume: '12450.75'
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/transactions/export:
    get:
      tags:
        - Transactions
      summary: Export transactions
      operationId: exportTransactions
      description: >-
        Returns the 10 newest matching transactions as a base64 file. For more
        rows, page through `GET /v1/transactions`. CSV columns are id,
        date_created, amount, currency, direction, transaction_type, status,
        channel, description, fee, reference, tx_hash, sending_account_id,
        receiving_account_id, client_reference, balance_before and
        balance_after.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/TxHash'
        - $ref: '#/components/parameters/WalletAddress'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/TransactionType'
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: First day, as YYYY-MM-DD. Other formats are ignored.
          example: '2026-10-01'
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Last day, included, as YYYY-MM-DD. Other formats are ignored.
          example: '2026-10-13'
        - in: query
          name: export_format
          schema:
            type: string
            enum:
              - csv
              - json
            default: json
          description: Lower case only
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTransactionsResponse'
              example:
                data:
                  file_content: aWQsZGF0ZV9jcmVhdGVkLGFtb3VudCxjdXJyZW5jeQo=
                  file_name: transactions_2026-10-13.csv
                  content_type: text/csv
                  total_records: 10
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
