name: Drift

# Checks that can go stale without any change in this repository. Kept out of ci.yml: a
# schedule there would rerun the test jobs nightly, and the path filter below applies to a
# whole workflow, so an unrelated PR never fails because client-docs moved on.
#
#   spec-drift  specs/ against client-docs main (nightly, manual, and PRs that touch specs/)
#   docs-links  every docs link the server hands out still resolves (nightly and manual)
#   report      on a failed nightly run, opens or updates one issue

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "specs/**"
      - "scripts/sync-specs.ts"
      - ".github/workflows/drift.yml"

permissions:
  contents: read

jobs:
  spec-drift:
    name: vendored specs match client-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the client-docs read token
        # client-docs is private, so the checkout below needs a token with read access to it.
        env:
          CLIENT_DOCS_READ_TOKEN: ${{ secrets.CLIENT_DOCS_READ_TOKEN }}
        run: |
          if [ -z "${CLIENT_DOCS_READ_TOKEN}" ]; then
            echo "::error::The CLIENT_DOCS_READ_TOKEN secret is not set. Add a token with read access to GravityFinance/client-docs."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: GravityFinance/client-docs
          ref: main
          path: client-docs
          token: ${{ secrets.CLIENT_DOCS_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare specs/ with client-docs openapi/
        # sync-specs.ts has no dependencies, so no npm ci is needed.
        env:
          GRAVV_OPENAPI_DIR: client-docs/openapi
        run: |
          if ! npm run --silent sync-specs -- --check; then
            echo "::error::specs/ differs from client-docs main. Run GRAVV_OPENAPI_DIR=<client-docs>/openapi npm run sync-specs, then npm run generate and npm run scenarios, and commit the result."
            exit 1
          fi

  docs-links:
    name: docs links the server hands out resolve
    # The docs site, not this repository, is what changes, so a PR run would test nothing new.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check each link on the live docs site
        run: npm run docs-links

  report:
    name: open an issue for a failed nightly run
    needs: [spec-drift, docs-links]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly drift check failed"
          number="$(gh issue list --state open --search "in:title \"${title}\"" --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)"
          body="The nightly drift check failed: ${RUN_URL}"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
