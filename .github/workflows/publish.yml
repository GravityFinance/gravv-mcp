name: Publish to npm

# Publishes when a GitHub Release is published. Creating the release is the deliberate
# human step; everything after it is automatic.
#
# Authentication supports two paths, and the npm CLI picks whichever is available:
#
#   1. Trusted Publishing over OIDC — preferred. Nothing to store; npm verifies the
#      request came from this repository running this workflow file and issues a
#      short-lived token. Not subject to the account's 2FA requirement, because there is
#      no interactive session to challenge.
#
#   2. NODE_AUTH_TOKEN from the NPM_TOKEN secret — the bootstrap path. Trusted Publisher
#      settings live on a package's page, which does not exist until the package is
#      published once. This lets that first publish happen here rather than on a laptop
#      wrestling with 2FA prompts.
#
# The npm CLI detects an OIDC environment and uses it before falling back to the token,
# so having both configured is safe.
#
# After the first successful publish:
#   npmjs.com -> the package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: GravityFinance
#     Repository:           gravv-mcp
#     Workflow filename:    publish.yml
#     Allowed actions:      npm publish
#   Then delete the NPM_TOKEN secret and revoke the token — it is a long-lived
#   credential that can publish to this package and stops being needed.
#
# NOTE: the token must bypass 2FA. A classic token of type "Automation", or a granular
# token created with the bypass setting enabled. A classic "Publish" token will 403.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and pack the tarball, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure npm supports trusted publishing
        # OIDC support landed in npm 11.5.1. The npm bundled with a given Node release
        # is often older, so pin it forward explicitly rather than hoping.
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        # Publishing a version that disagrees with the tag makes the release page lie
        # about what shipped, and npm versions are immutable once published.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node --input-type=commonjs -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag is v$TAG but package.json says $PKG. Bump the version, or retag."
            exit 1
          fi
          echo "version $PKG matches tag $GITHUB_REF_NAME"

      - name: Verify the tarball contains what we expect
        # Catches an over-broad or over-narrow `files` field before it reaches the
        # registry, where the version can never be reused.
        run: |
          npm pack --dry-run
          npm pack --dry-run --json > /tmp/pack.json
          # --input-type=commonjs: package.json declares "type": "module", so a bare
          # `node -e` is evaluated as ESM (and on some Node versions as TypeScript),
          # where `require` is unavailable.
          node --input-type=commonjs -e '
            const [p] = require("/tmp/pack.json");
            const names = p.files.map(f => f.path);
            const missing = ["dist/bin/gravv-mcp.js", "dist/server.js", "README.md"]
              .filter(f => !names.includes(f));
            if (missing.length) {
              console.error("::error::tarball is missing: " + missing.join(", "));
              process.exit(1);
            }
            const leaked = names.filter(f => /^(src|test|specs|\.env)/.test(f));
            if (leaked.length) {
              console.error("::error::tarball contains unexpected files: " + leaked.join(", "));
              process.exit(1);
            }
            console.log(`tarball ok: ${names.length} files, ${(p.size/1024).toFixed(0)} kB`);
          '

      - name: Report which auth path will be used
        if: github.event_name == 'release' || inputs.dry_run == false
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is present — available as a fallback."
          else
            echo "No NPM_TOKEN secret. Publishing requires Trusted Publishing to be configured."
          fi
          echo "The npm CLI prefers OIDC when this repository is a configured trusted publisher."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        # NODE_AUTH_TOKEN is consumed by the .npmrc that setup-node wrote. The CLI uses
        # OIDC instead when this repository is a configured trusted publisher, so this
        # is a fallback rather than the primary path.
        #
        # Provenance is attached automatically when publishing a public package from a
        # public repository, letting consumers verify the artifact was built here.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "Dry run complete — all checks passed, nothing published."
