name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is the version the
        # publish job runs on, so both paths that users and CI take are covered.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Tests run against a local stub; no API key or outbound network needed.
        run: npm test

      - name: Build
        run: npm run build

  generated-in-sync:
    name: generated tools match specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # src/generated/tools.ts is build output committed to the repo. If someone edits a
      # spec or the curation layer without regenerating, the committed tools drift from
      # their source. Regenerate and fail on any diff.
      - name: Regenerate and diff
        run: |
          npm run generate
          if ! git diff --quiet -- src/generated/tools.ts; then
            echo "::error::src/generated/tools.ts is out of date. Run 'npm run generate' and commit the result."
            git diff --stat -- src/generated/tools.ts
            exit 1
          fi
          echo "generated tools are in sync with specs/"
